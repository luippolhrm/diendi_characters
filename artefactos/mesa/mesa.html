 story:{
  title:"Crónica de la Luz Naciente",
  portraitAlt:"Ilustración de Auriana Grandhe",
  sections:[
   {h:"",p:["Auriana nació durante una noche imposible: el cielo sin luna, y sobre su aldea una aurora de tonos rosados, dorados y violetas que no se veía en generaciones. Algunos la leyeron como señal del alba; otros, como bendición directa de The Everlight, diosa de la luz, la curación, la compasión y la redención. Su aldea no tenía reyes ni jerarquías: el valor de cada persona se medía por su disposición a ayudar. Creció con un mantra silencioso: nadie sana solo, nadie vive solo, nadie debe ser dejado atrás."]},
   {h:"El origen celestial",p:["Generaciones atrás, su antepasada Maera del Alba Serena se negó a abandonar a los enfermos durante una gran plaga. En sus últimos días encendió una lámpara frente a un templo derruido y pidió a The Everlight no poder ni gloria, sino una última oportunidad para aliviar el dolor. Esa noche descendió Ilyrien, la Llama Compasiva, emisario de la diosa, que bendijo su sacrificio: su linaje llevaría una chispa de luz en el alma, no como premio sino como responsabilidad.","Por eso la piel de Auriana brilla sutil como si la luz del amanecer descansara bajo ella, sus ojos viran de violeta pálido a dorado cuando sana, y el dolor ajeno la alcanza con una fuerza que al principio sintió como herida. A los cinco años sanó a un ciervo herido con solo un susurro. Sus padres cuidaron de no tratarla como una santa."]},
   {h:"El llamado y el Santuario del Alba",p:["Su primera formación fue en un monasterio de The Everlight, donde la hermana Calithra le enseñó a manejar su empatía: sentir sin perderse, ayudar sin destruirse. A los diez años, el sacerdote itinerante Ser Arveth Dalan reconoció que su don necesitaba guía profunda y la llevó al Santuario del Alba, oculto entre bosques y niebla, con un manantial cuyas aguas respondían a la intención de quien las usaba. Allí su mentor, el Maestro Erynd Valcor, le dejó grabada una lección: «No confundas compasión con rendición. La luz también debe saber ponerse de pie.»","Para ser consagrada Guardiana superó tres pruebas. En la Prueba de la Luz meditó un día entero sin respuesta, hasta comprender que la fe consiste en permanecer cuando no hay señal, y vio en el horizonte un fénix de fuego abrir las alas. En la Prueba de la Vida salvó a una loba preñada atrapada, sin magia, solo con hierbas y paciencia. En la Prueba del Perdón reconcilió a dos comunidades enfrentadas. Recibió entonces su medallón de plata con un fénix en llamas: la plata no produce luz, la refleja. Erynd le reveló que el medallón es también una llave espiritual que mostrará su propósito a su hora."]},
   {h:"La visión y la partida",p:["Tras purificar con tres días de ayuno una corrupción de hielo que enfrió el manantial, primera señal de algo mayor moviéndose en la oscuridad, Auriana tuvo una visión. The Everlight le mostró el Espejo de la Vida: un artefacto antiguo, roto, sus fragmentos dispersos guardando memoria, perdón, sacrificio y esperanza. No recibió una orden, sino una elección: quedarse, o salir a sanar una herida mucho mayor. Partió al amanecer con su medallón, su escudo y las hierbas de su madre. No por gloria: porque el mundo estaba herido, y ella no podía fingir que no lo sentía."]},
   {h:"Apariencia y carácter",p:["Aasimar de piel iridiscente y cabello plateado; ojos de violeta pálido que se tornan dorados al sanar o rezar. Viste túnicas claras bajo armadura ceremonial de marfil y plata, con el fénix grabado en su escudo. Serena, compasiva y firme. Rara vez alza la voz, pero cuando habla desde la fe, incluso quienes no creen suelen escuchar. Busca siempre la salida pacífica, pero ya no confunde misericordia con pasividad: si una vida inocente está en peligro, se interpone.","Su mayor fortaleza es la empatía, y también su mayor debilidad. Le cuesta abandonar a quien sufre, aceptar que no puede salvar a todos, y a veces carga culpas que no le pertenecen. Teme que su luz no baste para la oscuridad que ha visto. Pero sigue caminando."],quotes:["La luz no te pertenece. Pasa a través de ti. Tu deber es no cerrarle el paso.","Sanar no significa borrar toda herida. Significa impedir que la herida sea lo único que queda."]}
  ],
  people:[["Maestro Erynd Valcor","Su mentor en el Santuario del Alba: estricto, justo y devoto. Lo quiere como a un segundo padre.","Mentor"],["Ser Arveth Dalan","Sacerdote itinerante que reconoció su don a los diez años y la llevó al Santuario. Decía la verdad sin adornarla.","Mentor"],["Hermana Calithra","Monja que le enseñó a no ahogarse en el dolor ajeno. Su primera guía espiritual.","Aliada"],["Ilyrien, la Llama Compasiva","Emisario celestial de The Everlight que bendijo a su antepasada Maera. La raíz de su naturaleza aasimar.","Celestial"],["Maera del Alba Serena","Antepasada sanadora que se negó a abandonar a los enfermos durante una plaga.","Ancestro"],["La Loba del Santuario","Loba preñada que salvó sin magia en la Prueba de la Vida. Permaneció cerca del santuario, observándola.","Compañera"]],
  mysteries:["¿Qué es realmente el Espejo de la Vida, y dónde están sus fragmentos?","¿Qué origina la corrupción de hielo que enfrió el manantial?","¿Qué puerta o verdad abre la llave espiritual del medallón del fénix?","¿Cuál es la «herida mayor» que The Everlight le pidió ir a sanar?","¿Volverá a ver a Erynd, ya anciano, y al Santuario del Alba?","¿Qué propósito le revelará The Everlight cuando llegue su hora?"],
  closing:"La plata no produce luz propia; la refleja. Yo no soy la fuente: solo me niego a cerrarle el paso."
 },

  {"id": "purify", "lvl": 1, "n": "Purificar comida y bebida", "en": "Purify Food and Drink", "tag": "purifica", "src": ["ritual"], "tg": ["other"], "meta": "Nivel 1 · Transmutación · Acción o ritual · 3 m (10 ft) · V, S · instantáneo", "d": "Eliminas el veneno y la podredumbre de la comida y bebida no mágicas en una esfera de 1,5 m (5 ft) de radio centrada en un punto a 3 m (10 ft) o menos."},
  {"id": "guidingbolt", "lvl": 1, "n": "Saeta guía", "en": "Guiding Bolt", "tag": "4d6 rad · atq +5", "src": [], "tg": ["other"], "dur": "1 asalto", "meta": "Nivel 1 · Evocación · Acción · 36 m (120 ft) · V, S · 1 asalto", "d": "Lanzas un rayo de luz a una criatura a 36 m (120 ft) o menos y haces un ataque de conjuro a distancia (+5). Si aciertas, sufre 4d6 de daño radiante y la siguiente tirada de ataque contra ella antes del final de tu siguiente turno tiene ventaja.", "inst": "Ataque +5; daño 4d6 radiante.", "up": "+1d6 de daño por cada nivel por encima de 1.", "note": "Nombre Devir en Notion: «Saeta guía» (no «Dardo guía»)."},
  {"id": "sanctuary", "lvl": 1, "n": "Santuario", "en": "Sanctuary", "tag": "protege · CD 13 Sab", "src": [], "tg": ["self", "other"], "dur": "1 min", "meta": "Nivel 1 · Abjuración · Acción adicional · 9 m (30 ft) · V, S, M (un trozo de vidrio de un espejo) · 1 min", "d": "Proteges a una criatura a 9 m (30 ft) o menos. Quien quiera atacarla o lanzarle un conjuro que inflija daño debe superar primero una salvación de Sabiduría CD 13; si falla, elige otro objetivo o pierde el ataque o conjuro. No protege de efectos de área. Termina si la criatura protegida ataca, lanza un conjuro o inflige daño."},
  {"id": "spiritualweapon", "lvl": 2, "n": "Arma espiritual", "en": "Spiritual Weapon", "tag": "1d8+3 fuerza · atq +5", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 1 min", "meta": "Nivel 2 · Evocación · Acción adicional · 18 m (60 ft) · V, S · concentración hasta 1 min", "d": "Creas un arma espectral flotante en un espacio a 18 m (60 ft) o menos y haces de inmediato un ataque de conjuro cuerpo a cuerpo (+5) contra una criatura a 1,5 m (5 ft) de ella: si acierta, 1d8 + 3 de daño de fuerza (tu modificador de Sabiduría). Como acción adicional en turnos siguientes, mueves el arma hasta 6 m (20 ft) y repites el ataque.", "inst": "Ataque +5; daño 1d8+3 fuerza.", "up": "+1d8 de daño por cada nivel por encima de 2."},
  {"id": "augury", "lvl": 2, "n": "Augurio", "en": "Augury", "tag": "presagio", "src": ["ritual"], "tg": ["self"], "meta": "Nivel 2 · Adivinación · 1 minuto o ritual · Lanzador · V, S, M (palitos, huesos, cartas u otros abalorios marcados que valgan al menos 25 po) · instantáneo", "d": "Recibes un presagio sobre un curso de acción que planees en los próximos 30 minutos: Fortuna (bueno), Desdicha (malo), Fortuna y desdicha (ambos) o Indiferencia (ni bueno ni malo). No tiene en cuenta circunstancias que cambien el resultado. Cada lanzamiento adicional antes de un descanso largo tiene un 25 % acumulativo de no recibir respuesta."},
  {"id": "aid", "lvl": 2, "n": "Auxilio", "en": "Aid", "tag": "+5 PG máx ×3 · 8 h", "src": [], "tg": ["both", "other"], "dur": "8 horas", "meta": "Nivel 2 · Abjuración · Acción · 9 m (30 ft) · V, S, M (una tira de tela blanca) · 8 horas", "d": "Elige hasta tres criaturas a 9 m (30 ft) o menos. Los PG máximos y actuales de cada una aumentan en 5 hasta que termine el conjuro.", "up": "+5 PG adicionales por cada nivel por encima de 2.", "note": "Aumenta PG máximos y actuales; no es «recuperar PG», así que no gatilla Discípulo de la vida (interpretación: verificar con GM)."},
  {"id": "calm", "lvl": 2, "n": "Calmar emociones", "en": "Calm Emotions", "tag": "esfera 6 m · CD 13 Car", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 1 min", "meta": "Nivel 2 · Encantamiento · Acción · 18 m (60 ft) · V, S · concentración hasta 1 min", "d": "Cada humanoide en una esfera de 6 m (20 ft) de radio centrada en un punto a 18 m (60 ft) o menos debe superar una salvación de Carisma CD 13 o, a tu elección por criatura: queda inmune a Asustado y Hechizado (suprimiendo esos estados si ya los tenía) mientras dure, o se vuelve indiferente hacia criaturas de tu elección que considere hostiles (termina si recibe daño o ve dañar a un aliado)."},
  {"id": "findtraps", "lvl": 2, "n": "Detectar trampas", "en": "Find Traps", "tag": "trampas 36 m", "src": [], "tg": ["self"], "meta": "Nivel 2 · Adivinación · Acción · 36 m (120 ft) · V, S · instantáneo", "d": "Detectas cualquier trampa a 36 m (120 ft) o menos en tu línea de visión: objetos o mecanismos creados para dañar (incluye alarma, glifo custodio o un pozo mecánico), no peligros naturales. Sabes que existe y su naturaleza general, pero no su ubicación."},
  {"id": "gentlerepose", "lvl": 2, "n": "Dulce descanso", "en": "Gentle Repose", "tag": "preserva cadáver", "src": ["ritual"], "tg": ["other"], "dur": "10 días", "meta": "Nivel 2 · Nigromancia · Acción o ritual · Toque · V, S, M (2 piezas de cobre, que se consumen) · 10 días", "d": "Tocas un cadáver u otros restos mortales. Hasta que termine, queda protegido de la descomposición y no puede convertirse en muerto viviente. Los días bajo el conjuro no cuentan para el límite de tiempo de conjuros como alzar a los muertos."},
  {"id": "holdperson", "lvl": 2, "n": "Inmovilizar persona", "en": "Hold Person", "tag": "Paralizado · CD 13 Sab", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 1 min", "meta": "Nivel 2 · Encantamiento · Acción · 18 m (60 ft) · V, S, M (un trozo de hierro recto) · concentración hasta 1 min", "d": "Un humanoide que veas a 18 m (60 ft) o menos debe superar una salvación de Sabiduría CD 13 o queda Paralizado hasta que termine el conjuro. Al final de cada uno de sus turnos repite la salvación y se libera si la supera.", "up": "+1 humanoide objetivo por cada nivel por encima de 2."},
  {"id": "continualflame", "lvl": 2, "n": "Llama permanente", "en": "Continual Flame", "tag": "luz 6 m permanente", "src": [], "tg": ["other"], "dur": "hasta ser disipado", "meta": "Nivel 2 · Evocación · Acción · Toque · V, S, M (polvo de rubí que valga al menos 50 po, que se consume) · hasta que sea disipado", "d": "Una llama surge de un objeto que toques: luz brillante en 6 m (20 ft) de radio y tenue 6 m (20 ft) más allá. Parece fuego normal pero no da calor ni consume combustible; se puede tapar u ocultar, pero no apagar."},
  {"id": "locateobject", "lvl": 2, "n": "Localizar objeto", "en": "Locate Object", "tag": "dirección 300 m", "src": [], "tg": ["self"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 2 · Adivinación · Acción · Lanzador · V, S, M (una ramita con forma de horquilla) · concentración hasta 10 min", "d": "Describe o nombra un objeto que conozcas: presientes su dirección si está a 300 m (1000 ft) o menos, y la de su movimiento si se mueve. Puede ser un objeto concreto que hayas visto de cerca (a 9 m / 30 ft) o el más cercano de un tipo (ropa, joyas, armas…). Cualquier grosor de plomo entre ambos lo bloquea."},
  {"id": "prayerheal", "lvl": 2, "n": "Plegaria de curación", "en": "Prayer of Healing", "tag": "2d8 + desc. corto ×5", "src": [], "tg": ["both", "other"], "heals": true, "meta": "Nivel 2 · Abjuración · 10 minutos · 9 m (30 ft) · V · instantáneo", "d": "Hasta cinco criaturas de tu elección que permanezcan a 9 m (30 ft) o menos durante todo el lanzamiento obtienen los beneficios de un descanso corto y recuperan 2d8 PG. No pueden volver a beneficiarse hasta terminar un descanso largo.", "selfHeal": "2d8", "inst": "Tira 2d8 (misma tirada para todos).", "up": "+1d8 de curación por cada nivel por encima de 2."},
  {"id": "enhanceability", "lvl": 2, "n": "Potenciar característica", "en": "Enhance Ability", "tag": "ventaja pruebas · 1 h", "src": [], "tg": ["self", "other"], "conc": 1, "dur": "hasta 1 hora", "meta": "Nivel 2 · Transmutación · Acción · Toque · V, S, M (pelo de animal o una pluma) · concentración hasta 1 hora", "d": "Tocas a una criatura y eliges Fuerza, Destreza, Inteligencia, Sabiduría o Carisma. Hasta que termine, tiene ventaja en las pruebas de esa característica.", "up": "+1 criatura objetivo por cada nivel por encima de 2, con una característica distinta por objetivo si quieres."},
  {"id": "protpoison", "lvl": 2, "n": "Protección contra veneno", "en": "Protection from Poison", "tag": "quita Envenenado · 1 h", "src": [], "tg": ["self", "other"], "dur": "1 hora", "meta": "Nivel 2 · Abjuración · Acción · Toque · V, S · 1 hora", "d": "Tocas a una criatura y pones fin al estado Envenenado si lo sufre. Hasta que termine, tiene ventaja en las salvaciones para evitar o terminar Envenenado y resistencia al daño de veneno."},
  {"id": "lesserresto", "lvl": 2, "n": "Restablecimiento menor", "en": "Lesser Restoration", "tag": "quita 1 estado", "src": [], "tg": ["self", "other"], "meta": "Nivel 2 · Abjuración · Acción adicional · Toque · V, S · instantáneo", "d": "Tocas a una criatura y pones fin a uno de estos estados que tenga: Cegado, Ensordecido, Envenenado o Paralizado."},
  {"id": "silence", "lvl": 2, "n": "Silencio", "en": "Silence", "tag": "esfera 6 m sin sonido", "src": ["ritual"], "tg": ["other"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 2 · Ilusionismo · Acción o ritual · 36 m (120 ft) · V, S · concentración hasta 10 min", "d": "Creas una esfera de 6 m (20 ft) de radio centrada en un punto a 36 m (120 ft) o menos. Ningún sonido la atraviesa ni se origina dentro; las criaturas y objetos totalmente dentro son inmunes al daño de trueno, las criaturas están Ensordecidas y no se pueden lanzar conjuros con componente verbal."},
  {"id": "blinddeaf", "lvl": 2, "n": "Sordera/ceguera", "en": "Blindness/Deafness", "tag": "Cegado/Ensord. · CD 13 Con", "src": [], "tg": ["other"], "dur": "1 min", "meta": "Nivel 2 · Transmutación · Acción · 36 m (120 ft) · V · 1 min", "d": "Una criatura que veas a 36 m (120 ft) o menos debe superar una salvación de Constitución CD 13 o queda Cegada o Ensordecida (a tu elección) hasta que termine el conjuro. Al final de cada uno de sus turnos repite la salvación y se libera si la supera.", "up": "+1 criatura objetivo por cada nivel por encima de 2."},
  {"id": "wardingbond", "lvl": 2, "n": "Vínculo protector", "en": "Warding Bond", "tag": "+1 CA/salv · resist. todo", "src": [], "tg": ["other"], "dur": "1 hora", "meta": "Nivel 2 · Abjuración · Acción · Toque · V, S, M (un par de anillos de platino de al menos 50 po cada uno, que lleváis puestos tú y el objetivo) · 1 hora", "d": "Tocas a otra criatura voluntaria. Mientras esté a 18 m (60 ft) o menos de ti, gana +1 a la CA y a las salvaciones y resistencia a todo el daño, pero cada vez que reciba daño tú sufres la misma cantidad. Termina si tus PG llegan a 0, si os separáis más de 18 m (60 ft) o si se vuelve a lanzar sobre cualquiera de los dos."},
  {"id": "zonetruth", "lvl": 2, "n": "Zona de la verdad", "en": "Zone of Truth", "tag": "esfera 4,5 m · CD 13 Car", "src": [], "tg": ["other"], "dur": "10 min", "meta": "Nivel 2 · Encantamiento · Acción · 18 m (60 ft) · V, S · 10 min", "d": "Creas una esfera de 4,5 m (15 ft) de radio centrada en un punto a 18 m (60 ft) o menos. Cada criatura que entre por primera vez en un turno o empiece su turno dentro hace una salvación de Carisma CD 13; si falla, no puede mentir voluntariamente mientras esté dentro. Sabes si supera o falla. Puede evadir preguntas, pero debe ser sincera."},
  {"id": "spark", "lvl": 0, "n": "Chispa divina", "en": "Divine Spark", "tag": "1d8+3 cura o daña", "fixed": "Canalizar divinidad · CD 13", "noSlot": true, "src": ["cd"], "tg": ["other"], "meta": "Canalizar divinidad · Acción de magia · 9 m (30 ft) · instantáneo", "d": "Diriges tu símbolo sagrado a otra criatura que veas a 9 m (30 ft). Tiras 1d8 + 3 (Sab) y eliges: la criatura recupera ese total de PG, o hace salvación de Constitución CD 13 y sufre ese daño necrótico o radiante (a tu elección), la mitad si la supera. Sube a 2d8 a Clériga 7.", "inst": "Tira 1d8+3: cura ese total o salvación de Constitución CD 13 para dañar.", "heals": false},
  {"id": "preserve", "lvl": 0, "n": "Preservar vida", "en": "Preserve Life", "tag": "15 PG a repartir", "fixed": "Canalizar divinidad · CD 13", "noSlot": true, "src": ["cd"], "tg": ["other"], "meta": "Canalizar divinidad · Acción de magia · 9 m (30 ft) · instantáneo", "d": "Generas 15 PG (5 × nivel de clériga) y los repartes entre criaturas maltrechas a 9 m (30 ft), incluida tú. Nadie puede pasar de la mitad de sus PG máximos.", "inst": "Reparte hasta 15 PG entre criaturas maltrechas; ninguna supera la mitad de su máximo."},
  {"id": "turn", "lvl": 0, "n": "Expulsar muertos vivientes", "en": "Turn Undead", "tag": "CD 13 Sab · 9 m", "fixed": "Canalizar divinidad · CD 13", "noSlot": true, "src": ["cd"], "tg": ["other"], "dur": "1 min", "meta": "Canalizar divinidad · Acción de magia · 9 m (30 ft) · 1 min", "d": "Cada muerto viviente que elijas a 9 m (30 ft) hace salvación de Sabiduría CD 13. Si falla, queda Asustado e Incapacitado 1 minuto e intenta alejarse de ti. Termina antes si sufre daño, si quedas Incapacitada o si mueres.", "inst": "Cada muerto viviente salva Sabiduría CD 13 o queda Asustado e Incapacitado 1 minuto."},
  {"id": "hands", "lvl": 0, "n": "Manos curativas", "en": "Healing Hands", "tag": "2d4 PG", "fixed": "Aasimar · rasgos de especie", "noSlot": true, "src": ["hands"], "tg": ["self", "other"], "meta": "Rasgo de especie · Acción de magia · Toque · 1 por descanso largo", "d": "Tocas a una criatura y tiras 2d4 (tantos d4 como tu competencia); recupera ese total de PG. No es un conjuro: no aplica Discípulo de la vida.", "selfHeal": "2d4", "inst": "Tira 2d4."},
  {"id": "wings", "lvl": 0, "n": "Revelación celestial: Alas celestiales", "en": "Celestial Revelation: Heavenly Wings", "tag": "vuelo 9 m · 1 min", "fixed": "Aasimar · rasgos de especie", "noSlot": true, "src": ["revel"], "tg": ["self"], "dur": "1 min", "meta": "Rasgo de especie · Acción adicional · 1 min · 1 por descanso largo", "d": "Te brotan dos alas espectrales: velocidad volando igual a tu velocidad (9 m / 30 ft). Una vez en cada uno de tus turnos, +2 de daño radiante a un objetivo al que dañes con un ataque o conjuro."},
  {"id": "glow", "lvl": 0, "n": "Revelación celestial: Fulgor interior", "en": "Celestial Revelation: Inner Radiance", "tag": "luz · 2 rad en área", "fixed": "Aasimar · rasgos de especie", "noSlot": true, "src": ["revel"], "tg": ["self"], "dur": "1 min", "meta": "Rasgo de especie · Acción adicional · 1 min · 1 por descanso largo", "d": "Emites luz brillante en 3 m (10 ft) y tenue 3 m más. Al final de cada uno de tus turnos, cada criatura a 3 m sufre 2 de daño radiante. Además, una vez por turno, +2 de daño radiante a un objetivo al que dañes."},
  {"id": "shroud", "lvl": 0, "n": "Revelación celestial: Mortaja necrótica", "en": "Celestial Revelation: Necrotic Shroud", "tag": "miedo · CD 8", "fixed": "Aasimar · rasgos de especie", "noSlot": true, "src": ["revel"], "tg": ["self"], "dur": "1 min", "meta": "Rasgo de especie · Acción adicional · 1 min · 1 por descanso largo", "d": "Tus ojos se vuelven pozos de oscuridad. Las criaturas que no sean aliadas a 3 m (10 ft) deben superar una salvación de Carisma CD 8 (8 + Car −2 + competencia 2) o quedan Asustadas hasta el final de tu siguiente turno. Una vez por turno, +2 de daño necrótico a un objetivo al que dañes.", "note": "🟡 Con Carisma 7 la CD 8 es muy baja; Alas o Fulgor suelen rendir más."}
 ]
};

window.CHAR.tree={"maxTotal": 20, "note": "Fuente: PHB 2024, capítulo 3 (Clérigo) en Notion. Los cuatro dominios dan rasgos en los niveles 3, 6 y 17; el Dominio de la vida ya está elegido.", "cols": [{"cls": "Clérigo", "tone": "sand", "max": 20, "sub": {"at": 3, "label": "Dominio divino", "chosen": "vida", "opts": [{"id": "guerra", "n": "Dominio de la guerra", "en": "War Domain", "tag": "Inspira valor y castiga a los enemigos.", "lv": {"3": [["Conjuros de dominio", "Siempre preparados: nv 3 Arma espiritual, Arma mágica, Escudo de fe, Saeta guía · nv 5 Espíritus guardianes, Manto del cruzado · nv 7 Escudo de fuego, Libertad del movimiento · nv 9 Golpe de viento acerado, Inmovilizar monstruo."], ["Golpe guiado", "Cuando tú o una criatura a 9 m (30 ft) o menos falléis una tirada de ataque, gasta un uso de Canalizar divinidad para dar +10 a la tirada. Si es para otra criatura, requiere tu reacción."], ["Sacerdote guerrero", "Acción adicional: un ataque con arma o sin armas. Usos = mod. Sabiduría (mín. 1); se recuperan con descanso corto o largo."]], "6": [["Bendición del dios de la guerra", "Gasta un uso de Canalizar divinidad para lanzar Arma espiritual o Escudo de fe sin espacio de conjuro; así lanzado no requiere concentración y dura 1 minuto (termina si lo vuelves a lanzar, quedas Incapacitado o mueres)."]], "17": [["Avatar de la batalla", "Resistencia al daño contundente, cortante y perforante."]]}}, {"id": "luz", "n": "Dominio de la luz", "en": "Light Domain", "tag": "Trae la luz para repeler la oscuridad.", "lv": {"3": [["Conjuros de dominio", "Siempre preparados: nv 3 Fuego feérico, Manos ardientes, Rayo abrasador, Ver invisibilidad · nv 5 Bola de fuego, Luz del día · nv 7 Muro de fuego, Ojo arcano · nv 9 Escudriñar, Golpe flamígero."], ["Fulgor protector", "Reacción cuando una criatura visible a 9 m (30 ft) o menos hace una tirada de ataque: le impones desventaja. Usos = mod. Sabiduría (mín. 1), recuperados con descanso largo."], ["Resplandor del amanecer", "Acción de magia: gasta un uso de Canalizar divinidad; emanación de 9 m (30 ft) que disipa la oscuridad mágica y obliga a las criaturas que elijas a salvación de Constitución: 2d10 + nivel de clérigo de daño radiante (mitad si la superan)."]], "6": [["Fulgor protector mejorado", "Recuperas los usos de Fulgor protector con descanso corto o largo, y al usarlo puedes dar al objetivo del ataque 2d6 + mod. Sabiduría PG temporales."]], "17": [["Halo de luz", "Acción de magia: aura de luz solar 1 minuto (luz brillante 18 m (60 ft), tenue 9 m (30 ft) más). Los enemigos en la luz brillante tienen desventaja en salvaciones contra Resplandor del amanecer y contra tus conjuros de daño de fuego o radiante. Usos = mod. Sabiduría (mín. 1), por descanso largo."]]}}, {"id": "vida", "n": "Dominio de la vida", "en": "Life Domain", "tag": "Alivia las penas del mundo.", "lv": {"3": [["Conjuros de dominio", "Siempre preparados: nv 3 Auxilio, Bendición, Curar heridas, Restablecimiento menor · nv 5 Palabra de curación en masa, Revivir · nv 7 Aura de vida, Guarda contra la muerte · nv 9 Curar heridas en masa, Restablecimiento mayor."], ["Discípulo de la vida", "Cuando uses un espacio de conjuro para lanzar un conjuro que cure PG, la criatura recupera 2 + nivel del espacio PG adicionales en el turno en que lo lanzas."], ["Preservar vida", "Acción de magia: gasta un uso de Canalizar divinidad para repartir 5 × nivel de clérigo PG de curación entre criaturas maltrechas a 9 m (30 ft) o menos (puedes incluirte). No sube a nadie por encima de la mitad de sus PG máximos."]], "6": [["Sanador bendito", "Tras usar un espacio de conjuro para lanzar un conjuro que cure a una o más criaturas que no seas tú, recuperas 2 + nivel del espacio PG."]], "17": [["Sanación suprema", "En vez de tirar dados de curación (conjuro o Canalizar divinidad), usas el máximo de cada dado (p. ej., 2d6 cura 12)."]]}}, {"id": "engano", "n": "Dominio del engaño", "en": "Trickery Domain", "tag": "Comete travesuras y desafía a las autoridades.", "lv": {"3": [["Conjuros de dominio", "Siempre preparados: nv 3 Disfrazarse, Hechizar persona, Invisibilidad, Pasar sin rastro · nv 5 Indetectable, Patrón hipnótico · nv 7 Confusión, Puerta dimensional · nv 9 Alterar los recuerdos, Dominar persona."], ["Bendición del embaucador", "Acción de magia: tú o una criatura voluntaria a 9 m (30 ft) o menos obtiene ventaja en pruebas de Destreza (Sigilo) hasta tu próximo descanso largo o hasta que lo vuelvas a usar."], ["Invocar duplicidad", "Acción adicional: gasta un uso de Canalizar divinidad para crear un duplicado ilusorio a 9 m (30 ft) o menos durante 1 minuto. Distraer (ventaja en ataques contra una criatura a 1,5 m (5 ft) de ti y de la ilusión), Lanzar conjuros desde el espacio de la ilusión, Mover la ilusión 9 m (30 ft) como acción adicional dentro de 36 m (120 ft)."]], "6": [["Transposición del embaucador", "Al crear o mover la ilusión con acción adicional puedes teletransportarte e intercambiar lugar con ella."]], "17": [["Duplicidad mejorada", "Distracción compartida: tus aliados también tienen ventaja contra criaturas a 1,5 m (5 ft) de la ilusión. Ilusión sanadora: al desaparecer, tú o una criatura a 1,5 m (5 ft) de ella recupera PG = nivel de clérigo."]]}}]}, "levels": {"1": {"f": [["Lanzamiento de conjuros", "Lanzas conjuros de clérigo con Sabiduría como aptitud mágica y un símbolo sagrado como canalizador. Conoces 3 trucos (recomendados Guía, Llama sagrada y Taumaturgia; +1 en niveles 4 y 10; puedes cambiar uno al subir de nivel). Preparas 4 conjuros de nivel 1 (recomendados Bendición, Curar heridas, Escudo de fe y Saeta guía); el total sube según la columna 'Conjuros preparados' y deben ser de niveles para los que tengas espacios. Recuperas los espacios con un descanso largo y puedes cambiar los conjuros preparados tras cada descanso largo. Los conjuros 'siempre preparados' de otros rasgos no cuentan para el total."], ["Orden divina", "Elige una función sacra: Protector (competencia con armas marciales y entrenamiento con armaduras pesadas) o Taumaturgo (1 truco adicional de clérigo y bonificador = mod. Sabiduría, mín. +1, a las pruebas de Inteligencia (Conocimiento arcano y Religión))."]], "sl": [2], "cantrips": 3, "prep": 4, "cd": 0}, "2": {"f": [["Canalizar divinidad", "2 usos; recuperas 1 con descanso corto y todos con descanso largo (3 usos a nivel 6, 4 a nivel 18). CD = CD de salvación de conjuros. Chispa divina: acción de magia, apuntas con el símbolo sagrado a otra criatura visible a 9 m (30 ft) o menos; tiras 1d8 + mod. Sabiduría y o bien cura esos PG, o bien salvación de Constitución: daño necrótico o radiante igual al resultado (mitad si la supera). Sube a 2d8 en nv 7, 3d8 en nv 13 y 4d8 en nv 18. Expulsar muertos vivientes: acción de magia; cada muerto viviente a 9 m (30 ft) o menos hace salvación de Sabiduría o queda Asustado e Incapacitado 1 minuto y huye de ti; termina si sufre daño, si quedas Incapacitado o si mueres."]], "sl": [3], "cantrips": 3, "prep": 5, "cd": 2}, "3": {"f": [["Subclase de clérigo", ""]], "sl": [4, 2], "cantrips": 3, "prep": 6, "cd": 2, "branch": 1, "subl": 3}, "4": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "sl": [4, 3], "cantrips": 4, "prep": 7, "cd": 2, "asi": 1}, "5": {"f": [["Abrasar muertos vivientes", "Al usar Expulsar muertos vivientes, tiras tantos d8 como tu mod. Sabiduría (mín. 1d8): cada muerto viviente que falle la salvación sufre daño radiante igual al total. Ese daño no termina la expulsión."]], "sl": [4, 3, 2], "cantrips": 4, "prep": 9, "cd": 2}, "6": {"f": [["Rasgo de subclase", ""]], "sl": [4, 3, 3], "cantrips": 4, "prep": 10, "cd": 3, "subl": 6}, "7": {"f": [["Golpes benditos", "Elige una opción: Golpe divino (una vez por turno, al acertar con un arma, +1d8 de daño necrótico o radiante a tu elección) o Lanzamiento potente (sumas tu mod. Sabiduría al daño de tus trucos de clérigo)."]], "sl": [4, 3, 3, 1], "cantrips": 4, "prep": 11, "cd": 3}, "8": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "sl": [4, 3, 3, 2], "cantrips": 4, "prep": 12, "cd": 3, "asi": 1}, "9": {"f": [["Sin rasgo nuevo de clase", "Solo cambian espacios, conjuros preparados, trucos o usos de Canalizar divinidad."]], "sl": [4, 3, 3, 3, 1], "cantrips": 4, "prep": 14, "cd": 3}, "10": {"f": [["Intercesión divina", "Acción de magia: elige un conjuro de clérigo de nivel 5 o inferior que no requiera reacción y lánzalo sin gastar espacio ni componentes materiales. 1 uso por descanso largo."]], "sl": [4, 3, 3, 3, 2], "cantrips": 5, "prep": 15, "cd": 3}, "11": {"f": [["Sin rasgo nuevo de clase", "Solo cambian espacios, conjuros preparados, trucos o usos de Canalizar divinidad."]], "sl": [4, 3, 3, 3, 2, 1], "cantrips": 5, "prep": 16, "cd": 3}, "12": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "sl": [4, 3, 3, 3, 2, 1], "cantrips": 5, "prep": 16, "cd": 3, "asi": 1}, "13": {"f": [["Sin rasgo nuevo de clase", "Solo cambian espacios, conjuros preparados, trucos o usos de Canalizar divinidad."]], "sl": [4, 3, 3, 3, 2, 1, 1], "cantrips": 5, "prep": 17, "cd": 3}, "14": {"f": [["Golpes benditos mejorados", "Tu opción de Golpes benditos mejora: Golpe divino pasa a 2d8; Lanzamiento potente además otorga, al dañar con un truco de clérigo, PG temporales = 2 × mod. Sabiduría a ti o a una criatura a 18 m (60 ft) o menos."]], "sl": [4, 3, 3, 3, 2, 1, 1], "cantrips": 5, "prep": 17, "cd": 3}, "15": {"f": [["Sin rasgo nuevo de clase", "Solo cambian espacios, conjuros preparados, trucos o usos de Canalizar divinidad."]], "sl": [4, 3, 3, 3, 2, 1, 1, 1], "cantrips": 5, "prep": 18, "cd": 3}, "16": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "sl": [4, 3, 3, 3, 2, 1, 1, 1], "cantrips": 5, "prep": 18, "cd": 3, "asi": 1}, "17": {"f": [["Rasgo de subclase", ""]], "sl": [4, 3, 3, 3, 2, 1, 1, 1, 1], "cantrips": 5, "prep": 19, "cd": 3, "subl": 17}, "18": {"f": [["Sin rasgo nuevo de clase", "Solo cambian espacios, conjuros preparados, trucos o usos de Canalizar divinidad."]], "sl": [4, 3, 3, 3, 3, 1, 1, 1, 1], "cantrips": 5, "prep": 20, "cd": 4}, "19": {"f": [["Don épico", "Dote de don épico (cap. 5) u otra dote para la que cumplas condiciones. Se recomienda Don del destino."]], "sl": [4, 3, 3, 3, 3, 2, 1, 1, 1], "cantrips": 5, "prep": 21, "cd": 4}, "20": {"f": [["Intercesión divina mayor", "Al usar Intercesión divina puedes elegir Deseo; si lo haces, no puedes volver a usar Intercesión divina hasta finalizar 2d4 descansos largos."]], "sl": [4, 3, 3, 3, 3, 2, 2, 1, 1], "cantrips": 5, "prep": 22, "cd": 4}}}]};

darvin:{css:"\n/* Paleta de Darvin: brasa y dragón — carbón, ámbar, rojo fuego */\n:root{--bg:#F7F3EF;--surface:#FFFCF9;--line:#E8DDD3;--line-2:#D5C4B4;--violet:#B8462A;--violet-d:#923720;--violet-soft:#F8E5DD;--gold:#D08A1E;--gold-d:#A06612;--gold-soft:#FBEBCF;--ruby:#A7322E;--ruby-soft:#F7E0DE;--hero-1:#1E1715;--hero-2:#5A2A1C;--hero-ink:#FFF5EC;--hero-mute:#E5C9B8}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#161210;--surface:#211A17;--line:#34291F;--line-2:#473829;--violet:#F08A62;--violet-d:#F7A988;--violet-soft:#3A2018;--gold:#E8A84A;--gold-d:#F2C072;--gold-soft:#352611;--ruby:#E77A72;--ruby-soft:#3A1E1C;--hero-1:#120D0B;--hero-2:#3D1C13}}\n:root[data-theme=\"dark\"]{--bg:#161210;--surface:#211A17;--line:#34291F;--line-2:#473829;--violet:#F08A62;--violet-d:#F7A988;--violet-soft:#3A2018;--gold:#E8A84A;--gold-d:#F2C072;--gold-soft:#352611;--ruby:#E77A72;--ruby-soft:#3A1E1C;--hero-1:#120D0B;--hero-2:#3D1C13}\n",body:"<nav class=\"idx\" aria-label=\"Páginas de la hoja\">\n  <div class=\"in\">\n    <a href=\"#combate\"><b>1<\/b> Combate<\/a>\n    <a href=\"#equipo\"><b>2<\/b> Equipo<span class=\"wide\"> y conjuros<\/span><\/a>\n    <a href=\"#rasgos\"><b>3<\/b> Rasgos<span class=\"wide\"> e historia<\/span><\/a>\n    <a href=\"#arbol\"><b>4<\/b> Árbol<\/a>\n    <span class=\"sync\" id=\"sync\" role=\"status\">Conectando…<\/span>\n  <\/div>\n<\/nav>\n\n<header class=\"hero\">\n  <div class=\"in\">\n    <div class=\"herotop\"><div><div class=\"eyebrow\" id=\"cEyebrow\"><\/div>\n    <h1 id=\"cName\"><\/h1><\/div><img class=\"heroav\" id=\"heroAv\" alt=\"\" hidden><\/div>\n    <div class=\"idrow\" id=\"cId\"><\/div>\n    <div class=\"restbar\">\n      <button type=\"button\" id=\"bShort\">Descanso corto<\/button>\n      <button type=\"button\" id=\"bLong\">Descanso largo<\/button>\n      <button type=\"button\" id=\"bInsp\" aria-pressed=\"false\">Inspiración heroica<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main><div class=\"in\">\n\n<!-- ============ PÁGINA 1 ============ -->\n<div class=\"pgbreak\" id=\"combate\"><span>Página 1 · Combate<\/span><\/div>\n<div class=\"p1\">\n  <div class=\"a-stats stats\">\n    <div class=\"sbox ac\"><b class=\"num\" id=\"sAC\">–<\/b><span class=\"lbl\">Clase de armadura<\/span><small id=\"sACn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sInit\">–<\/b><span class=\"lbl\">Iniciativa<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sSpd\">–<\/b><span class=\"lbl\">Velocidad<\/span><small id=\"sSpdn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sProf\">–<\/b><span class=\"lbl\">Competencia<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sPP\">–<\/b><span class=\"lbl\">Percepción pasiva<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sDC\">–<\/b><span class=\"lbl\">CD de conjuros<\/span><small id=\"sDCn\"><\/small><\/div>\n  <\/div>\n\n  <section class=\"a-hp box\" aria-labelledby=\"hHP\">\n    <h2 id=\"hHP\">Puntos de golpe <span class=\"lbl\" id=\"hpMaxL\"><\/span><\/h2>\n    <div class=\"hp\">\n      <div class=\"hpnum num\"><span id=\"hpCur\">–<\/span><small id=\"hpMaxS\"><\/small><\/div>\n      <div class=\"mute\">Temporales: <span class=\"temp\" id=\"hpTemp\">0<\/span><br><span id=\"hpState\">Cargando estado…<\/span><\/div>\n      <div class=\"bar\"><i id=\"hpBar\" style=\"width:0\"><\/i><\/div>\n    <\/div>\n    <div class=\"hpctl\">\n      <input id=\"hpAmt\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"5\" aria-label=\"Cantidad\">\n      <button class=\"btn dmg\" type=\"button\" data-hp=\"dmg\">Daño<\/button>\n      <button class=\"btn heal\" type=\"button\" data-hp=\"heal\">Curar<\/button>\n      <button class=\"btn tmp\" type=\"button\" data-hp=\"temp\">Temporales<\/button>\n    <\/div>\n    <div class=\"concq\" id=\"concQ\" hidden><\/div>\n    <div class=\"death\" id=\"deathBox\"><\/div>\n    <p class=\"note\">El daño consume primero los temporales. Los temporales no se suman: la hoja deja el mayor. Duran hasta gastarse o hasta un descanso largo.<\/p>\n  <\/section>\n\n  <section class=\"a-atk box\" aria-labelledby=\"hAtk\">\n    <h2 id=\"hAtk\">Ataques<\/h2>\n    <div id=\"atkBox\" class=\"empty\">Cargando armas equipadas…<\/div>\n    <div class=\"group\">Daño adicional<\/div>\n    <div id=\"xdmgBox\"><\/div>\n    <p class=\"note\" id=\"mastNote\"><\/p>\n  <\/section>\n\n  <section class=\"a-abil box\" aria-labelledby=\"hAb\">\n    <h2 id=\"hAb\">Atributos<\/h2>\n    <div id=\"abMods\" class=\"acrow\"><\/div>\n    <div class=\"abil\" id=\"abil\"><\/div>\n    <p class=\"note\">● competencia · ◆ pericia. <span id=\"saveNote\"><\/span> <span id=\"stealthNote\"><\/span><\/p>\n  <\/section>\n\n  <section class=\"a-res box\" aria-labelledby=\"hRes\">\n    <h2 id=\"hRes\">Recursos <span class=\"lbl\">relleno = disponible<\/span><\/h2>\n    <div class=\"res\" id=\"resBox\"><\/div>\n  <\/section>\n\n  <section class=\"a-fx box\" aria-labelledby=\"hFx\">\n    <h2 id=\"hFx\">Efectos y estados <span class=\"lbl\" id=\"fxCount\"><\/span><\/h2>\n    <div class=\"conc\" id=\"concBanner\" hidden><\/div>\n    <div id=\"fxBox\"><div class=\"empty\">Cargando efectos…<\/div><\/div>\n    <div class=\"conds\" id=\"condBox\"><\/div>\n    <div class=\"track\" style=\"border:0;padding:0\"><div class=\"t\"><b>Cansancio<\/b><span>−2 × nivel a pruebas con d20 · −5 ft por nivel · −1 por descanso largo<\/span><\/div>\n      <div class=\"stepper\"><button type=\"button\" data-exh=\"-1\" aria-label=\"Bajar cansancio\">−<\/button><output id=\"oExh\" class=\"num\">0<\/output><button type=\"button\" data-exh=\"1\" aria-label=\"Subir cansancio\">+<\/button><\/div><\/div>\n    <div id=\"condDetail\" class=\"conddet\"><\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ PÁGINA 2 ============ -->\n<div class=\"pgbreak\" id=\"equipo\"><span>Página 2 · Equipo y conjuros<\/span><\/div>\n<div class=\"p2\">\n  <section class=\"box\" aria-labelledby=\"hEq\">\n    <h2 id=\"hEq\">Equipado <span class=\"lbl\" id=\"attNote\">sintonización –/3<\/span><\/h2>\n    <div class=\"acrow\" id=\"acBreak\"><\/div>\n    <div class=\"slots\" id=\"itemsBox\"><div class=\"empty\">Cargando equipo…<\/div><\/div>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hInv\">\n    <h2 id=\"hInv\">Inventario <span class=\"lbl\" id=\"invCount\"><\/span><\/h2>\n    <div class=\"conts\" id=\"invBox\"><div class=\"empty\">Cargando inventario…<\/div><\/div>\n    <details class=\"addf\">\n      <summary>+ Agregar objeto<\/summary>\n      <form class=\"f\" id=\"gearForm\" autocomplete=\"off\">\n        <input id=\"gearName\" placeholder=\"Objeto (cuerda, raciones…)\" aria-label=\"Nombre del objeto\" required>\n        <input id=\"gearQty\" type=\"number\" min=\"1\" value=\"1\" aria-label=\"Cantidad\">\n        <select id=\"gearCat\" aria-label=\"Categoría\"><option value=\"equipo\">Equipo<\/option><option value=\"consumible\">Consumible<\/option><option value=\"municion\">Munición<\/option><option value=\"herramienta\">Herramienta<\/option><option value=\"valor\">Objeto de valor<\/option><\/select>\n        <input id=\"gearLoc\" list=\"locList\" placeholder=\"Dónde (mochila…)\" aria-label=\"Contenedor\">\n        <datalist id=\"locList\"><\/datalist>\n        <input id=\"gearNote\" placeholder=\"Nota (opcional)\" aria-label=\"Nota\">\n        <button class=\"btn\" type=\"submit\">Agregar<\/button>\n      <\/form>\n      <p class=\"note\">Armas, armaduras y objetos mágicos con efecto en los números se agregan conmigo en el chat. Un contenedor nuevo se crea escribiéndolo en \"Dónde\".<\/p>\n    <\/details>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hGold\">\n    <h2 id=\"hGold\">Monedas <span class=\"lbl\">libro de movimientos<\/span><\/h2>\n    <div class=\"goldtop\"><div class=\"hpnum num\" id=\"gBal\">–<\/div><span class=\"mute\">po · saldo calculado<\/span><\/div>\n    <form class=\"f\" id=\"goldForm\" autocomplete=\"off\">\n      <input id=\"gAmt\" type=\"number\" inputmode=\"decimal\" min=\"0.01\" step=\"0.01\" placeholder=\"po\" aria-label=\"Monto en po\" required style=\"width:90px\">\n      <input id=\"gConcept\" placeholder=\"Concepto (botín, compra…)\" aria-label=\"Concepto\" required style=\"flex:1 1 160px\">\n      <button class=\"btn heal\" type=\"submit\" data-dir=\"1\">Ingreso<\/button>\n      <button class=\"btn dmg\" type=\"submit\" data-dir=\"-1\">Gasto<\/button>\n    <\/form>\n    <p class=\"note\">Conversión a po: pc 0,01 · pp 0,1 · pe 0,5 · ppt 10. Para corregir, se anula y queda visible.<\/p>\n    <div id=\"gList\" class=\"ledger\"><div class=\"empty\">Cargando movimientos…<\/div><\/div>\n    <button type=\"button\" class=\"btn ghost\" id=\"gMore\" hidden>Ver todos<\/button>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hSp\">\n    <h2 id=\"hSp\">Conjuros <span class=\"lbl\" id=\"spL\"><\/span><\/h2>\n    <div class=\"spslots\" id=\"spSlots\"><\/div>\n    <p class=\"note\">Toca un conjuro para ver el detalle y lanzarlo. Si es a ti y tiene efecto en tus números, la hoja lo aplica. Uno de concentración reemplaza al anterior.<\/p>\n    <div id=\"spBox\" class=\"spells\"><\/div>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hGrim\" id=\"grimsec\">\n    <h2 id=\"hGrim\">Grimorio del explorador <span class=\"lbl\" id=\"grimCount\"><\/span><\/h2>\n    <p class=\"note\" id=\"grimRule\"><\/p>\n    <div class=\"gfilters\" id=\"grimFilters\">\n      <input type=\"search\" id=\"grimQ\" placeholder=\"Buscar conjuro…\" aria-label=\"Buscar conjuro\">\n      <div class=\"gchips\">\n        <button type=\"button\" class=\"fchip\" data-gf=\"all\" aria-pressed=\"true\">Todos<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"prep\">Preparados<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l0\">Trucos<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l1\">Nivel 1<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l2\">Nivel 2<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"conc\">Concentración<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"ritual\">Ritual<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"noconc\">Sin concentración<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"grimSwap\" class=\"gswap\"><\/div>\n    <div id=\"grimBox\" class=\"grim\"><\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ PÁGINA 3 ============ -->\n<div class=\"pgbreak\" id=\"rasgos\"><span>Página 3 · Rasgos e historia<\/span><\/div>\n<div class=\"p3\">\n  <section class=\"box lusec\" aria-labelledby=\"hLu\">\n    <h2 id=\"hLu\">Subir de nivel <span class=\"lbl\">planificador<\/span><\/h2>\n    <div id=\"luBox\"><div class=\"empty\">Cargando…<\/div><\/div>\n  <\/section>\n  <section class=\"box featsec\" aria-labelledby=\"hFeat\">\n    <h2 id=\"hFeat\">Rasgos <span class=\"lbl\" id=\"featLvl\"><\/span><\/h2>\n    <div id=\"featBox\" class=\"feats\"><\/div>\n  <\/section>\n  <section class=\"box profsec\" aria-labelledby=\"hProf\">\n    <h2 id=\"hProf\">Competencias <span class=\"lbl\">◆ = pericia<\/span><\/h2>\n    <div class=\"pfs\" id=\"profBox\"><\/div>\n  <\/section>\n  <section class=\"box recipes\" aria-labelledby=\"hRec\">\n    <h2 id=\"hRec\">Recetario del artesano <span class=\"lbl\">PHB cap. 6 · validado GM<\/span><\/h2>\n    <div id=\"recBox\"><\/div>\n  <\/section>\n  <section class=\"box story\" aria-labelledby=\"hStory\">\n    <h2 id=\"hStory\">Crónica<\/h2>\n    <div class=\"storygrid\">\n      <figure class=\"portrait\" id=\"portrait\">\n        <div class=\"ph\" id=\"portraitPh\"><span class=\"lbl\">Ilustración<\/span><span class=\"mute\" id=\"portraitMsg\">Cargando…<\/span><\/div>\n        <img id=\"portraitImg\" alt=\"\" hidden>\n        <div class=\"pacts\" id=\"portraitActs\" hidden>\n          <label class=\"btn\" for=\"portraitFile\" id=\"portraitBtn\">Subir ilustración<\/la   {"id": "wind", "lvl": 0, "n": "Paso del viento", "en": "Step of the Wind", "tag": "destrabarse + correr", "fixed": "Concentración de monje · CD 17", "noSlot": true, "src": ["ki"], "tg": ["self", "other"], "meta": "Concentración · Acción adicional · 1 punto", "d": "Te destrabas y corres como acción adicional; tu distancia de salto se duplica este turno. Puedes llevar contigo a una criatura voluntaria Grande o menor a 1,5 m sin que provoque ataques de oportunidad. Sin gastar punto, solo corres."},
  {"id": "stun", "lvl": 0, "n": "Golpe aturdidor", "en": "Stunning Strike", "tag": "CD 17 Con · Aturdido", "fixed": "Concentración de monje · CD 17", "noSlot": true, "src": ["ki"], "tg": ["other"], "meta": "Concentración · al acertar · 1 punto · 1×/turno", "d": "Al acertar con un arma de monje o un ataque sin armas: salvación de Constitución CD 17. Si falla, Aturdido hasta el principio de tu siguiente turno; si la supera, velocidad a la mitad y el siguiente ataque contra él tiene ventaja.", "inst": "El objetivo salva Constitución CD 17."},
  {"id": "redirect", "lvl": 0, "n": "Desviar ataques: redirigir", "en": "Deflect Attacks", "tag": "2d10+5 · CD 17 Des", "fixed": "Concentración de monje · CD 17", "noSlot": true, "src": ["ki"], "tg": ["other"], "meta": "Concentración · parte de la reacción · 1 punto", "d": "Si Desviar ataques (1d10 + 17) reduce el daño a 0, gastas 1 punto: una criatura a 1,5 m (cuerpo a cuerpo) o a 18 m sin cobertura completa (a distancia) salva Destreza CD 17 o sufre 2d10 + 5 del mismo tipo de daño.", "inst": "Salvación de Destreza CD 17 o 2d10 + 5."},
  {"id": "wholeness", "lvl": 0, "n": "Plenitud de cuerpo", "en": "Wholeness of Body", "tag": "1d10+5 PG", "fixed": "Guerrero de la mano abierta", "noSlot": true, "src": ["whole"], "tg": ["self"], "meta": "Mano abierta · Acción adicional · 5 por descanso largo", "d": "Tiras tu dado de Artes marciales y recuperas el resultado + 5 PG (mínimo 1).", "selfHeal": "1d10+5", "inst": "Tira 1d10+5."},
  {"id": "metabolism", "lvl": 0, "n": "Metabolismo asombroso", "en": "Uncanny Metabolism", "tag": "recupera concentración", "fixed": "Concentración de monje · CD 17", "noSlot": true, "src": ["metab"], "tg": ["self"], "meta": "Monje nv 2 · al tirar iniciativa · 1 por descanso largo", "d": "Recuperas todos los puntos de concentración gastados y 1d10 + 12 PG. Marca los puntos como disponibles en Recursos.", "selfHeal": "1d10+12", "inst": "Recupera los 12 puntos en Recursos y tira 1d10+12 PG."},
  {"id": "dragon", "lvl": 0, "n": "Rugido del Dragón", "en": "homebrew", "tag": "+1d4 fuego · 4 turnos", "fixed": "Golpes del GM · homebrew", "noSlot": true, "src": ["ki"], "tg": ["self"], "dur": "4 turnos", "meta": "Homebrew · 1 punto · 4 turnos", "d": "+1d4 de daño de fuego en cada ataque durante 4 turnos.", "note": "Golpe entregado por el GM ✔", "cost": 1},
  {"id": "far", "lvl": 0, "n": "Golpe Lejano", "en": "homebrew", "tag": "golpes a 9 m · 2 rondas", "fixed": "Golpes del GM · homebrew", "noSlot": true, "src": ["ki"], "cost": 2, "tg": ["self"], "dur": "2 rondas", "meta": "Homebrew · 2 puntos · 2 rondas", "d": "Durante 2 rondas proyectas tus golpes normales como daño contundente hasta 9 m (30 ft).", "note": "Del Libro del Camino Marcial; validado como entrenamiento por el GM."},

window.CHAR.tree={"maxTotal": 20, "note": "Fuente: PHB 2024, capítulo 3 (Monje) en Notion. Las subclases dan rasgos en los niveles 3, 6, 11 y 17; Darvin ya es Guerrero de la mano abierta.", "cols": [{"cls": "Monje", "tone": "sand", "max": 20, "sub": {"at": 3, "label": "Subclase de monje", "chosen": "manoabierta", "opts": [{"id": "manoabierta", "n": "Guerrero de la mano abierta", "en": "Warrior of the Open Hand", "tag": "Domina las técnicas de combate sin armas.", "lv": {"3": [["Técnica de la mano abierta", "Al acertar con un ataque de Ráfaga de golpes, impones uno: Derribar (salvación de Destreza o queda Derribado), Desconcertar (no puede hacer ataques de oportunidad hasta el inicio de su siguiente turno) o Empujar (salvación de Fuerza o lo empujas hasta 4,5 m (15 ft) respecto a ti)."]], "6": [["Plenitud de cuerpo", "Acción adicional: tiras el dado de Artes marciales y recuperas PG = resultado + mod. Sabiduría (mínimo 1). Usos = mod. Sabiduría (mínimo 1); se recuperan con descanso largo."]], "11": [["Paso veloz", "Cuando uses una acción adicional que no sea Paso del viento, puedes usar también Paso del viento inmediatamente después."]], "17": [["Palma estremecedora", "Al acertar un ataque sin armas gastas 4 puntos para iniciar vibraciones que duran tantos días como tu nivel de monje. Las terminas con tu acción o renunciando a un ataque de la acción de atacar (mismo plano): salvación de Constitución, 10d12 de daño de fuerza (mitad si la supera). Solo una criatura a la vez; puedes terminarlas sin daño (sin acción)."]]}}, {"id": "misericordia", "n": "Guerrero de la misericordia", "en": "Warrior of Mercy", "tag": "Manipula las fuerzas de la vida y la muerte.", "lv": {"3": [["Instrumentos de misericordia", "Competencia en Medicina y Perspicacia y con los útiles de herborista."], ["Mano de aflicción", "Una vez por turno, al acertar y dañar con un ataque sin armas, gastas 1 punto: daño necrótico adicional = dado de Artes marciales + mod. Sabiduría."], ["Mano de curación", "Acción de magia, 1 punto: tocas a una criatura y recupera PG = dado de Artes marciales + mod. Sabiduría. Al usar Ráfaga de golpes puedes sustituir un ataque por un uso sin gastar punto."]], "6": [["Toque de galeno", "Mano de aflicción también puede dejar Envenenado hasta el final de tu siguiente turno. Mano de curación también puede terminar un estado: Aturdido, Cegado, Ensordecido, Envenenado o Paralizado."]], "11": [["Ráfaga de curación y aflicción", "En Ráfaga de golpes puedes sustituir cada ataque por Mano de curación sin gastar puntos, y usar Mano de aflicción en un ataque sin gastar punto (una vez por turno). Usos = mod. Sabiduría (mínimo 1) por descanso largo."]], "17": [["Mano de misericordia suprema", "Acción de magia, 5 puntos: tocas el cadáver de una criatura muerta en las últimas 24 horas; revive con 4d10 + mod. Sabiduría PG, sin los estados Aturdido, Cegado, Ensordecido, Envenenado y Paralizado. 1 uso por descanso largo."]]}}, {"id": "sombra", "n": "Guerrero de la sombra", "en": "Warrior of Shadow", "tag": "Utiliza el poder de la sombra para el sigilo y el subterfugio.", "lv": {"3": [["Artes sombrías", "Conoces el truco Ilusión menor (Sabiduría). 1 punto: lanzas Oscuridad sin componentes, ves dentro y puedes mover la zona hasta 18 m (60 ft) al inicio de cada turno. Visión en la oscuridad 18 m (60 ft) (o +18 m si ya la tienes)."]], "6": [["Paso entre sombras", "Por completo en luz tenue u oscuridad, acción adicional: te teletransportas hasta 18 m (60 ft) a un espacio visible también en luz tenue u oscuridad; ventaja en tu siguiente ataque cuerpo a cuerpo ese turno."]], "11": [["Paso entre sombras mejorado", "Con 1 punto ignoras el requisito de luz tenue u oscuridad de Paso entre sombras, y como parte de esa acción adicional haces un ataque sin armas tras teletransportarte."]], "17": [["Capa de sombras", "Acción de magia en luz tenue u oscuridad, 3 puntos: 1 minuto (termina si quedas Incapacitado o acabas el turno en luz brillante). Incorporeidad parcial (atraviesas espacios ocupados como terreno difícil), estado Invisible y Ráfaga de golpes sin gastar puntos."]]}}, {"id": "elementos", "n": "Guerrero de los elementos", "en": "Warrior of the Elements", "tag": "Emplea ataques y explosiones de poder elemental.", "lv": {"3": [["Armonía con los elementos", "Al inicio de tu turno, 1 punto: 10 minutos (o hasta quedar Incapacitado). Alcance +3 m (10 ft) en ataques sin armas; Golpes elementales: daño de ácido, frío, fuego, relámpago o trueno y salvación de Fuerza o mueves al objetivo hasta 3 m (10 ft) hacia ti o lejos."], ["Manipular los elementos", "Conoces el conjuro Elementalismo (Sabiduría)."]], "6": [["Explosión elemental", "Acción de magia, 2 puntos: esfera de 6 m (20 ft) de radio a 36 m (120 ft) o menos; salvación de Destreza, 3 dados de Artes marciales de ácido, frío, fuego, relámpago o trueno (mitad si la supera)."]], "11": [["Paso de los elementos", "Con Armonía con los elementos activa, velocidad nadando y volando iguales a tu velocidad."]], "17": [["Paradigma elemental", "Con Armonía activa: una vez por turno +1 dado de Artes marciales de daño en ataque sin armas; Paso del viento da +6 m (20 ft) de velocidad y daña (1 dado de Artes marciales) a criaturas elegidas al pasar a 1,5 m (5 ft) (una vez por turno); resistencia a ácido, frío, fuego, relámpago o trueno (cambiable al inicio de cada turno)."]]}}]}, "levels": {"1": {"f": [["Artes marciales", "Armas de monje = armas cuerpo a cuerpo sencillas y marciales con la propiedad Ligera. Sin armadura ni escudo y desarmado o solo con armas de monje: ataque sin armas como acción adicional; usas el dado de Artes marciales (1d6, sube con el nivel) en lugar del daño normal de ataques sin armas y armas de monje; puedes usar Destreza en vez de Fuerza para ataque y daño, y para la CD de agarre o empujón."], ["Defensa sin armadura", "Sin armadura ni escudo, tu CA base = 10 + mod. Destreza + mod. Sabiduría."]], "ma": "1d6", "focus": 0, "move": 0}, "2": {"f": [["Concentración de monje", "Puntos de concentración según la tabla (2 en nv 2); se recuperan todos tras descanso corto o largo. CD de salvación = 8 + mod. Sabiduría + bonif. competencia. Defensa paciente: Destrabarse como acción adicional, o 1 punto para Destrabarse y Esquivar. Paso del viento: Correr como acción adicional, o 1 punto para Destrabarse y Correr y duplicar la distancia de salto ese turno. Ráfaga de golpes: 1 punto para dos ataques sin armas como acción adicional."], ["Metabolismo asombroso", "Al tirar iniciativa puedes recuperar todos los puntos de concentración gastados y recuperar PG = nivel de monje + una tirada del dado de Artes marciales. 1 uso por descanso largo."], ["Movimiento sin armadura", "Velocidad +3 m (10 ft) sin armadura ni escudo; la bonificación sube según la tabla."]], "ma": "1d6", "focus": 2, "move": "+3 m (10 ft)"}, "3": {"f": [["Desviar ataques", "Reacción al recibir un ataque que acierta con daño contundente, cortante o perforante: reduces el daño en 1d10 + mod. Destreza + nivel de monje. Si lo reduces a 0, puedes gastar 1 punto para redirigirlo: una criatura a 1,5 m (5 ft) (cuerpo a cuerpo) o a 18 m (60 ft) sin cobertura completa (a distancia) hace salvación de Destreza o sufre 2 dados de Artes marciales + mod. Destreza del mismo tipo."], ["Subclase de monje", ""]], "ma": "1d6", "focus": 3, "move": "+3 m (10 ft)", "branch": 1, "subl": 3}, "4": {"f": [["Caída lenta", "Reacción al caer: reduces el daño de la caída en 5 × tu nivel de monje."], ["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "ma": "1d6", "focus": 4, "move": "+3 m (10 ft)", "asi": 1}, "5": {"f": [["Ataque adicional", "Haces dos ataques en lugar de uno al llevar a cabo la acción de atacar en tu turno."], ["Golpe aturdidor", "Una vez por turno, al acertar con un arma de monje o ataque sin armas, gastas 1 punto: el objetivo hace salvación de Constitución; si falla queda Aturdido hasta el inicio de tu siguiente turno; si la supera, su velocidad se reduce a la mitad y el siguiente ataque contra él tiene ventaja (hasta el inicio de tu siguiente turno)."]], "ma": "1d8", "focus": 5, "move": "+3 m (10 ft)"}, "6": {"f": [["Golpes potenciados", "El daño de tu ataque sin armas puede ser de fuerza o de su tipo normal, a tu elección."], ["Rasgo de subclase", ""]], "ma": "1d8", "focus": 6, "move": "+4,5 m (15 ft)", "subl": 6}, "7": {"f": [["Evasión", "Salvación de Destreza para recibir la mitad de daño: ningún daño si la superas, la mitad si la fallas. No funciona si estás Incapacitado."]], "ma": "1d8", "focus": 7, "move": "+4,5 m (15 ft)"}, "8": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "ma": "1d8", "focus": 8, "move": "+4,5 m (15 ft)", "asi": 1}, "9": {"f": [["Movimiento acrobático", "Sin armadura ni escudo, puedes moverte por superficies verticales y sobre líquidos sin caerte."]], "ma": "1d8", "focus": 9, "move": "+4,5 m (15 ft)"}, "10": {"f": [["Autorrestablecimiento", "Al final de cada uno de tus turnos puedes eliminar uno de estos estados: Asustado, Envenenado o Hechizado. Privarte de comida y bebida no te da niveles de Cansancio."], ["Concentración agudizada", "Defensa paciente con punto: además PG temporales = 2 dados de Artes marciales. Paso del viento con punto: llevas contigo a una criatura voluntaria Grande o menor a 1,5 m (5 ft), sin provocar ataques de oportunidad. Ráfaga de golpes: tres ataques sin armas en lugar de dos."]], "ma": "1d8", "focus": 10, "move": "+6 m (20 ft)"}, "11": {"f": [["Rasgo de subclase", ""]], "ma": "1d10", "focus": 11, "move": "+6 m (20 ft)", "subl": 11}, "12": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "ma": "1d10", "focus": 12, "move": "+6 m (20 ft)", "asi": 1}, "13": {"f": [["Desviar energía", "Desviar ataques funciona contra ataques de cualquier tipo de daño."]], "ma": "1d10", "focus": 13, "move": "+6 m (20 ft)"}, "14": {"f": [["Superviviente disciplinado", "Competencia en todas las tiradas de salvación. Al fallar una salvación puedes gastar 1 punto para repetirla (usas el nuevo resultado)."]], "ma": "1d10", "focus": 14, "move": "+7,5 m (25 ft)"}, "15": {"f": [["Concentración perfecta", "Al tirar iniciativa sin usar Metabolismo asombroso, si te quedan 3 puntos o menos recuperas hasta tener 4."]], "ma": "1d10", "focus": 15, "move": "+7,5 m (25 ft)"}, "16": {"f": [["Mejora de característica", "Dote Mejora de característica (cap. 5) u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "ma": "1d10", "focus": 16, "move": "+7,5 m (25 ft)", "asi": 1}, "17": {"f": [["Rasgo de subclase", ""]], "ma": "1d12", "focus": 17, "move": "+7,5 m (25 ft)", "subl": 17}, "18": {"f": [["Defensa superior", "Al inicio de tu turno gastas 3 puntos: durante 1 minuto (o hasta quedar Incapacitado) tienes resistencia a todo el daño excepto el de fuerza."]], "ma": "1d12", "focus": 18, "move": "+9 m (30 ft)"}, "19": {"f": [["Don épico", "Dote de don épico u otra dote para la que cumplas condiciones. Se recomienda Don del ataque imparable."]], "ma": "1d12", "focus": 19, "move": "+9 m (30 ft)"}, "20": {"f": [["Cuerpo y mente", "Tus puntuaciones de Destreza y Sabiduría aumentan en 4, hasta un máximo de 25."]], "ma": "1d12", "focus": 20, "move": "+9 m (30 ft)"}}}]};

yevelda:{css:"\n/* Paleta de Yevelda: niebla y oso — gris frío, cobre, musgo */\n:root{--bg:#F2F3F1;--surface:#FBFBFA;--line:#DDE0DB;--line-2:#C6CBC3;--violet:#5E6E5A;--violet-d:#44523F;--violet-soft:#E6ECE3;--gold:#B4713A;--gold-d:#8A5328;--gold-soft:#F5E8DC;--ruby:#A33C3C;--ruby-soft:#F6E1E1;--hero-1:#2B2F2C;--hero-2:#4E5A4C;--hero-ink:#F3F4EF;--hero-mute:#C4CBBF}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#15181A;--surface:#1E2224;--line:#2E3437;--line-2:#3E4649;--violet:#9FB89A;--violet-d:#BFD4BA;--violet-soft:#263129;--gold:#D9A06A;--gold-d:#E8B98A;--gold-soft:#332519;--ruby:#E07A7A;--ruby-soft:#3A1F1F;--hero-1:#171A19;--hero-2:#303A2F}}\n:root[data-theme=\"dark\"]{--bg:#15181A;--surface:#1E2224;--line:#2E3437;--line-2:#3E4649;--violet:#9FB89A;--violet-d:#BFD4BA;--violet-soft:#263129;--gold:#D9A06A;--gold-d:#E8B98A;--gold-soft:#332519;--ruby:#E07A7A;--ruby-soft:#3A1F1F;--hero-1:#171A19;--hero-2:#303A2F}\n",body:"<nav class=\"idx\" aria-label=\"Páginas de la hoja\">\n  <div class=\"in\">\n    <a href=\"#combate\"><b>1<\/b> Combate<\/a>\n    <a href=\"#equipo\"><b>2<\/b> Equipo<span class=\"wide\"> y conjuros<\/span><\/a>\n    <a href=\"#rasgos\"><b>3<\/b> Rasgos<span class=\"wide\"> e historia<\/span><\/a>\n    <a href=\"#arbol\"><b>4<\/b> Árbol<\/a>\n    <span class=\"sync\" id=\"sync\" role=\"status\">Conectando…<\/span>\n  <\/div>\n<\/nav>\n\n<header class=\"hero\">\n  <div class=\"in\">\n    <div class=\"herotop\"><div><div class=\"eyebrow\" id=\"cEyebrow\"><\/div>\n    <h1 id=\"cName\"><\/h1><\/div><img class=\"heroav\" id=\"heroAv\" alt=\"\" hidden><\/div>\n    <div class=\"idrow\" id=\"cId\"><\/div>\n    <div class=\"restbar\">\n      <button type=\"button\" id=\"bShort\">Descanso corto<\/button>\n      <button type=\"button\" id=\"bLong\">Descanso largo<\/button>\n      <button type=\"button\" id=\"bInsp\" aria-pressed=\"false\">Inspiración heroica<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main><div class=\"in\">\n\n<!-- ============ PÁGINA 1 ============ -->\n<div class=\"pgbreak\" id=\"combate\"><span>Página 1 · Combate<\/span><\/div>\n<div class=\"p1\">\n  <div class=\"a-stats stats\">\n    <div class=\"sbox ac\"><b class=\"num\" id=\"sAC\">–<\/b><span class=\"lbl\">Clase de armadura<\/span><small id=\"sACn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sInit\">–<\/b><span class=\"lbl\">Iniciativa<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sSpd\">–<\/b><span class=\"lbl\">Velocidad<\/span><small id=\"sSpdn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sProf\">–<\/b><span class=\"lbl\">Competencia<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sPP\">–<\/b><span class=\"lbl\">Percepción pasiva<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sDC\">–<\/b><span class=\"lbl\">CD de conjuros<\/span><small id=\"sDCn\"><\/small><\/div>\n  <\/div>\n\n  <section class=\"a-hp box\" aria-labelledby=\"hHP\">\n    <h2 id=\"hHP\">Puntos de golpe <span class=\"lbl\" id=\"hpMaxL\"><\/span><\/h2>\n    <div class=\"hp\">\n      <div class=\"hpnum num\"><span id=\"hpCur\">–<\/span><small id=\"hpMaxS\"><\/small><\/div>\n      <div class=\"mute\">Temporales: <span class=\"temp\" id=\"hpTemp\">0<\/span><br><span id=\"hpState\">Cargando estado…<\/span><\/div>\n      <div class=\"bar\"><i id=\"hpBar\" style=\"width:0\"><\/i><\/div>\n    <\/div>\n    <div class=\"hpctl\">\n      <input id=\"hpAmt\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"5\" aria-label=\"Cantidad\">\n      <button class=\"btn dmg\" type=\"button\" data-hp=\"dmg\">Daño<\/button>\n      <button class=\"btn heal\" type=\"button\" data-hp=\"heal\">Curar<\/button>\n      <button class=\"btn tmp\" type=\"button\" data-hp=\"temp\">Temporales<\/button>\n    <\/div>\n    <div class=\"concq\" id=\"concQ\" hidden><\/div>\n    <div class=\"death\" id=\"deathBox\"><\/div>\n    <p class=\"note\">El daño consume primero los temporales. Los tempor  story:{
  title:"Crónica de la Sin-Sangre",
  portraitAlt:"Ilustración de Yevelda",
  sections:[
   {h:"Los rastreadores que se rastrearon",p:["Vashka era exploradora de una horda de guerra orca: la que iba delante, leyendo el terreno. Tomas era un guardabosques humano que protegía las tierras salvajes por las que la horda cruzaba. Se encontraron como se encuentran dos rastreadores: cada uno siguiendo al otro sin saberlo, en círculos, durante semanas. Cuando por fin se emboscaron mutuamente en el mismo instante, ninguno atacó; se quedaron mirando, hacha y arco a medio alzar, y algo parecido a la risa lo arruinó todo. Se vieron durante dos estaciones, cada vez que la horda acampaba cerca de sus bosques. Después la horda marchó, como siempre marcha. Yevelda nació en el campamento, orca a los ojos de todos. Vashka nunca dijo el nombre del padre."]},
   {h:"Dos escuelas",p:["En el campamento la entrenaron para la guerra, y era un prodigio: más fuerte que orcos adultos a los catorce. Pero cada vez que la horda acampaba en tierras que Tomas rondaba, Yevelda se escabullía, y él la esperaba. De él aprendió lo que ningún capitán enseñaba: leer huellas, moverse por lo salvaje, curar animales, hablarles con el cuerpo antes que con la voz. Tomas le enseñó todo lo que sabía en noches robadas, sin poder decirle nunca, en voz alta, por qué le enseñaba como un padre.","En el campamento, lo aprendido con Tomas la volvió la cuidadora no oficial de los lobos de guerra: los alimentaba, los curaba, les ponía nombres secretos. Los lobos no veían a la semiorca enorme que asustaba a los reclutas nuevos. Los lobos la veían a ella."]},
   {h:"El rito y el exilio",p:["A los dieciséis llegó su rito de sangre: matar su primera presa ante la horda entera. Le trajeron al lobo más débil de la camada que ella misma había criado. Yevelda levantó el hacha… y la clavó en el suelo. Soltó al lobo hacia el bosque y esperó el castigo de pie. Desde ese día algo quedó sellado: puede pelear, romper y aterrar, pero su mano se niega a dar el golpe final. En los años de batalla que vinieron, rompió escudos, huesos y voluntades; el golpe final siempre lo dio otro.","La horda la marcó como sin-sangre y la expulsó con lo puesto. La noche antes, Vashka le dejó junto al petate, en silencio, raciones para dos semanas y sus propias jabalinas: las mismas cuatro que Yevelda lleva hoy. Yevelda buscó los bosques de Tomas y encontró el puesto de guardabosques quemado, viejo de meses. Ni cuerpo, ni rastro. El mejor rastreador que conoció no deja huellas: eso se dice ella para poder dormir."]},
   {h:"El oso de ojos de niebla",p:["Su primer invierno sola, en las montañas, se cruzó con un oso enorme que arrasaba todo a su paso, enfermo de algo que no era rabia, con algo blanco y frío en la mirada, como niebla. Yevelda bajó el hacha, plantó el cuerpo y le habló. Tardó horas. El oso cargó dos veces y dos veces ella aguantó sin responder. Al final, el animal se derrumbó a su lado, y Yevelda pasó tres días acompañándolo mientras la enfermedad de niebla lo apagaba. Murió sin miedo, con la cabeza en su regazo.","Esa noche entendió que puede llegar adonde nadie más llega: las bestias más rotas y furiosas la reconocen, porque ella también es una criatura enorme y temible con algo suave por dentro. Con la piel del oso se hizo su ropa de viaje: no un trofeo de caza, sino una mortaja que camina.","Bajando de esas montañas, la misma niebla fría de los ojos del oso se cerró a su alrededor tres días, y al abrirse, las estrellas eran otras. En estas tierras grises, una semiorca de dos metros y medio vestida de oso recibe puertas cerradas y niños que corren. Ella sonríe igual. Casi siempre funciona mal."]},
   {h:"Apariencia y carácter",p:["21 años, 2,5 m, 87 kg. Ojos pardos, piel morena, pelo negro. Una guerrera brutalmente fuerte y alguien profundamente amable que termina asustando por su apariencia. El trato con los animales es la parte que más ama de sí misma: los animales no juzgan su tamaño ni sus colmillos; sienten la intención. Juega naipes en cada taberna que no la echa; es «imbatible». La verdad: en la horda la dejaban ganar, primero por miedo, con los años por cariño.","Su gatillo: no soporta que maltraten a un animal. Su Furia no es rabia de guerra, es ferocidad protectora. Su amabilidad y su brutalidad son la misma cosa apuntando a lados distintos."],quotes:["Ella sonríe igual. Casi siempre funciona mal."]},
   {h:"Motivaciones",p:["Tres cosas, aunque solo admite dos: entender qué es la niebla que enfermó al oso y ahora la rodea; encontrar un lugar donde alguien la mire dos veces, la segunda de verdad; y (esta no la admite) hallar el rastro de Tomas, o al menos un bosque que se parezca a los suyos."]}
  ],
  people:[["Vashka","Madre. Exploradora de la horda; le dejó sus cuatro jabalinas la noche del exilio, sin decir palabra.","En la horda"],["Tomas","Padre, guardabosques humano. Le enseñó a rastrear, curar y hablar con las bestias. Su puesto apareció quemado.","Desaparecido"],["El oso de ojos de niebla","Murió en su regazo; su piel es ahora su ropa de viaje.","Muerto"]],
  mysteries:["¿Qué fue de Tomas? Su puesto quemado, sin cuerpo ni rastro.","¿Qué era la enfermedad de niebla del oso, y qué quiere de ella la niebla que la trajo a estas tierras?","¿Le dirá alguien, alguna vez, la verdad sobre los naipes?","¿Bajo qué cielo la dejaron las nieblas? Nadie le ha dicho aún el nombre de estas tierras."],
  closing:"Ella sonríe igual. Casi siempre funciona mal."
 },

const fxOn=id=>!!state&&(state.effects||[]).find(e=>e.sp===id);
function derive(){
  const armor=items.find(i=>i.kind==="armor"&&i.equipped);
  const shield=items.find(i=>i.kind==="shield"&&i.equipped);
  const parts=[];
  if(armor) parts.push([armor.name,armor.acBase+(armor.dexMax==null?M.des:Math.min(M.des,armor.dexMax))]);
  else if(CFG.unarmored){parts.push([CFG.unarmored.label||"Defensa sin armadura",10+M.des+(CFG.unarmored.add||[]).reduce((a,k)=>a+M[k],0)]);}
  else parts.push(["Sin armadura (10 + Des)",10+M.des]);
  if(shield) parts.push([shield.name,shield.acBonus||2]);
  items.filter(i=>i.kind!=="shield"&&i.kind!=="armor"&&active(i)&&i.acBonus).forEach(i=>parts.push([i.name,i.acBonus]));
  if(armor&&CFG.defenseStyle) parts.push(["Estilo: Defensa",1]);
  (CFG.selfAC||[]).forEach(([sp,b,n])=>{if(selfFx(sp))parts.push([n,b]);});
  const ac=parts.reduce((a,p)=>a+p[1],0);
  const saveBonus=items.filter(i=>active(i)&&i.saveBonus).reduce((a,i)=>a+i.saveBonus,0);
  return {armor,shield,parts,ac,saveBonus,stealthDis:!!(armor&&armor.stealthDis)};
}
function skillBonus(sk,k){
  const ex=(CFG.expertise||[]).includes(sk);
  const tmp=!!(state&&(CFG.toggles||[]).some(t=>t.skill&&state.toggles[t.id]===sk));
  const p=ex||CFG.skillProf.includes(sk)||tmp;
  return {v:M[k]+(ex?2*PROF:p?PROF:0)-2*(state?state.exh||0:0),p,ex,tmp};
}

function condFlags(){
  const f={atkDis:[],atkAdv:[],chkDis:[],speed0:false,failSD:false,dexSaveDis:false,incap:false};
  if(!state) return f;
  Object.keys(state.conds||{}).filter(k=>state.conds[k]&&CONDS[k]).forEach(k=>{
    const c=CONDS[k],x=c.f;
    if(x.atkDis) f.atkDis.push(c.n+(typeof x.atkDis==="string"?" ("+x.atkDis+")":""));
    if(x.atkAdv) f.atkAdv.push(c.n);
    if(x.chkDis) f.chkDis.push(c.n+(typeof x.chkDis==="string"?" ("+x.chkDis+")":""));
    if(x.speed0) f.speed0=true; if(x.failSD) f.failSD=true; if(x.dexSaveDis) f.dexSaveDis=true; if(x.incap) f.incap=true;
  });
  return f;
}
function modsLine(){
  const f=condFlags(), ex=state?state.exh||0:0, out=[];
  (CFG.selfChips||[]).forEach(([sp,txt])=>{if(selfFx(sp))out.push(`<span class="chip adv">${txt}</span>`);});
  if(ex) out.push(`<span class="chip dis">−${2*ex} d20 (Cansancio ${ex})</span>`);
  return {f,ex,html:out.join(" ")};
}

/* ---------- escritura ---------- */
let pending=null, writing=false, tmr=null;
function save(patch){
  if(!state) return; state={...state,...patch}; render();
  if(!db){setSync("Sin guardado: esta vista no puede escribir",true);return;}
  pending=state; clearTimeout(tmr); tmr=setTimeout(flush,350);
}
async function flush(){
  if(writing||!pending) return; writing=true; const body=pending; pending=null;
  setSync("Guardando…");
  try{await stateRef.set(body); setSync("Guardado");}catch(e){handleWriteErr(e);}
  writing=false; if(pending) flush();
}
async function setItem(i,patch){
  const others=(patch.equipped===true&&(i.kind==="armor"||i.kind==="shield"))?items.filter(x=>x!==i&&x.kind===i.kind&&x.equipped):[];
  Object.assign(i,patch); others.forEach(x=>x.equipped=false); render();
  if(others.length) flash(`${others.map(x=>x.name).join(", ")} pasó a guardado.`);
  if(!db){setSync("Sin guardado: esta vista no puede escribir",true);return;}
  setSync("Guardando…");
  try{for(const x of others) await db.doc(NS+"items/"+x._id).update({equipped:false});
    await db.doc(NS+"items/"+i._id).update(patch); if(!others.length) setSync("Guardado");}catch(e){handleWriteErr(e);}
}
async function removeItem(i){
  items=items.filter(x=>x!==i); render();
  if(!db) return;
  try{await db.doc(NS+"items/"+i._id).delete(); setSync("Guardado");}catch(e){handleWriteErr(e);}
}
function handleWriteErr(e){
  if(e&&e.code==="invalid_argument"){writable=false;setSync("Solo lectura: tu acceso no permite guardar",true);}
  else if(e&&e.code==="quota_exceeded"){setSync("Sin espacio para guardar más",true);}
  else setSync("No se pudo guardar. Revisa la conexión",true);
}
function setSync(t,warn){const el=$("sync");if(!el||!alive)return;el.textContent=t;el.classList.toggle("warn",!!warn);}
function flash(t){setSync(t,true);setTimeout(()=>setSync(writable?"Guardado":"Solo lectura"),2600);}

const TG={self:"A mí",other:"A otro",both:"A mí y a otros"};
function srcInfo(k){
  const s=state||DEFAULT;
  const m=/^slot(\d)$/.exec(k);
  if(m){const sl=curSlots().find(x=>x.lvl==m[1]);const left=sl?sl.max-(s.slots["l"+sl.lvl]||0):0;return {l:`Espacio nv. ${m[1]} (${left} libres)`,ok:left>0};}
  if(k==="ritual") return {l:"Ritual (+10 min, sin espacio)",ok:true};
  const r=CFG.resources.find(x=>x.id===k);
  if(r){const left=r.max-(s.res[r.id]||0);return {l:`${r.short||r.n} (${left} libres)`,ok:left>0,left};}
  return {l:k,ok:false};
}
function spSources(sp){
  const out=[...(sp.src||[])];
  if(!sp.noSlot) curSlots().filter(sl=>sl.lvl>=sp.lvl).forEach(sl=>out.push("slot"+sl.lvl));
  return sp.lvl===0&&!sp.src?[]:out;
}

const cantMax=()=>{const L=clsLvl(G.cls);return G.cantripTable&&L>0?(G.cantripTable[L-1]||0):0;};
const prepMaxLvl=()=>{const L=clsLvl(G.cls);return L>0?(G.maxLvlTable[L-1]||1):1;};

function spellRows(){

function updateSpells(){
  Object.values(spRows).forEach(({src,go,sp})=>{
    const keep=src.value; src.innerHTML="";
    const list=spSources(sp);
    const okFor=k=>{const i=srcInfo(k);return i.ok&&(i.left==null||i.left>=(sp.cost||1));};
    list.forEach(k=>{const i=srcInfo(k);const o=new Option(sp.cost>1&&i.left!=null?i.l.replace(" libres)",` libres · cuesta ${sp.cost})`):i.l,k);o.disabled=!okFor(k);src.add(o);});
    const firstOk=list.find(okFor);
    src.value=(keep&&list.includes(keep)&&okFor(keep))?keep:(firstOk||list[0]||"");
    const incap=condFlags().incap;
    go.disabled=!state||!firstOk||incap;
    go.title=incap?"Incapacitado: no puedes actuar":!firstOk?"Sin recursos":"";
  });

function cast(sp,src,tg,who,whoEl){
  if(!state||!srcInfo(src).ok) return;
  const s=state, patch={}, msg=[];
  const m=/^slot(\d)$/.exec(src);
  if(m){patch.slots={...s.slots,["l"+m[1]]:(s.slots["l"+m[1]]||0)+1};}
  else if(src!=="ritual") patch.res={...s.res,[src]:(s.res[src]||0)+(sp.cost||1)};
  let effects=[...(s.effects||[])], conc=s.conc||null;
  if(sp.conc&&conc){const old=effects.find(e=>e.id===conc);effects=effects.filter(e=>e.id!==conc);if(old)msg.push(`Termina ${old.n} (concentración).`);conc=null;}
  if(sp.dur){const id=String(Date.now());effects.push({id,sp:sp.id,n:sp.n,tg,who:tg==="self"?"":who,conc:!!sp.conc,dur:sp.dur});if(sp.conc)conc=id;}
  if(sp.selfTemp&&(tg==="self"||tg==="both")){patch.temp=Math.max(s.temp||0,sp.selfTemp);msg.push(`Ganas ${sp.selfTemp} PG temporales (se queda el mayor).`);}
  if(sp.selfHeal&&tg==="self"){msg.push(`Tira ${sp.selfHeal} y anótalo con Curar.`);$("hpAmt").focus();}
  else if(sp.inst) msg.push(sp.inst);
  if(m&&+m[1]>sp.lvl&&sp.up) msg.push("Nivel superior: "+sp.up);
  if(m&&sp.heals&&CFG.healBonus) msg.push(`${CFG.healBonus.label}: +${CFG.healBonus.base+(CFG.healBonus.perSlot?+m[1]:0)} PG más.`);
  patch.effects=effects; patch.conc=conc;
  save(patch); if(whoEl) whoEl.value="";
  flash(`${sp.n}${tg==="self"?" a ti":who?" a "+who:""}. `+msg.join(" "));
}

/* ---------- árbol de progresión ---------- */
let tSel=null, tKey="";let tSubView=null;
function treeState(cls,L){
  const have=clsLvl(cls), total=clsLvl("Personaje"), room=CFG.tree.maxTotal-total;
  if(L<=have) return "own";
  if(L===have+1&&room>0) return "nxt";
  if(L<=have+room) return "fut";
  return "out";
}
function renderTree(){
  const T=CFG.tree, box=$("treeBox"); if(!T||!box||!state) return;
  const key=JSON.stringify(state.levels||[])+"|"+JSON.stringify(state.sub||{})+"|"+(tSel?tSel.join(":"):"");
  if(key===tKey) return; tKey=key;
  const total=clsLvl("Personaje");
  $("treeLvl").textContent=`nivel ${total} · ${T.maxTotal-total} niveles por repartir`;
  $("treeNote").textContent=T.note;
  if(!tSel){const c=T.cols.find(c=>!c.pending&&c.levels[clsLvl(c.cls)+1]);tSel=c?[c.cls,clsLvl(c.cls)+1]:null;}
  box.innerHTML="";
  T.cols.forEach(col=>{
    const cdiv=document.createElement("div"); cdiv.className="tcol "+(col.tone||"jade");
    if(col.pending){cdiv.classList.add("pend");cdiv.innerHTML=`<header><b>${esc(col.cls)}</b><span class="chip gold">⏳ pendiente</span></header><p class="note">${esc(col.pending)}</p>`;box.appendChild(cdiv);return;}
    const have=clsLvl(col.cls);
    cdiv.innerHTML=`<header><b>${esc(col.cls)}</b><span>nivel ${have}</span></header><ol class="tnodes"></ol>`;
    const ol=cdiv.querySelector("ol");
    Object.keys(col.levels).map(Number).sort((a,b)=>a-b).forEach(L=>{
      const lv=col.levels[L], st=treeState(col.cls,L);
      const sel=tSel&&tSel[0]===col.cls&&tSel[1]===L;
      const names=lv.f.map(x=>x[0]);
      const isPh=n=>/^(subclase|rasgo de subclase)/i.test(n);
      const base=names.filter(n=>!isPh(n));
      const opts=(col.sub&&col.sub.opts)||[];
      const ch=subOpt(col.cls);
      const chAt=ch&&ch.lv[L]?ch.lv[L].map(x=>x[0]):null;
      const optAt=!ch?opts.filter(o=>o.lv[L]):[];
      let title=base[0]||(chAt?ch.n+": "+chAt.join(" · "):names[0]);
      let subLines="";
      if(chAt&&base.length) subLines=`<small class="tsl1"><i>${esc(ch.n)}</i> ${esc(chAt.join(" · "))}</small>`;
      else if(optAt.length) subLines=optAt.map(o=>`<small class="tsl1 alt"><i>${esc(o.n)}</i> ${esc(o.lv[L].map(x=>x[0]).join(" · "))}</small>`).join("");
      const tag=lv.sa?`Furtivo ${lv.sa}`:lv.art?`Planes ${lv.art.plans} · prep. ${lv.art.prep}`:lv.ma?`A.M. ${lv.ma} · conc. ${lv.focus||0}`:lv.rages?`Furias ${lv.rages} · +${lv.rageDmg}`:lv.loh?`Manos ${lv.loh} · espacios ${(lv.sl||[]).join("/")}`:lv.sl?`Espacios ${lv.sl.join("/")}`:"";
      const li=document.createElement("li"); li.className=`tn ${st}${sel?" sel":""}${lv.asi?" asi":""}${lv.branch?" br":""}`;
      li.innerHTML=`<button type="button" aria-pressed="${sel}"><span class="dot">${L}</span><span class="tx"><b>${esc(title)}</b>${base.length>1?`<small>+ ${esc(base.slice(1).join(" · "))}</small>`:""}${subLines}${tag?`<small class="tg">${esc(tag)}</small>`:""}</span></button>`;
      li.querySelector("button").onclick=()=>{tSel=[col.cls,L];renderTree();openTreeDet();};
      ol.appendChild(li);
      if(lv.branch&&col.sub&&col.sub.opts&&subChosen(col.cls)){
        const br=document.createElement("li"); br.className="tbranch";
        br.innerHTML=col.sub.opts.map(o=>`<span class="bn${subChosen(col.cls)===o.id?" on":""}">${esc(o.n)}</span>`).join("");
        ol.appendChild(br);
      }
    });
    box.appendChild(cdiv);
  });
  renderTreeDet();
}
function renderTreeDet(){
  const det=$("treeDet"), T=CFG.tree;
  if(!tSel){det.innerHTML=`<p class="mute">Toca un nodo para ver qué da.</p>`;return;}
  const [cls,L]=tSel, col=T.cols.find(c=>c.cls===cls), lv=col.levels[L], st=treeState(cls,L);
  const lab={own:"Lo tienes",nxt:"Disponible en tu próxima subida",fut:"Futuro",out:"Fuera de alcance: superaría el nivel 20"}[st];
  let h=`<div class="tdh"><button type="button" class="btn ghost tclose" aria-label="Cerrar">✕</button><span class="dot ${st}">${L}</span><div><b>${esc(cls)} ${L}</b><small>${lab}</small></div></div>`;
  lv.f.filter(x=>x[1]).forEach(([n,d])=>h+=`<div class="tf"><b>${esc(n)}</b><p>${esc(d)}</p></div>`);
  let subOpts=null;
  if(lv.branch||lv.subl){
    const opts=(col.sub.opts||[]).filter(o=>o.lv[L]);
    if(opts.length){
      subOpts=opts;
      const chId=subChosen(cls), fixed=subFixed(cls), locked=fixed||clsLvl(cls)>=col.sub.at;
      if(!opts.some(o=>o.id===tSubView)) tSubView=chId||opts[0].id;
      const o=opts.find(x=>x.id===tSubView);
      const lvKeys=Object.keys(o.lv).map(Number).sort((a,b)=>a-b);

  if(meta.length) h+=`<div class="acrow">${meta.map(m=>`<span>${esc(m)}</span>`).join("")}</div>`;
  if(st==="nxt"){

let recFilter="all", recBuilt=false;
function invCount(name){
  if(!loaded||!name) return null;
  const low=name.toLowerCase();
  const hit=items.filter(i=>String(i.name).toLowerCase().startsWith(low));
  if(!hit.length) return null;
  const q=hit.reduce((a,i)=>a+(typeof i.qty==="number"?i.qty:1),0);
  return {q,loc:hit.map(i=>i.equipped?"equipado":locOf(i)).filter((v,i,a)=>a.indexOf(v)===i).join(", ")};
}

  },()=>{clearTimeout(timer);setSync("No se puede leer el estado",true);}));
  UNSUBS.push(db.collection(NS+"gold").onSnapshot(q=>{gold=q.docs.map(x=>({...x.data(),_id:x.id}));goldLoaded=true;render();},()=>{goldLoaded=true;setSync("No se puede leer el oro",true);render();}));

})();

function HUB(){
  let obs=null;
  const links=document.querySelectorAll('#navLinks a');
  const sections=Array.prototype.map.call(links,a=>document.getElementById(a.getAttribute('href').slice(1)));
  if('IntersectionObserver' in window){
    obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.remove('active'));const i=sections.indexOf(e.target);if(i>-1)links[i].classList.add('active');}});},{rootMargin:'-20% 0px -70% 0px'});
    sections.forEach(s=>{if(s)obs.observe(s);});
  }
  const q=document.getElementById('q'),qn=document.getElementById('qn');
  const cards=Array.prototype.slice.call(document.querySelectorAll('.fcard,.example-card'));
  const secs=Array.prototype.slice.call(document.querySelectorAll('main > section')).filter(s=>s.id!=='personajes'&&s.id!=='reglas');
  const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  q.addEventListener('input',()=>{
    const t=norm(q.value.trim());let n=0;
    cards.forEach(c=>{const ok=!t||norm(c.textContent).indexOf(t)>-1;c.hidden=!ok;if(ok)n++;});
    secs.forEach(s=>{s.hidden=!Array.prototype.some.call(s.querySelectorAll('.fcard,.example-card'),c=>!c.hidden);});
    qn.textContent=t?(n+' resultado'+(n===1?'':'s')):'';
  });
  return ()=>{if(obs)obs.disconnect();};
}
const css=document.getElementById('appcss'), app=document.getElementById('app');
let cur=null, teardown=null;
function go(id,push){
  if(!CH[id]) id="";
  if(id===cur) return;
  cur=id;
  if(teardown){try{teardown();}catch(_){} teardown=null;}
  if(push){try{history.replaceState(null,"",id?"#/"+id:"#/");}catch(_){}}
  window.scrollTo(0,0);
  if(id){
    const c=CH[id];
    css.textContent=SHEET_CSS+c.css;
    app.innerHTML=c.body;
    c.cfg(); window.CHAR.ns="c/"+id;
    const nav=app.querySelector(".idx .in");
    if(nav) nav.insertAdjacentHTML("afterbegin",'<a href="#/" class="home">← Mesa</a>');
    teardown=SHEET();
  }else{
    css.textContent=HUB_CSS;
    app.innerHTML=HUB_HTML;
    document.title="Mesa de Lucho";
    teardown=HUB();
  }
}
