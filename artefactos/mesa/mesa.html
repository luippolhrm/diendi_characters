id=\"sintonizacion\">\n      <div class=\"fhead\"><span class=\"fname\">Sintonización <span class=\"en\">Attunement<\/span><\/span><span class=\"tag\">equipo<\/span><\/div>\n      <p>Algunos objetos mágicos requieren formar este vínculo antes de usar sus propiedades mágicas; sin sintonizar, solo obtienes sus beneficios no mágicos.<\/p>\n      <p><b>Sintonizarse.<\/b> Un descanso corto concentrado solo en el objeto, en contacto físico (no puede ser el mismo descanso usado para identificarlo). Si el descanso se interrumpe, el intento falla.<\/p>\n      <p><b>Máximo 3.<\/b> No puedes estar sintonizado con más de tres objetos a la vez, ni con más de una copia del mismo objeto.<\/p>\n      <p><b>Terminar.<\/b> La sintonización acaba si dejas de cumplir los requisitos, si el objeto pasa 24 horas a más de 30 m de ti, si mueres o si otra criatura se sintoniza con él. También puedes terminarla voluntariamente con otro descanso corto concentrado en el objeto, salvo que esté maldito.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"ejemplos\">\n  <h2>Ejemplos<\/h2>\n  <p class=\"section-note\">Personajes genéricos, no de tu mesa — solo para ver las reglas encadenadas en un turno real. Los términos subrayados enlazan a su regla.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"example-card\" id=\"ejemplo-combate\">\n      <div class=\"fhead\"><span class=\"fname\">Un turno de combate<\/span><span class=\"tag-ex\">ejemplo<\/span><\/div>\n      <p class=\"setup\">Vela, pícara, se enfrenta a un goblin. CA de Vela 15, bono de ataque con espada corta +6, daño 1d6+4 cortante más 2d6 de Ataque furtivo si tiene ventaja o un aliado junto al objetivo. El goblin tiene CA 13 y 7 PG.<\/p>\n      <ol>\n        <li><b><a href=\"#iniciativa\">Tirar iniciativa.<\/a><\/b> Vela saca 18, suma +3 de Destreza = 21. Actúa antes que el goblin.<\/li>\n        <li><b>Movimiento.<\/b> Gasta parte de su velocidad para colocarse junto al goblin, dentro de su alcance de 1,5 m.<\/li>\n        <li><b><a href=\"#resolver-ataque\">Acción: Atacar.<\/a><\/b> Escoge al goblin como objetivo. Un aliado ya está a su lado, así que tiene ventaja. Tira 2d20 (14 y 9, se queda con el 14) +6 = 20, supera la CA 13 → acierta.<\/li>\n        <li><b>Daño.<\/b> 1d6+4 del arma (9) + 2d6 de Ataque furtivo, activado porque tenía ventaja (7) = 16 de daño. Con solo 7 PG, <a href=\"#llegar-a-0-puntos-de-golpe\">el goblin muere en el acto<\/a> — los monstruos mueren en cuanto llegan a 0 PG.<\/li>\n        <li><b>Resto del turno.<\/b> Le queda movimiento sin gastar; lo usa para ponerse a cubierto tras un pilar antes de que termine su turno.<\/li>\n      <\/ol>\n    <\/div>\n\n    <div class=\"example-card\" id=\"ejemplo-exploracion\">\n      <div class=\"fhead\"><span class=\"fname\">Un turno de exploración<\/span><span class=\"tag-ex\">ejemplo<\/span><\/div>\n      <p class=\"setup\">Bram, explorador, investiga una cripta. Bono de Sabiduría (Percepción) +5, bono de Destreza (Sigilo) +6. La sala tiene una única antorcha lejana.<\/p>\n      <ol>\n        <li><b><a href=\"#vision-e-iluminacion\">Visión e iluminación.<\/a><\/b> La luz tenue deja la sala ligeramente oscura: desventaja en Percepción que dependa de la vista.<\/li>\n        <li><b><a href=\"#buscar\">Acción: Buscar.<\/a><\/b> Quiere notar algo raro en un estante. Prueba de Sabiduría (Percepción) CD 15 con desventaja: tira 12 y 16, se queda con el 12, +5 = 17 → supera la CD y nota una rendija sospechosa en la pared.<\/li>\n        <li><b><a href=\"#objetos\">Interactuar con objetos.<\/a><\/b> Mueve el estante como su interacción gratuita del turno, sin gastar su acción.<\/li>\n        <li><b>Peligro inesperado.<\/b> El estante activa una trampa de dardos. Salvación de Destreza CD 13: tira 9, +4 = 13 → supera por muy poco, sin daño.<\/li>\n        <li><b><a href=\"#esconderse\">Acción: Esconderse.<\/a><\/b> Oye pasos en el pasillo. Prueba de Destreza (Sigilo) CD 15: tira 13, +6 = 19 → éxito. Obtiene el estado de <a href=\"#invisible\">invisible<\/a> mientras permanezca oculto.<\/li>\n      <\/ol>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n\n<\/main>\n<footer>Mesa de Lucho · D&amp;D 2024 · Reglas: PHB 2024 (Devir), capítulos 1, 6 y 7 y Apéndice C, transcritos en Notion · Hojas de personaje como artefactos interactivos.<\/footer>\n";
const SHEET_CSS="\n/* Layout: banda de héroe con los números vivos, tablero de juego y referencia abajo. Paleta de Usoryn: jade de Brisasol, cielo de acantilado y arena. Motor configurable: los datos del personaje viven en CFG. */\n:root{\n  --bg:#F3F7F6; --surface:#FFFFFF; --ink:#16202A; --ink-2:#3A4A57; --ink-3:#62717C;\n  --line:#DCE3E8; --line-2:#C8D2D9;\n  --violet:#1F8A70; --violet-d:#15705A; --violet-soft:#E3F1EC;\n  --gold:#C99A3E; --gold-d:#9A7023; --gold-soft:#F7EED9;\n  --ruby:#C04A3E; --ruby-soft:#F8E6E3; --good:#2E7D52; --good-soft:#E2F1E9;\n  --hero-1:#123A4A; --hero-2:#1F6B6A; --hero-ink:#F1FAF7; --hero-mute:#BCD9D3;\n  --display:\"Fraunces\",Georgia,serif; --body:\"Inter\",system-ui,-apple-system,\"Segoe UI\",sans-serif; --num:\"Space Grotesk\",\"Inter\",system-ui,sans-serif;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0F1719; --surface:#172225; --ink:#E7F1EF; --ink-2:#B4C6C3; --ink-3:#8BA09C;\n  --line:#25363A; --line-2:#33484D; --violet:#5CC4A6; --violet-d:#86D9C0; --violet-soft:#163430;\n  --gold:#D9B45E; --gold-d:#E6C77E; --gold-soft:#2E2614; --ruby:#E0687F; --ruby-soft:#3A1A22; --good:#6CC495; --good-soft:#16301F;\n  --hero-1:#0C2830; --hero-2:#14474A; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0F1719; --surface:#172225; --ink:#E7F1EF; --ink-2:#B4C6C3; --ink-3:#8BA09C;\n  --line:#25363A; --line-2:#33484D; --violet:#5CC4A6; --violet-d:#86D9C0; --violet-soft:#163430;\n  --gold:#D9B45E; --gold-d:#E6C77E; --gold-soft:#2E2614; --ruby:#E0687F; --ruby-soft:#3A1A22; --good:#6CC495; --good-soft:#16301F;\n  --hero-1:#0C2830; --hero-2:#14474A; color-scheme:dark}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}\n.in{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nh1,h2,h3{margin:0;text-wrap:balance}\np{margin:0}\nbutton{font:inherit;cursor:pointer}\nbutton:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--violet);outline-offset:2px}\n.num{font-family:var(--num);font-variant-numeric:tabular-nums}\n.lbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}\n.mute{color:var(--ink-3);font-size:13px}\n.en{color:var(--ink-3);font-weight:400;font-size:.85em}\n\n/* Héroe */\n.hero{background:linear-gradient(150deg,var(--hero-1),var(--hero-2));color:var(--hero-ink);border-bottom:3px solid var(--gold)}\n.hero .in{padding-block:22px 18px;display:grid;gap:16px}\n.hero .eyebrow{color:var(--gold);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}\n.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,60px);line-height:1;letter-spacing:-.01em}\n.hero .who{color:var(--hero-mute);font-size:14px}\n.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}\n@media (max-width:720px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}\n.stat{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}\n.stat .lbl{color:var(--hero-mute)}\n.stat b{font-family:var(--num);font-size:28px;line-height:1.05;color:#fff}\n.stat small{font-size:11.5px;color:var(--hero-mute);line-height:1.25}\n.stat.ac{border-color:var(--gold)}\n.stat.ac b{color:var(--gold)}\n.restbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.restbar button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px}\n.restbar button:hover{background:rgba(255,255,255,.16)}\n.restbar button[aria-pressed=\"true\"]{background:var(--gold);border-color:var(--gold);color:#241A0A}\n.sync{margin-left:auto;font-size:12px;color:var(--hero-mute)}\n.sync.warn{color:#FFC9D3}\n\n/* Tablero */\nmain .in{padding-block:20px 64px;display:grid;gap:18px}\n.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}\n@media (max-width:820px){.board{grid-template-columns:1fr}}\n.col{display:grid;gap:18px;min-width:0}\n.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}\n.card>h2{font-family:var(--display);font-size:21px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}\n.card>h2 .lbl{font-family:var(--body)}\n\n/* PG */\n.hp{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}\n.hpnum{font-family:var(--num);font-size:44px;line-height:1;font-weight:700}\n.hpnum small{font-size:18px;color:var(--ink-3);font-weight:500}\n.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;grid-column:1/-1}\n.bar i{display:block;height:100%;background:var(--good);transition:width .25s}\n.bar i.low{background:var(--ruby)}\n.temp{font-family:var(--num);font-weight:600;color:var(--violet)}\n.hpctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}\n.hpctl input{width:76px;padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--ink);font-family:var(--num);font-size:16px}\n.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}\n.btn:hover{border-color:var(--violet)}\n.btn.dmg{color:var(--ruby);border-color:var(--ruby)}\n.btn.heal{color:var(--good);border-color:var(--good)}\n.btn.tmp{color:var(--violet);border-color:var(--violet)}\n.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3);padding:4px 8px}\n\n/* Marcadores */\n.res{display:grid;gap:10px}\n.track{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}\n.track:last-child{border-bottom:0;padding-bottom:0}\n.track .t b{display:block;font-weight:600}\n.track .t span{font-size:12.5px;color:var(--ink-3)}\n.pips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}\n.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--violet);background:transparent;padding:0}\n.pip[aria-pressed=\"true\"]{background:var(--violet-soft);border-style:dashed;border-color:var(--ink-3)}\n.pip:not([aria-pressed=\"true\"]){background:var(--violet)}\n.pip.gold{border-color:var(--gold)} .pip.gold:not([aria-pressed=\"true\"]){background:var(--gold)}\n.stepper{display:flex;align-items:center;gap:6px}\n.stepper output{min-width:58px;text-align:center;font-family:var(--num);font-weight:700;font-size:18px}\n.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700}\n\n/* Ataques y tablas */\n.tbl{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:14px}\nth,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}\nth{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}\ntr:last-child td{border-bottom:0}\ntd.n{font-family:var(--num);font-weight:700;white-space:nowrap}\n.note{font-size:12.5px;color:var(--ink-3)}\n.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--gold-soft);color:var(--gold-d)}\n.flag.bad{background:var(--ruby-soft);color:var(--ruby)}\n.empty{border:1px dashed var(--line-2);border-radius:10px;padding:14px;color:var(--ink-3);font-size:14px}\n\n/* Atributos */\n.abil{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}\n.ab{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;min-width:0}\n.ab .top{display:flex;justify-content:space-between;align-items:baseline}\n.ab .top b{font-family:var(--num);font-size:22px}\n.ab ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:1px}\n.ab li{display:flex;justify-content:space-between;gap:6px}\n.ab li span:last-child{font-family:var(--num);font-weight:600}\n.ab li.p span:first-child{font-weight:600}\n.ab li.p span:first-child::before{content:\"● \";color:var(--violet);font-size:9px;vertical-align:2px}\n.ab li.tmp span:first-child::before{content:\"◐ \";color:var(--gold);font-size:9px;vertical-align:2px}\n@media (max-width:460px){.abil{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.astral{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}\nselect,.f input{padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;max-width:100%}\n\n/* Equipo */\n.items{display:grid;gap:8px}\n.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.item.on{border-color:var(--violet);background:var(--violet-soft)}\n.item .slot{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding-top:3px;min-width:58px}\n.item .body b{font-weight:600}\n.item .body p{font-size:12.5px;color:var(--ink-2)}\n.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:center}\n.sw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:99px;padding:3px 10px 3px 4px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:600}\n.sw i{width:18px;height:18px;border-radius:50%;background:var(--line-2);transition:background .15s}\n.sw[aria-pressed=\"true\"]{border-color:var(--violet);color:var(--violet-d)}\n.sw[aria-pressed=\"true\"] i{background:var(--violet)}\n.sw.att[aria-pressed=\"true\"]{border-color:var(--gold);color:var(--gold-d)}\n.sw.att[aria-pressed=\"true\"] i{background:var(--gold)}\n.qty{display:inline-flex;align-items:center;gap:4px;font-family:var(--num);font-weight:600;font-size:13px}\n.qty button{width:24px;height:2   {"id": "magicweapon", "lvl": 2, "n": "Arma mágica", "en": "Magic Weapon", "tag": "+1 ataque/daño", "src": [], "tg": ["self", "other"], "dur": "1 h", "meta": "Nivel 2 · Transmutación · Acción adicional · Toque · V, S · 1 hora", "d": "Un arma no mágica que toques se vuelve mágica con +1 a tiradas de ataque y daño durante 1 h. Termina antes si lo vuelves a lanzar.", "up": "+2 con espacio de nivel 3-5; +3 con espacio de nivel 6+."},
  {"id": "aid", "lvl": 2, "n": "Auxilio", "en": "Aid", "tag": "+5 PG máx", "src": [], "tg": ["self", "other"], "dur": "8 h", "meta": "Nivel 2 · Abjuración · Acción · 9 m (30 ft) · V, S, M (una tira de tela blanca) · 8 horas", "d": "Hasta 3 criaturas dentro del alcance aumentan sus PG máximos y actuales en 5 durante 8 h.", "up": "+5 PG adicionales por cada nivel por encima de 2."},
  {"id": "cordon", "lvl": 2, "n": "Cordón de flechas", "en": "Cordon of Arrows", "tag": "2d4 · CD 13 Des", "src": [], "tg": ["other"], "dur": "8 h", "meta": "Nivel 2 · Transmutación · Acción · Toque · V, S, M (una trenza ornamental) · 8 horas", "d": "Clavas hasta 4 flechas o virotes no mágicos en el suelo de tu espacio. Durante 8 h, cuando una criatura (no tú) entre por primera vez en un turno en un espacio a 9 m (30 ft) o menos o termine su turno ahí, un proyectil la ataca: salva Destreza CD 13 o sufre 2d4 perforante; el proyectil se destruye. Puedes designar criaturas a ignorar. Termina al agotarse la munición.", "up": "+2 proyectiles por cada nivel por encima de 2."},
  {"id": "spikegrowth", "lvl": 2, "n": "Crecimiento espinoso", "en": "Spike Growth", "tag": "2d4 por 1,5 m", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 2 · Transmutación · Acción · 45 m (150 ft) · V, S, M (siete espinas) · concentración hasta 10 min", "d": "Esfera de 6 m (20 ft) de radio de espinas: terreno difícil, y toda criatura que entre o se desplace sufre 2d4 perforante por cada 1,5 m (5 ft) que avance. El terreno parece natural: quien no vio el lanzamiento necesita una acción de Buscar y superar Sabiduría (Percepción o Supervivencia) CD 13 para reconocerlo."},
  {"id": "findtraps", "lvl": 2, "n": "Detectar trampas", "en": "Find Traps", "tag": "utilidad", "src": [], "tg": ["self"], "meta": "Nivel 2 · Adivinación · Acción · 36 m (120 ft) · V, S", "d": "Detectas cualquier trampa dentro del alcance en tu línea de visión (objetos o mecanismos creados para dañar, incluidos conjuros como Alarma o Glifo custodio; no peligros naturales). Sabes que existe y la naturaleza general del peligro, pero no su ubicación."},
  {"id": "summonbeast", "lvl": 2, "n": "Invocar bestia", "en": "Summon Beast", "tag": "espíritu bestial", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 1 h", "meta": "Nivel 2 · Conjuración · Acción · 27 m (90 ft) · V, S, M (pluma, pelaje y cola de pez en una bellota bañada en oro de 200 po+) · concentración hasta 1 hora", "d": "Invocas un espíritu bestial (tierra, mar o aire) en un espacio libre que veas; es tu aliado, actúa justo después de ti y obedece tus órdenes verbales (sin acción); sin órdenes, Esquiva. Perfil: CA 13 (11 + nivel del conjuro), PG 20 (aire) o 30 (tierra/mar), Desgarro con tu bono de ataque de conjuros (+5), 1d8 + 4 + 2 perforante; Ataque múltiple: 1 ataque a nivel 2. Desaparece a 0 PG o al terminar.", "up": "El nivel del espacio determina el nivel del conjuro en el perfil (CA, PG +5/nivel, daño y número de ataques)."},
  {"id": "locateanimals", "lvl": 2, "n": "Localizar animales o plantas", "en": "Locate Animals or Plants", "tag": "7,5 km", "src": ["ritual"], "tg": ["self"], "meta": "Nivel 2 · Adivinación · Acción o ritual · Lanzador · V, S, M (pelaje de un sabueso)", "d": "Describe o nombra un tipo de bestia, criatura Planta o planta no mágica: conoces dirección y distancia a la más cercana a 7,5 km (5 millas) o menos, si existe."},
  {"id": "locateobject", "lvl": 2, "n": "Localizar objeto", "en": "Locate Object", "tag": "utilidad", "src": [], "tg": ["self"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 2 · Adivinación · Acción · Lanzador · V, S, M (una ramita con forma de horquilla) · concentración hasta 10 min", "d": "Describe o nombra un objeto conocido: presientes su dirección si está a 300 m (1.000 ft) o menos, y la dirección de su movimiento. Puede ser un objeto específico que hayas visto de cerca (9 m) o el más cercano de un tipo. Lo bloquea cualquier grosor de plomo."},
  {"id": "animalmsg", "lvl": 2, "n": "Mensajero animal", "en": "Animal Messenger", "tag": "mensaje 24 h", "src": ["ritual"], "tg": ["other"], "dur": "24 h", "meta": "Nivel 2 · Encantamiento · Acción o ritual · 9 m (30 ft) · V, S, M (unas migajas de comida) · 24 horas", "d": "Una bestia Diminuta que veas salva Carisma CD 13 (supera automáticamente si su VD no es 0) o lleva un mensaje de hasta 25 palabras a un lugar que hayas visitado y a un destinatario que describas. Recorre unos 37,5 km por 24 h (75 km volando). Si no llega antes de terminar, el mensaje se pierde y regresa.", "up": "+48 h de duración por cada nivel por encima de 2."},
  {"id": "passwithout", "lvl": 2, "n": "Pasar sin rastro", "en": "Pass without Trace", "tag": "+10 Sigilo", "src": [], "tg": ["self", "other"], "conc": 1, "dur": "hasta 1 h", "meta": "Nivel 2 · Abjuración · Acción · Lanzador · V, S, M (cenizas de muérdago quemado) · concentración hasta 1 hora", "d": "Emanación de 9 m (30 ft): tú y las criaturas que elijas dentro tenéis +10 a Destreza (Sigilo) y no dejáis huellas."},
  {"id": "barkskin", "lvl": 2, "n": "Piel robliza", "en": "Barkskin", "tag": "CA mín 17", "src": [], "tg": ["self", "other"], "dur": "1 h", "meta": "Nivel 2 · Transmutación · Acción adicional · Toque · V, S, M (un puñado de corteza) · 1 hora", "d": "Una criatura voluntaria que toques tiene CA mínima 17 durante 1 h."},
  {"id": "enhance", "lvl": 2, "n": "Potenciar característica", "en": "Enhance Ability", "tag": "ventaja pruebas", "src": [], "tg": ["self", "other"], "conc": 1, "dur": "hasta 1 h", "meta": "Nivel 2 · Transmutación · Acción · Toque · V, S, M (pelo de animal o una pluma) · concentración hasta 1 hora", "d": "Una criatura que toques elige Fuerza, Destreza, Inteligencia, Sabiduría o Carisma: ventaja en las pruebas de esa característica durante 1 h.", "up": "+1 criatura objetivo por cada nivel por encima de 2 (característica distinta por objetivo)."},
  {"id": "protpoison", "lvl": 2, "n": "Protección contra veneno", "en": "Protection from Poison", "tag": "resist. veneno", "src": [], "tg": ["self", "other"], "dur": "1 h", "meta": "Nivel 2 · Abjuración · Acción · Toque · V, S · 1 hora", "d": "Una criatura que toques deja de estar Envenenada y, durante 1 h, tiene ventaja en salvaciones contra el estado Envenenado y resistencia al daño de veneno."},
  {"id": "gust", "lvl": 2, "n": "Ráfaga de viento", "en": "Gust of Wind", "tag": "CD 13 Fue", "src": [], "tg": ["other"], "conc": 1, "dur": "hasta 1 min", "meta": "Nivel 2 · Evocación · Acción · Lanzador · V, S, M (la semilla de una legumbre) · concentración hasta 1 min", "d": "Línea de viento fuerte de 18 m (60 ft) de largo y 3 m (10 ft) de ancho desde ti. Cada criatura en la línea (y quien termine su turno en ella) salva Fuerza CD 13 o es empujada 4,5 m (15 ft). Acercarse a ti cuesta el doble de movimiento. Dispersa gas/vapor, apaga llamas desprotegidas (50 % las protegidas). Con una acción adicional cambias la dirección."},
  {"id": "lesserresto", "lvl": 2, "n": "Restablecimiento menor", "en": "Lesser Restoration", "tag": "quita estado", "src": [], "tg": ["self", "other"], "meta": "Nivel 2 · Abjuración · Acción adicional · Toque · V, S", "d": "Una criatura que toques deja de tener uno de estos estados: Cegado, Ensordecido, Envenenado o Paralizado."},
  {"id": "beastsense", "lvl": 2, "n": "Sentidos de la bestia", "en": "Beast Sense", "tag": "ver por bestia", "src": ["ritual"], "tg": ["other"], "conc": 1, "dur": "hasta 1 h", "meta": "Nivel 2 · Adivinación · Acción o ritual · Toque · S · concentración hasta 1 hora", "d": "Tocas a una bestia voluntaria: durante 1 h puedes percibir a través de sus sentidos además de los tuyos, con sus sentidos especiales."},
  {"id": "silence", "lvl": 2, "n": "Silencio", "en": "Silence", "tag": "esfera 6 m", "src": ["ritual"], "tg": ["other"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 2 · Ilusionismo · Acción o ritual · 36 m (120 ft) · V, S · concentración hasta 10 min", "d": "Esfera de 6 m (20 ft) de radio sin sonido: nada suena ni atraviesa su borde. Dentro: inmunidad al daño de trueno (si está completamente dentro), las criaturas quedan Ensordecidas y no se pueden lanzar conjuros con componente verbal."},
  {"id": "darkvision", "lvl": 2, "n": "Visión en la oscuridad", "en": "Darkvision", "tag": "visión osc. 45 m", "src": [], "tg": ["self", "other"], "dur": "8 h", "meta": "Nivel 2 · Transmutación · Acción · Toque · V, S, M (una zanahoria seca) · 8 horas", "d": "Una criatura voluntaria que toques tiene visión en la oscuridad hasta 45 m (150 ft) durante 8 h."}

 featGroups:[["Pícaro","Pícaro","Clase inicial · nivel {Pícaro}","sky"],["Explorador","Explorador","Nivel {Explorador}","jade"],["Artífice","Artífice","Nivel {Artífice}","sand"],["Cazador","Cazador","Subclase de Explorador","jade"],["Mediano","Mediano","Especie · Pequeño","sand"],["Artesano","Artesano","Trasfondo y dote de origen","sand"]],
 feats:[
  {o:"Pícaro",c:"Pícaro",l:1,lt:"Píc 1",use:"1×/turno",n:"Ataque furtivo",en:"Sneak Attack",src:"PHB 2024",d:["Una vez por turno, +1d6 de daño a una criatura que aciertes con un arma sutil o a distancia si tienes ventaja en la tirada.","No necesitas ventaja si un aliado no incapacitado está a 1,5 m o menos del objetivo y no tienes desventaja.","Se queda en 1d6: sube solo con niveles de Pícaro."]},
  {o:"Pícaro",c:"Pícaro",l:1,lt:"Píc 1",use:"Pasivo",n:"Jerga de ladrones",en:"Thieves' Cant",src:"PHB 2024",d:["Conoces la jerga de ladrones y otro idioma de tu elección."]},
  {o:"Pícaro",c:"Pícaro",l:1,lt:"Píc 1",use:"Cambia en desc. largo",n:"Maestría con armas",en:"Weapon Mastery",src:"PHB 2024",d:["Usas las propiedades de maestría de 2 tipos de armas con las que tengas competencia; se cambian tras un descanso largo. Hoy: Hoopak y Espada corta.","🟡 Pícaro y Explorador dan este rasgo cada uno; el Capítulo 2 no dice si se suman. La hoja usa 2 en total."]},
  {o:"Pícaro",c:"Pícaro",l:1,lt:"Píc 1",use:"Pasivo",n:"Pericia",en:"Expertise",src:"PHB 2024",d:["Pericia (doble competencia) en Juego de Manos (+11) y Sigilo (+11)."]},
  {o:"Pícaro",c:"Pícaro",l:2,lt:"Píc 2",use:"Acción adicional",n:"Acción astuta",en:"Cunning Action",src:"PHB 2024",d:["En tu turno, puedes correr, destrabarte o esconderte como acción adicional."]},
  {o:"Explorador",c:"Explorador",l:1,lt:"Exp 1",use:"4 nv1 · 2 nv2",n:"Lanzamiento de conjuros",en:"Spellcasting",src:"PHB 2024",d:["Aptitud: Sabiduría (CD 13, ataque +5). Foco: canalizador druídico.","Como multiclase con un solo lanzador, usas la tabla del Explorador a su nivel: 6 conjuros preparados, 4 espacios de nivel 1 y 2 de nivel 2. Vuelven en descanso largo; cambias 1 preparado por descanso largo."]},
  {o:"Explorador",c:"Explorador",l:1,lt:"Exp 1",use:"3 / desc. largo",n:"Enemigo predilecto",en:"Favored Enemy",src:"PHB 2024",d:["Siempre tienes Marca del Cazador preparada, sin contar en tus 6.","La lanzas sin gastar espacio 3 veces a Explorador 5 (2 en niveles 1 a 4); se recuperan en descanso largo."]},
  {o:"Explorador",c:"Explorador",l:1,lt:"Exp 1",use:"Pasivo",n:"Competencia multiclase",en:"Multiclass Proficiency",src:"PHB 2024",d:["Al entrar como Explorador multiclase ganaste armaduras medias, escudos, armas marciales y una habilidad de su lista: Percepción."]},
  {o:"Explorador",c:"Explorador",l:2,lt:"Exp 2",use:"Pasivo",n:"Estilo de combate: Tiro con arco",en:"Archery",src:"PHB 2024 · dote",d:["+2 a las tiradas de ataque con armas a distancia (tirachinas del Hoopak y honda)."]},
  {o:"Explorador",c:"Explorador",l:2,lt:"Exp 2",use:"Pasivo",n:"Explorador hábil",en:"Deft Explorer",src:"PHB 2024",d:["Conoces dos idiomas de tu elección.","Pericia en una habilidad con la que ya tengas competencia: Persuasión (+6)."]},
  {o:"Explorador",c:"Explorador",l:4,lt:"Exp 4",use:"Pasivo",n:"Mejora de característica",en:"Ability Score Improvement",src:"PHB 2024",d:["+2 Destreza (18 → 20)."]},
  {o:"Explorador",c:"Explorador",l:5,lt:"Exp 5",use:"Acción de atacar",n:"Ataque adicional",en:"Extra Attack",src:"PHB 2024",d:["Cuando haces la acción de atacar en tu turno, haces dos ataques en lugar de uno."]},
  {o:"Explorador",c:"Explorador",l:6,lt:"Exp 6",use:"Pasivo",n:"Errante",en:"Roving",src:"PHB 2024",d:["Tu velocidad aumenta 3 m (10 ft) si no llevas armadura pesada.","Ganas velocidad nadando y trepando iguales a tu velocidad."]},
  {o:"Cazador",c:"Explorador",l:3,lt:"Exp 3",n:"El cazador y la presa",en:"Hunter's Prey",src:"PHB 2024",d:["Eliges una opción y puedes cambiarla tras un descanso corto o largo (se cambia en Recursos).","Azote de colosos: al acertar con un arma a una criatura que no tiene todos sus PG, +1d8 de daño, 1 vez por turno.","Destructor de hordas: 1 vez en tu turno, al atacar con un arma, haces otro ataque con la misma arma contra una criatura distinta a 1,5 m del objetivo original que no hayas atacado este turno."]},
  {o:"Cazador",c:"Explorador",l:3,lt:"Exp 3",use:"Con Marca activa",n:"Sabiduría del cazador",en:"Hunter's Lore",src:"PHB 2024",d:["Mientras una criatura tenga tu Marca del Cazador, sabes si tiene inmunidades, resistencias o vulnerabilidades, y cuáles."]},
  {o:"Artífice",c:"Artífice",l:1,lt:"Art 1",use:"Pasivo",n:"Competencia multiclase",en:"Multiclass Proficiency",src:"Forge of the Artificer",d:["Al entrar como Artífice multiclase ganas competencia con herramientas de manitas, una habilidad de su lista y entrenamiento con armaduras ligeras y medias y escudos."]},
  {o:"Artífice",c:"Artífice",l:1,lt:"Art 1",use:"Int · CD 13",n:"Lanzamiento de conjuros (artífice)",en:"Spellcasting",src:"Forge of the Artificer",d:["Aptitud: Inteligencia. Canalizador: herramientas de ladrón, de manitas o de artesano con competencia, en la mano (el conjuro gana componente M).","2 trucos de artífice; 2 conjuros preparados de nivel 1, cambiables tras un descanso largo.","Los espacios se comparten con el Explorador según la tabla de lanzador multiclase."]},
  {o:"Artífice",c:"Artífice",l:1,lt:"Art 1",use:"Int / desc. largo",n:"Magia de manitas",en:"Tinker's Magic",src:"Forge of the Artificer",d:["Conoces el truco Reparar.","Acción de magia con herramientas de manitas: creas un objeto de la lista (abrojos, bolas de metal, botella, vial, cuerda, red, aceite, antorcha y más) a 1,5 m. Dura hasta tu siguiente descanso largo.","Usos igual a tu modificador por Inteligencia (mínimo uno) por descanso largo."]},
  {o:"Mediano",c:"Personaje",l:1,lt:"Especie",use:"Al sacar un 1",n:"Fortuna",en:"Luck",src:"PHB 2024",d:["Si sacas un 1 en una prueba con d20, repites la tirada y usas el nuevo resultado."]},
  {o:"Mediano",c:"Personaje",l:1,lt:"Especie",use:"Pasivo",n:"Valiente",en:"Brave",src:"PHB 2024",d:["Ventaja en las tiradas de salvación para evitar o terminar el estado Asustado."]},
  {o:"Mediano",c:"Personaje",l:1,lt:"Especie",use:"Pasivo",n:"Agilidad de mediano",en:"Halfling Nimbleness",src:"PHB 2024",d:["Puedes moverte a través del espacio de cualquier criatura de tamaño superior al tuyo, sin detenerte ahí."]},
  {o:"Mediano",c:"Personaje",l:1,lt:"Especie",use:"Pasivo",n:"Sigiloso por naturaleza",en:"Naturally Stealthy",src:"PHB 2024",d:["Puedes esconderte incluso tras una criatura al menos una categoría de tamaño mayor que tú.","Pequeño, velocidad 9 m (30 ft)."]},
  {o:"Artesano",c:"Personaje",l:1,lt:"Origen",use:"Origen",n:"Trasfondo Artesano",en:"Artisan",src:"PHB 2024",d:["Habilidades: Investigación y Persuasión. Herramienta: herramientas de soplador de vidrio. Dote de origen: Fabricante."]},
  {o:"Artesano",c:"Personaje",l:1,lt:"Origen",use:"1 / desc. largo",n:"Fabricante",en:"Crafter",src:"PHB 2024 · dote de origen",d:["Competencia con tres herramientas de artesano: alfarero, carpintero y herrero.","20 % de descuento al comprar objetos no mágicos.","Fabricación rápida: tras un descanso largo, fabricas un objeto de la tabla si posees las herramientas de artesano asociadas y eres competente con ellas (alfarero: jarro, lámpara; carpintero: antorcha, escalera; herrero: abrojos, bolas de metal, cubo, garfio de escalada, olla de hierro). Dura hasta tu siguiente descanso largo."]},

 story:{
  title:"Crónica del Viento Eterno",
  portraitAlt:"Ilustración de Usoryn Bravoviento",
  sections:[
   {h:"",p:["El viento nunca deja de soplar, aunque a veces cambia de dirección. Usoryn creció en Brisasol, una aldea halfling en lo alto de los acantilados que vivía en armonía con el viento. Sus habitantes narraban historias tanto como navegaban, y en las noches claras los cuentos se elevaban con la brisa hasta perderse en el horizonte.","Una noche sin luna, una niebla espesa descendió sobre Brisasol y llegaron los barcos: embarcaciones fantasmales con velas de sombra y tripulaciones de ojos vacíos. Los Corsarios Fantasma arrasaron la aldea. Usoryn corrió advirtiendo a todos, pero su fama de cuentista hizo que nadie le creyera hasta que fue tarde. Capturaron a su madre Lyra y a los aldeanos. Él escapó rodando dentro de un barril hasta los acantilados, desde donde vio los barcos desvanecerse en la niebla.","Desde entonces vagó por ciudades y caminos, sobreviviendo como cuentacuentos y farsante, jurando recuperar a su familia y vengarse, aunque tuviera que engañar al destino para lograrlo. Con el amuleto de jade como única pista real, partió con una sonrisa desafiante y el viento a su espalda."]},
   {h:"El Amuleto de Jade",p:["Antes del ataque, su madre le entregó una piedra de jade con inscripciones en un idioma desconocido. Durante años creyó que era un simple recuerdo, hasta que un erudito lo reconoció como un Fragmento del Ojo de la Tormenta: parte de un mapa perdido que conduce a un santuario oculto en el Mar de Estrellas, donde descansa un artefacto capaz de controlar los vientos."]},
   {h:"Apariencia y carácter",p:["Halfling ágil y atlético, cabello castaño despeinado y ojos ámbar llenos de picardía. Cuero tachonado con remaches visibles, capa corta con capucha, cinturón repleto de bolsas y un broquel en la muñeca izquierda. Cuentacuentos, embaucador y escapista nato; vive de su ingenio."],quotes:["Yo fui el arquero que derribó al Dragón de Cristal.","Navegué por los cielos en un barco de relámpagos.","Derroté a un ogro con una sola flecha… ¡bueno, con una flecha y mucha suerte!"]},
   {h:"Motivaciones",p:["Recuperar a su madre Lyra, descubrir el destino de su padre Aeryn, encontrar el Ojo de la Tormenta y enfrentar a los Corsarios Fantasma."]},
   {h:"Conflicto interno",p:["¿Es el héroe que dice ser, o solo cuenta la historia hasta que alguien más salve el día?"]}
  ],
  people:[["Lyra Bravoviento","Madre, narradora y líder de Brisasol. Su voz podía hablar con el viento.","Capturada"],["Aeryn Bravoviento","Padre, navegante. Partió tras un secreto en el Mar de Estrellas y no regresó.","Desaparecido"],["Marden el Cazavientos","Anciano del consejo, guardián de las historias antiguas.","Posiblemente muerto"],["Thaleah Nieblaonda","Capitana de los Corsarios Fantasma. Fría y obsesionada con los secretos del viento.","Desconocido"]],
  mysteries:["¿Quién controla a los Corsarios Fantasma?","¿Existe realmente el Ojo de la Tormenta?","¿Qué aguarda en las ruinas de Brisasol?","¿Cuál es el verdadero propósito de Thaleah?","¿Está vivo Aeryn Bravoviento?","¿Cómo restaurar la bendición del viento?"],
  closing:"El viento nunca deja de soplar, aunque a veces cambia de dirección."
 },

kiyaj:{css:"\n/* Paleta de Ki'yaj: violeta astral, oro, rubí, plata */\n:root{--bg:#F6F5FA;--surface:#FFFFFF;--ink:#17141D;--ink-2:#4A4560;--ink-3:#6E6880;--line:#E3E1EC;--line-2:#CFCCDE;--violet:#6C4BA8;--violet-d:#523789;--violet-soft:#EEE9F8;--gold:#B8933B;--gold-d:#8F6F24;--gold-soft:#F5EEDA;--ruby:#B0304A;--ruby-soft:#F8E4E9;--hero-1:#241A3A;--hero-2:#3B2A62;--hero-ink:#F4F0FB;--hero-mute:#C9BFE0}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#121019;--surface:#1B1826;--ink:#ECE9F4;--ink-2:#BDB7CE;--ink-3:#958FA8;--line:#2C283A;--line-2:#3C374D;--violet:#A98BE0;--violet-d:#C2AAF0;--violet-soft:#2A2240;--gold:#D9B45E;--gold-d:#E6C77E;--gold-soft:#2E2614;--ruby:#E0687F;--ruby-soft:#3A1A22;--hero-1:#17112A;--hero-2:#2A1E48}}\n:root[data-theme=\"dark\"]{--bg:#121019;--surface:#1B1826;--ink:#ECE9F4;--ink-2:#BDB7CE;--ink-3:#958FA8;--line:#2C283A;--line-2:#3C374D;--violet:#A98BE0;--violet-d:#C2AAF0;--violet-soft:#2A2240;--gold:#D9B45E;--gold-d:#E6C77E;--gold-soft:#2E2614;--ruby:#E0687F;--ruby-soft:#3A1A22;--hero-1:#17112A;--hero-2:#2A1E48}\n",body:"<nav class=\"idx\" aria-label=\"Páginas de la hoja\">\n  <div class=\"in\">\n    <a href=\"#combate\"><b>1<\/b> Combate<\/a>\n    <a href=\"#equipo\"><b>2<\/b> Equipo<span class=\"wide\"> y conjuros<\/span><\/a>\n    <a href=\"#rasgos\"><b>3<\/b> Rasgos<span class=\"wide\"> e historia<\/span><\/a>\n    <a href=\"#arbol\"><b>4<\/b> Árbol<\/a>\n    <span class=\"sync\" id=\"sync\" role=\"status\">Conectando…<\/span>\n  <\/div>\n<\/nav>\n\n<header class=\"hero\">\n  <div class=\"in\">\n    <div class=\"herotop\"><div><div class=\"eyebrow\" id=\"cEyebrow\"><\/div>\n    <h1 id=\"cName\"><\/h1><\/div><img class=\"heroav\" id=\"heroAv\" alt=\"\" hidden><\/div>\n    <div class=\"idrow\" id=\"cId\"><\/div>\n    <div class=\"restbar\">\n      <button type=\"button\" id=\"bShort\">Descanso corto<\/button>\n      <button type=\"button\" id=\"bLong\">Descanso largo<\/button>\n      <button type=\"button\" id=\"bInsp\" aria-pressed=\"false\">Inspiración heroica<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main><div class=\"in\">\n\n<!-- ============ PÁGINA 1 ============ -->\n<div class=\"pgbreak\" id=\"combate\"><span>Página 1 · Combate<\/span><\/div>\n<div class=\"p1\">\n  <div class=\"a-stats stats\">\n    <div class=\"sbox ac\"><b class=\"num\" id=\"sAC\">–<\/b><span class=\"lbl\">Clase de armadura<\/span><small id=\"sACn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sInit\">–<\/b><span class=\"lbl\">Iniciativa<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sSpd\">–<\/b><span class=\"lbl\">Velocidad<\/span><small id=\"sSpdn\"><\/small><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sProf\">–<\/b><span class=\"lbl\">Competencia<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sPP\">–<\/b><span class=\"lbl\">Percepción pasiva<\/span><\/div>\n    <div class=\"sbox\"><b class=\"num\" id=\"sDC\">–<\/b><span class=\"lbl\">CD de conjuros<\/span><small id=\"sDCn\"><\/small><\/div>\n  <\/div>\n\n  <section class=\"a-hp box\" aria-labelledby=\"hHP\">\n    <h2 id=\"hHP\">Puntos de golpe <span class=\"lbl\" id=\"hpMaxL\"><\/span><\/h2>\n    <div class=\"hp\">\n      <div class=\"hpnum num\"><span id=\"hpCur\">–<\/span><small id=\"hpMaxS\"><\/small><\/div>\n      <div class=\"mute\">Temporales: <span class=\"temp\" id=\"hpTemp\">0<\/span><br><span id=\"hpState\">Cargando estado…<\/span><\/div>\n      <div class=\"bar\"><i id=\"hpBar\" style=\"width:0\"><\/i><\/div>\n    <\/div>\n    <div class=\"hpctl\">\n      <input id=\"hpAmt\" type=\"number\" inputmode=\"numeric\" min=\"1\" value=\"5\" aria-label=\"Cantidad\">\n      <button class=\"btn dmg\" type=\"button\" data-hp=\"dmg\">Daño<\/button>\n      <button class=\"btn heal\" type=\"button\" data-hp=\"heal\">Curar<\/button>\n      <button class=\"btn tmp\" type=\"button\" data-hp=\"temp\">Temporales<\/button>\n    <\/div>\n    <div class=\"concq\" id=\"concQ\" hidden><\/div>\n    <div class=\"death\" id=\"deathBox\"><\/div>\n    <p class=\"note\">El daño consume primero los temporales. Los temporales no se suman: la hoja deja el mayor. Duran hasta gastarse o hasta un descanso largo.<\/p>\n  <\/section>\n\n  <section class=\"a-atk box\" aria-labelledby=\"hAtk\">\n    <h2 id=\"hAtk\">Ataques<\/h2>\n    <div id=\"atkBox\" class=\"empty\">Cargando armas equipadas…<\/div>\n    <div class=\"group\">Daño adicional<\/div>\n    <div id=\"xdmgBox\"><\/div>\n    <p class=\"note\" id=\"mastNote\"><\/p>\n  <\/section>\n\n  <section class=\"a-abil box\" aria-labelledby=\"hAb\">\n    <h2 id=\"hAb\">Atributos<\/h2>\n    <div id=\"abMods\" class=\"acrow\"><\/div>\n    <div class=\"abil\" id=\"abil\"><\/div>\n    <p class=\"note\">● competencia · ◆ pericia. <span id=\"saveNote\"><\/span> <span id=\"stealthNote\"><\/span><\/p>\n  <\/section>\n\n  <section class=\"a-res box\" aria-labelledby=\"hRes\">\n    <h2 id=\"hRes\">Recursos <span class=\"lbl\">relleno = disponible<\/span><\/h2>\n    <div class=\"res\" id=\"resBox\"><\/div>\n  <\/section>\n\n  <section class=\"a-fx box\" aria-labelledby=\"hFx\">\n    <h2 id=\"hFx\">Efectos y estados <span class=\"lbl\" id=\"fxCount\"><\/span><\/h2>\n    <div class=\"conc\" id=\"concBanner\" hidden><\/div>\n    <div id=\"fxBox\"><div class=\"empty\">Cargando efectos…<\/div><\/div>\n    <div class=\"conds\" id=\"condBox\"><\/div>\n    <div class=\"track\" style=\"border:0;padding:0\"><div class=\"t\"><b>Cansancio<\/b><span>−2 × nivel a pruebas con d20 · −5 ft por nivel · −1 por descanso largo<\/span><\/div>\n      <div class=\"stepper\"><button type=\"button\" data-exh=\"-1\" aria-label=\"Bajar cansancio\">−<\/button><output id=\"oExh\" class=\"num\">0<\/output><button type=\"button\" data-exh=\"1\" aria-label=\"Subir cansancio\">+<\/button><\/div><\/div>\n    <div id=\"condDetail\" class=\"conddet\"><\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ PÁGINA 2 ============ -->\n<div class=\"pgbreak\" id=\"equipo\"><span>Página 2 · Equipo y conjuros<\/span><\/div>\n<div class=\"p2\">\n  <section class=\"box\" aria-labelledby=\"hEq\">\n    <h2 id=\"hEq\">Equipado <span class=\"lbl\" id=\"attNote\">sintonización –/3<\/span><\/h2>\n    <div class=\"acrow\" id=\"acBreak\"><\/div>\n    <div class=\"slots\" id=\"itemsBox\"><div class=\"empty\">Cargando equipo…<\/div><\/div>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hInv\">\n    <h2 id=\"hInv\">Inventario <span class=\"lbl\" id=\"invCount\"><\/span><\/h2>\n    <div class=\"conts\" id=\"invBox\"><div class=\"empty\">Cargando inventario…<\/div><\/div>\n    <details class=\"addf\">\n      <summary>+ Agregar objeto<\/summary>\n      <form class=\"f\" id=\"gearForm\" autocomplete=\"off\">\n        <input id=\"gearName\" placeholder=\"Objeto (cuerda, raciones…)\" aria-label=\"Nombre del objeto\" required>\n        <input id=\"gearQty\" type=\"number\" min=\"1\" value=\"1\" aria-label=\"Cantidad\">\n        <select id=\"gearCat\" aria-label=\"Categoría\"><option value=\"equipo\">Equipo<\/option><option value=\"consumible\">Consumible<\/option><option value=\"municion\">Munición<\/option><option value=\"herramienta\">Herramienta<\/option><option value=\"valor\">Objeto de valor<\/option><\/select>\n        <input id=\"gearLoc\" list=\"locList\" placeholder=\"Dónde (mochila…)\" aria-label=\"Contenedor\">\n        <datalist id=\"locList\"><\/datalist>\n        <input id=\"gearNote\" placeholder=\"Nota (opcional)\" aria-label=\"Nota\">\n        <button class=\"btn\" type=\"submit\">Agregar<\/button>\n      <\/form>\n      <p class=\"note\">Armas, armaduras y objetos mágicos con efecto en los números se agregan conmigo en el chat. Un contenedor nuevo se crea escribiéndolo en \"Dónde\".<\/p>\n    <\/details>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hGold\">\n    <h2 id=\"hGold\">Monedas <span class=\"lbl\">libro de movimientos<\/span><\/h2>\n    <div class=\"goldtop\"><div class=\"hpnum num\" id=\"gBal\">–<\/div><span class=\"mute\">po · saldo calculado<\/span><\/div>\n    <form class=\"f\" id=\"goldForm\" autocomplete=\"off\">\n      <input id=\"gAmt\" type=\"number\" inputmode=\"decimal\" min=\"0.01\" step=\"0.01\" placeholder=\"po\" aria-label=\"Monto en po\" required style=\"width:90px\">\n      <input id=\"gConcept\" placeholder=\"Concepto (botín, compra…)\" aria-label=\"Concepto\" required style=\"flex:1 1 160px\">\n      <button class=\"btn heal\" type=\"submit\" data-dir=\"1\">Ingreso<\/button>\n      <button class=\"btn dmg\" type=\"submit\" data-dir=\"-1\">Gasto<\/button>\n    <\/form>\n    <p class=\"note\">Conversión a po: pc 0,01 · pp 0,1 · pe 0,5 · ppt 10. Para corregir, se anula y queda visible.<\/p>\n    <div id=\"gList\" class=\"ledger\"><div class=\"empty\">Cargando movimientos…<\/div><\/div>\n    <button type=\"button\" class=\"btn ghost\" id=\"gMore\" hidden>Ver todos<\/button>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hSp\">\n    <h2 id=\"hSp\">Conjuros <span class=\"lbl\" id=\"spL\"><\/span><\/h2>\n    <div class=\"spslots\" id=\"spSlots\"><\/div>\n    <p class=\"note\">Toca un conjuro para ver el detalle y lanzarlo. Si es a ti y tiene efecto en tus números, la hoja lo aplica. Uno de concentración reemplaza al anterior.<\/p>\n    <div id=\"spBox\" class=\"spells\"><\/div>\n  <\/section>\n\n  <section class=\"box\" aria-labelledby=\"hGrim\" id=\"grimsec\">\n    <h2 id=\"hGrim\">Grimorio del paladín <span class=\"lbl\" id=\"grimCount\"><\/span><\/h2>\n    <p class=\"note\" id=\"grimRule\"><\/p>\n    <div class=\"gfilters\" id=\"grimFilters\">\n      <input type=\"search\" id=\"grimQ\" placeholder=\"Buscar conjuro…\" aria-label=\"Buscar conjuro\">\n      <div class=\"gchips\">\n        <button type=\"button\" class=\"fchip\" data-gf=\"all\" aria-pressed=\"true\">Todos<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"prep\">Preparados<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l0\">Trucos<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l1\">Nivel 1<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"l2\">Nivel 2<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"conc\">Concentración<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"ritual\">Ritual<\/button>\n        <button type=\"button\" class=\"fchip\" data-gf=\"noconc\">Sin concentración<\/button>\n      <\/div>\n    <\/div>\n    <div id=\"grimSwap\" class=\"gswap\"><\/div>\n    <div id=\"grimBox\" class=\"grim\"><\/div>\n  <\/section>\n<\/div>\n\n<!-- ============ PÁGINA 3 ============ -->\n<div class=\"pgbreak\" id=\"rasgos\"><span>Página 3 · Rasgos e historia<\/span><\/div>\n<div class=\"p3\">\n  <section class=\"box lusec\" aria-labelledby=\"hLu\">\n    <h2 id=\"hLu\">Subir de nivel <span class=\"lbl\">planificador<\/span><\/h2>\n    <div id=\"luBox\"><div class=\"empty\">Cargando…<\/div><\/div>\n  <\/section>\n  <section class=\"box featsec\" aria-labelledby=\"hFeat\">\n    <h2 id=\"hFeat\">Rasgos <span class=\"lbl\" id=\"featLvl\"><\/span><\/h2>\n    <div id=\"featBox\" class=\"feats\"><\/div>\n  <\/section>\n  <section class=\"box profsec\" aria-labelledby=\"hProf\">\n    <h2 id=\"hProf\">Competencias <span class=\"lbl\">◆ = pericia<\/span><\/h2>\n    <div class=\"pfs\" id=\"profBox\"><\/div>\n  <\/section>\n  <section class=\"box recipes\" aria-labelledby=\"hRec\">\n    <h2 id=\"hRec\">Recetario del artesano <span class=\"lbl\">PHB cap. 6 · validado GM<\/span><\/h2>\n    <div id=\"recBox\"><\/div>\n  <\/section>\n  <section class=\"box story\" aria-labelledby=\"hStory\">\n    <h2 id=\"hStory\">Crónica<\/h2>\n    <div class=\"storygrid\">\n      <figure class=\"portrait\" id=\"portrait\">\n        <div class=\"ph\" id=\"portraitPh\"><span class=\"lbl\">Ilustración<\/span><span class=\"mute\" id=\"portraitMsg\">Cargando…<\/span><\/div>\n        <img id=\"portraitImg\" alt=\"\" hidden>\n        <div class=\"pacts\" id=\"portraitActs\" hidden>\n          <label class=\"btn\" for=\"portraitFile\" id=\"portraitBtn\">Subir ilustración<\/label>\n          <input type=\"file\" id=\"portraitFile\" accept=\"image/png,image/jpeg,image/webp,image/gif\" hidden>\n        <\/div>\n      <\/figure>\n      <div class=\"prose\" id=\"storyBox\"><\/div>\n    <\/div>\n  <\/section>\n  <div id=\"refBox\" class=\"refs\"><\/div>\n<\/div>\n\n<!-- ============ PÁGINA 4 ============ -->\n<div class=\"pgbreak\" id=\"arbol\"><span>Página 4 · Árbol de progresión<\/span><\/div>\n<section class=\"box treesec\" aria-labelledby=\"hTree\">\n  <h2 id=\"hTree\">Árbol de progresión <span class=\"lbl\" id=\"treeLvl\"><\/span><\/h2>\n  <div class=\"tlegend\"><span><i class=\"dot own\"><\/i>Lo tienes<\/span><span><i class=\"dot nxt\"><\/i>Próxima subida<\/span><span><i class=\"dot fut\"><\/i>Futuro<\/span><span><i class=\"dot out\"><\/i>Fuera de alcance (nivel 20)<\/span><\/div>\n  <div class=\"treewrap\">\n    <div class=\"tree\" id=\"treeBox\"><\/div>\n    <aside class=\"tdet\" id=\"treeDet\" aria-live=\"polite\"><\/aside>\n  <\/div>\n  <p class=\"note\" id=\"treeNote\"><\/p>\n<\/section>\n\n<footer id=\"cFooter\"><\/footer>\n<\/div><\/main>\n",cfg:function(){

 feats:[
  {o:"Paladín",c:"Paladín",l:1,lt:"Pal 1",use:"Acción adicional",n:"Imponer las manos",en:"Lay on Hands",src:"PHB 2024",d:["Reserva de curación de 5 × tu nivel de paladín (20 a nivel 4); se recarga con un descanso largo.","Como acción adicional, tocas a una criatura (puedes ser tú) y le devuelves los PG que quieras de la reserva.","Puedes gastar 5 puntos de la reserva para quitarle el estado Envenenado; esos puntos no curan."]},
  {o:"Paladín",c:"Paladín",l:1,lt:"Pal 1",use:"Car · CD 14",n:"Lanzamiento de conjuros",en:"Spellcasting",src:"PHB 2024",d:["Aptitud mágica: Carisma (CD 14, ataque +6). Canalizador: símbolo sagrado.","A Paladín 4: 5 conjuros preparados de nivel 1 y 3 espacios de nivel 1; los espacios vuelven con un descanso largo.","Los conjuros que otro rasgo te da siempre preparados no cuentan en ese total. Tras un descanso largo puedes cambiar 1 conjuro preparado por otro de paladín."]},
  {o:"Paladín",c:"Paladín",l:1,lt:"Pal 1",use:"Pasivo",n:"Maestría con armas",en:"Weapon Mastery",src:"PHB 2024",d:["Usas las propiedades de maestría de 2 tipos de armas con las que tengas competencia.","Tras un descanso largo puedes cambiar los tipos elegidos. Hoy: espada larga (Debilitar) y jabalina (Ralentizar)."]},
  {o:"Paladín",c:"Paladín",l:2,lt:"Pal 2",use:"1 gratis / desc. largo",n:"Castigo de paladín",en:"Paladin's Smite",src:"PHB 2024",d:["Siempre tienes Castigo divino preparado, sin contar en tus 5.","Puedes lanzarlo una vez sin gastar espacio de conjuro; se recupera tras un descanso largo."]},
  {o:"Paladín",c:"Paladín",l:2,lt:"Pal 2",use:"Pasivo",n:"Estilo de combate: Defensa",en:"Fighting Style: Defense",src:"PHB 2024 · dote",d:["+1 a la CA mientras lleves armadura. La hoja lo suma cuando tienes armadura equipada."]},
  {o:"Paladín",c:"Paladín",l:3,lt:"Pal 3",use:"2 usos",n:"Canalizar divinidad",en:"Channel Divinity",src:"PHB 2024",d:["2 usos. Recuperas 1 tras un descanso corto y todos tras un descanso largo (3 usos a nivel 11).","Si un efecto pide salvación, la CD es la de tus conjuros (14).","Sentidos divinos (acción adicional): durante 10 minutos, o hasta quedar Incapacitado, conoces la ubicación y el tipo de celestiales, infernales y muertos vivientes a 18 m (60 ft), y detectas lugares u objetos consagrados o profanados."]},
  {o:"Paladín",c:"Paladín",l:4,lt:"Pal 4",use:"Pasivo",n:"Mejora de característica",en:"Ability Score Improvement",src:"PHB 2024",d:["Elegiste +2 Carisma (16 → 18): CD de conjuros y de Canalizar divinidad pasa de 13 a 14. Se repite en los niveles 8, 12 y 16."]},
  {o:"Conquista",c:"Paladín",l:3,lt:"Pal 3",use:"Pasivo",n:"Conjuros de juramento",en:"Oath Spells",src:"Xanathar · adaptado a 2024 · GM",d:["Siempre preparados, sin ocupar cupo: Armadura de Agathys y Orden imperiosa (nivel 3). A nivel 5: Inmovilizar persona y Reflejo espiritual."]},
  {o:"Conquista",c:"Paladín",l:3,lt:"Pal 3",use:"Canalizar divinidad",n:"Presencia conquistadora",en:"Conquering Presence",src:"Xanathar · adaptado a 2024 · GM",d:["Opción de Canalizar divinidad. Acción de magia: cada criatura que elijas y veas a 9 m (30 ft) hace salvación de Sabiduría (CD 14) o queda Asustada 1 minuto; repite la salvación al final de sus turnos."]},
  {o:"Conquista",c:"Paladín",l:3,lt:"Pal 3",use:"Canalizar divinidad",n:"Golpe guiado",en:"Guided Strike",src:"Xanathar · adaptado a 2024 · GM",d:["Opción de Canalizar divinidad. Al hacer una tirada de ataque, tras ver el dado y antes de saber si acierta, sumas +10."]},
  {o:"Githyanki",c:"Personaje",l:1,lt:"Especie",use:"Pasivo",n:"Resiliencia psíquica",en:"Psychic Resilience",src:"MotM p. 18 (verificado en D&D Beyond) · GM",d:["Resistencia al daño psíquico: sufres la mitad."]},
  {o:"Githyanki",c:"Personaje",l:1,lt:"Especie",use:"Car · sin componentes",n:"Psiónica githyanki",en:"Githyanki Psionics",src:"MotM p. 18 (verificado en D&D Beyond) · GM",d:["Conoces Mano de mago (la mano es invisible) y lo lanzas a voluntad.","Desde nivel 3 puedes lanzar Salto (Jump) con este rasgo; desde nivel 5, también Paso brumoso (Misty Step). Cada uno 1 vez por descanso largo sin espacio; también con tus espacios de conjuro.","Carisma es la aptitud mágica de estos conjuros (elegida entre Int, Sab o Car) y no necesitan componentes."]},
  {o:"Githyanki",c:"Personaje",l:1,lt:"Especie",use:"Desc. largo",n:"Conocimiento astral",en:"Astral Knowledge",src:"MotM p. 18 (verificado en D&D Beyond) · GM",d:["Al terminar un descanso largo eliges una habilidad y un arma o herramienta: tienes competencia con ellas hasta tu próximo descanso largo.","Se eligen en Recursos (Conocimiento astral); la habilidad se marca ◐ en Atributos."]},
  {o:"Githyanki",c:"Personaje",l:1,lt:"Especie",use:"Pasivo",n:"Tipo y movimiento",en:"Creature Type",src:"MotM p. 18 (verificado en D&D Beyond) · GM",d:["Humanoide Mediano. Velocidad 9 m (30 ft)."]},
  {o:"Soldado",c:"Personaje",l:1,lt:"Trasfondo",use:"1×/turno",n:"Atacante salvaje",en:"Savage Attacker",src:"PHB 2024 · dote de origen",d:["Una vez por turno, al acertar con un arma, tiras dos veces los dados de daño del arma y usas el resultado que prefieras.","Regla de mesa: solo relanza el dado del arma, no los de Castigo."]},
  {o:"Soldado",c:"Personaje",l:1,lt:"Trasfondo",use:"Pasivo",n:"Trasfondo Soldado",en:"Soldier",src:"PHB 2024",d:["Habilidades: Atletismo e Intimidación. Herramienta: juego de dados. Equipo: opción B (50 po)."]}

 story:{
  title:"Crónica de la Voluntad Inquebrantable",
  portraitAlt:"Ilustración de Ki'yaj",
  sections:[
   {h:"",p:["Criado entre los githyanki como se forja una espada, Ki'yaj aprendió que la compasión era una grieta y la duda una enfermedad. No se le enseñó a preguntar por qué luchar: se le enseñó a vencer.","En una misión al Plano Material para recuperar una reliquia de mando, sus comandantes exigieron una demostración de miedo contra civiles. Ki'yaj obedeció al principio, hasta que vio que aquello era desperdicio y brutalidad sin propósito. Ese día formuló su primer pensamiento propio: un verdadero conquistador no destruye, toma control.","Desde entonces sigue una ley más antigua que cualquier comandante: la voluntad fuerte debe gobernar a la violencia. Viaja para demostrar que su voluntad supera la doctrina que lo formó, buscando tiranos, cultos y aberraciones que merezcan ser quebrados, con un odio especial por los illithids."]},
   {h:"Apariencia y carácter",p:["Githyanki de porte marcial, armadura de placas marcada por batallas astrales y escudo de acero de campaña. Habla poco y ordena mucho; mide a cada persona por la firmeza de su voluntad."],quotes:["El caos se arrodilla. El miedo obedece. Mi voluntad permanece."]}
  ],
  mysteries:["¿Qué fue de la reliquia de mando?","¿Lo consideran un desertor entre los githyanki?","¿Qué forma tomará su ley propia?","¿Puede alguien criado para someter volverse un líder digno de ser seguido?"],
  closing:"El caos se arrodilla. El miedo obedece. Mi voluntad permanece."
 },

  {"id": "dmagic", "lvl": 1, "n": "Detectar magia", "en": "Detect Magic", "tag": "ritual · 9 m", "src": ["ritual"], "tg": ["self"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 1 · Adivinación · Acción o ritual · Lanzador · V, S · concentración hasta 10 min", "d": "Mientras dure, percibes la presencia de efectos mágicos a 9 m (30 ft) o menos. Si percibes alguno, puedes usar una acción de magia para ver un aura débil alrededor de cualquier objeto o criatura visible afectada y, si proviene de un conjuro, su escuela. No atraviesa 30 cm (1 ft) de piedra, tierra o madera, 2,5 cm (1 in) de metal ni una lámina fina de plomo."},

  {"id": "dfavor", "lvl": 1, "n": "Favor divino", "en": "Divine Favor", "tag": "+1d4 radiante", "src": [], "tg": ["self"], "dur": "1 min", "meta": "Nivel 1 · Transmutación · Acción adicional · Lanzador · V, S · 1 min", "d": "Mientras dure, tus ataques con armas infligen 1d4 de daño radiante adicional al acertar. Sin concentración."},
  {"id": "heroism", "lvl": 1, "n": "Heroísmo", "en": "Heroism", "tag": "inmune Asustado, 4 PGT", "src": [], "tg": ["self", "other"], "conc": 1, "dur": "hasta 1 min", "meta": "Nivel 1 · Encantamiento · Acción · Toque · V, S · concentración hasta 1 min", "d": "Una criatura voluntaria que toques es inmune al estado Asustado (Frightened) y gana 4 PG temporales (tu modificador de Carisma) al principio de cada uno de sus turnos mientras dure.", "up": "+1 criatura objetivo por cada nivel por encima de 1."},
  {"id": "command", "lvl": 1, "n": "Orden imperiosa", "en": "Command", "tag": "salv Sab CD 14", "src": [], "tg": ["other"], "meta": "Nivel 1 · Encantamiento · Acción · 18 m (60 ft) · V · instantáneo", "d": "Das una orden de una palabra a una criatura que veas a 18 m (60 ft) o menos; debe superar una salvación de Sabiduría (CD 14) u obedecer en su próximo turno. Órdenes: Acércate (viene hacia ti por la ruta más corta y acaba su turno si queda a 1,5 m/5 ft), Detente (no se mueve ni usa acciones), Huye (se aleja lo más rápido posible), Póstrate (queda Derribado y acaba su turno), Suelta (suelta lo que sujeta y acaba su turno).", "up": "+1 criatura afectada por cada nivel por encima de 1."},
  {"id": "pfge", "lvl": 1, "n": "Protección contra el bien y el mal", "en": "Protection from Evil and Good", "tag": "protección vs 6 tipos", "src": [], "tg": ["self", "other"], "conc": 1, "dur": "hasta 10 min", "meta": "Nivel 1 · Abjuración · Acción · Toque · V, S, M (un frasco de agua bendita que valga al menos 25 po, que se consume) · concentración hasta 10 min", "d": "Una criatura voluntaria que toques queda protegida contra aberraciones, celestiales, elementales, feéricos, infernales y muertos vivientes: esas criaturas tienen desventaja en ataques contra ella, no pueden poseerla ni dejarla Asustada (Frightened) o Hechizada (Charmed). Si ya está asustada, hechizada o poseída por una de ellas, tiene ventaja en las nuevas salvaciones contra ese efecto."},
  {"id": "purify", "lvl": 1, "n": "Purificar comida y bebida", "en": "Purify Food and Drink", "tag": "ritual · utilidad", "src": ["ritual"], "tg": ["other"], "meta": "Nivel 1 · Transmutación · Acción o ritual · 3 m (10 ft) · V, S · instantáneo", "d": "Eliminas el veneno y la podredumbre de toda la comida y bebida no mágicas en una esfera de 1,5 m (5 ft) de radio centrada en un punto a 3 m (10 ft) o menos."},
  {"id": "agathys", "lvl": 1, "n": "Armadura de Agathys", "en": "Armor of Agathys", "tag": "5 PG temp · 5 frío", "src": [], "tg": ["self"], "dur": "1 h", "meta": "Nivel 1 · Abjuración · Acción · Lanzador · V, S, M (una taza de agua) · 1 h", "d": "Ganas 5 PG temporales. Mientras te quede al menos 1 de ellos, cualquier criatura que te acierte con un ataque cuerpo a cuerpo sufre 5 de daño de frío.", "selfTemp": 5, "up": "+5 PG temporales y +5 de frío por nivel.", "note": "Conjuro de juramento de la Conquista (Xanathar's Guide, adaptado a 2024, validado por el GM). No está en la lista de paladín del PHB 2024; ficha del PHB 2024 pendiente de verificar en Notion."},
  {"id": "magehand", "lvl": 0, "n": "Mano de mago", "en": "Mage Hand", "tag": "a voluntad", "fixed": "Psiónica githyanki · Carisma · sin componentes", "lock": "Truco a voluntad: no gasta nada. La mano es invisible.", "src": [], "tg": [], "meta": "Truco · Conjuración · Acción · 9 m (30 ft) · 1 min", "d": "Una mano espectral invisible manipula objetos, abre puertas, guarda o saca cosas de un recipiente, hasta 5 kg (10 lb). Se mueve 9 m con una acción de magia."},
  {"id": "jump", "lvl": 1, "n": "Salto", "en": "Jump", "tag": "salto 9 m", "fixed": "Psiónica githyanki · Carisma · sin componentes", "src": ["jumpTrait"], "tg": ["self", "other"], "dur": "1 min", "meta": "Nivel 1 · Transmutación · Acción adicional · Toque · V, S, M (sin componentes si lo lanzas con Psiónica) · 1 min", "d": "Una criatura que toques salta 9 m (30 ft) en horizontal o 3 m (10 ft) en vertical gastando movimiento normal, una vez por turno.", "note": "Una vez gratis por descanso largo con Psiónica githyanki; también con un espacio de conjuro."},
  {"id": "sense", "lvl": 0, "n": "Sentidos divinos", "en": "Divine Sense", "tag": "detección 18 m", "fixed": "Canalizar divinidad · CD 14", "noSlot": true, "src": ["cd"], "tg": ["self"], "dur": "10 min o hasta quedar incapacitado", "meta": "Canalizar divinidad · Acción adicional · 18 m (60 ft) · 10 min", "d": "Durante 10 minutos, o hasta que quedes Incapacitado, conoces la ubicación y el tipo de cualquier celestial, infernal o muerto viviente a 18 m (60 ft), y detectas lugares u objetos consagrados o profanados."},
  {"id": "presence", "lvl": 0, "n": "Presencia conquistadora", "en": "Conquering Presence", "tag": "miedo en área", "fixed": "Canalizar divinidad · CD 14", "noSlot": true, "src": ["cd"], "tg": ["other"], "dur": "1 min", "meta": "Canalizar divinidad · Acción de magia · 9 m (30 ft) · 1 min", "d": "Cada criatura que elijas y puedas ver a 9 m (30 ft) hace una salvación de Sabiduría CD 14 o queda Asustada durante 1 minuto; repite la salvación al final de cada uno de sus turnos.", "note": "Juramento de la Conquista (Xanathar's Guide, adaptado a 2024, validado por el GM)."},
  {"id": "guided", "lvl": 0, "n": "Golpe guiado", "en": "Guided Strike", "tag": "+10 al ataque", "fixed": "Canalizar divinidad · CD 14", "noSlot": true, "src": ["cd"], "tg": ["self"], "meta": "Canalizar divinidad · al hacer una tirada de ataque, tras ver el dado", "d": "Sumas +10 a una tirada de ataque antes de saber si acierta.", "inst": "+10 a esta tirada de ataque.", "note": "Juramento de la Conquista (Xanathar's Guide, adaptado a 2024, validado por el GM)."}
 ]
};

window.CHAR.tree={"maxTotal": 20, "note": "Fuente: PHB 2024, capítulo 3 (Paladín) en Notion. El Juramento de la Conquista viene de Xanathar's Guide to Everything, adaptado a 2024 y validado por el GM: solo están cargados sus rasgos de nivel 3; los de 7, 15 y 20 quedan pendientes hasta transcribir ese libro.", "cols": [{"cls": "Paladín", "tone": "sand", "max": 20, "sub": {"at": 3, "label": "Juramento sagrado", "chosen": "conquista", "opts": [{"id": "devocion", "n": "Juramento de entrega", "en": "Oath of Devotion", "tag": "Defiende los ideales de la justicia y el orden.", "lv": {"3": [["Conjuros de juramento", "Siempre preparados: nv 3 Escudo de fe, Protección contra el bien y el mal · nv 5 Auxilio, Zona de la verdad · nv 9 Disipar magia, Señal de esperanza · nv 13 Guardián de la fe, Libertad de movimiento · nv 17 Comunión, Golpe flamígero."], ["Arma sagrada", "Al atacar, gasta un uso de Canalizar divinidad: durante 10 minutos sumas tu mod. de Carisma (mín. +1) a los ataques con un arma cuerpo a cuerpo y puedes hacer que inflija daño radiante. El arma emite luz brillante 6 m (20 ft) y tenue 6 m más."]], "7": [["Aura de entrega", "Tú y tus aliados dentro de tu Aura de protección tenéis inmunidad al estado Hechizado."]], "15": [["Castigo protector", "Siempre que lances Castigo divino, tú y tus aliados dentro del Aura de protección tenéis cobertura media hasta el inicio de tu siguiente turno."]], "20": [["Halo sagrado", "Acción adicional, 10 minutos, 1/descanso largo (o gasta un espacio de nv 5): enemigos que inicien su turno en el aura reciben daño radiante = mod. CAR + bonif. competencia; el aura emite luz solar brillante; ventaja en salvaciones forzadas por infernales o muertos vivientes."]]}}, {"id": "gloria", "n": "Juramento de gloria", "en": "Oath of Glory", "tag": "Esfuérzate por alcanzar la cima del heroísmo.", "lv": {"3": [["Conjuros de juramento", "Siempre preparados: nv 3 Heroísmo, Saeta guía · nv 5 Arma mágica, Potenciar característica · nv 9 Acelerar, Protección contra energía · nv 13 Compulsión, Libertad de movimiento · nv 17 Conocer las leyendas, Presencia regia de Yolande."], ["Atleta sin parangón", "Acción adicional, gasta un uso de Canalizar divinidad: durante 1 hora ventaja en Fuerza (Atletismo) y Destreza (Acrobacias) y tus saltos de longitud y altura aumentan 3 m (10 ft)."], ["Castigo inspirador", "Justo tras lanzar Castigo divino, gasta un uso de Canalizar divinidad: reparte 2d8 + tu nivel de paladín en puntos de golpe temporales entre criaturas a 9 m (30 ft) o menos (puedes incluirte)."]], "7": [["Aura de celeridad", "Tu velocidad aumenta 3 m (10 ft). Un aliado que entre en tu Aura de protección por primera vez en un turno o empiece su turno dentro gana +3 m de velocidad hasta el final de su próximo turno."]], "15": [["Defensa gloriosa", "Reacción cuando un ataque acierta a ti o a una criatura visible a 3 m (10 ft) o menos: suma tu mod. CAR (mín. +1) a su CA; si el ataque falla, haces un ataque con arma contra el atacante si está en alcance. Usos = mod. CAR (mín. 1) por descanso largo."]], "20": [["Leyenda viviente", "Acción adicional, 10 minutos, 1/descanso largo (o gasta un espacio de nv 5): ventaja en todas las pruebas de Carisma; una vez por turno conviertes un ataque con arma fallido en acierto; reacción para repetir una salvación fallida."]]}}, {"id": "antiguos", "n": "Juramento de los antiguos", "en": "Oath of the Ancients", "tag": "Preserva la vida y la luz en el mundo.", "lv": {"3": [["Conjuros de juramento", "Siempre preparados: nv 3 Golpe apresador, Hablar con los animales · nv 5 Paso brumoso, Rayo de luna · nv 9 Crecimiento vegetal, Protección contra energía · nv 13 Piel pétrea, Tormenta de hielo · nv 17 Comunión con la naturaleza, Paso arbóreo."], ["Ira de la naturaleza", "Acción de magia, gasta un uso de Canalizar divinidad: criaturas de tu elección visibles a 4,5 m (15 ft) o menos hacen salvación de Fuerza o quedan Apresadas 1 minuto; repiten la salvación al final de cada uno de sus turnos."]], "7": [["Aura de salvaguarda", "Tú y tus aliados dentro de tu Aura de protección tenéis resistencia al daño necrótico, psíquico y radiante."]], "15": [["Centinela imperecedero", "Cuando tus PG bajan a 0 sin morir al instante, puedes quedarte con 1 PG y recuperar 3 × tu nivel de paladín; 1/descanso largo. Además no envejeces por medios mágicos ni de forma visible."]], "20": [["Campeón ancestral", "Acción adicional, 1 minuto, 1/descanso largo (o gasta un espacio de nv 5): los conjuros de 1 acción se lanzan como acción adicional; enemigos en el aura tienen desventaja en salvaciones contra tus conjuros y Canalizar divinidad; recuperas 10 PG al inicio de cada turno."]]}}, {"id": "venganza", "n": "Juramento de venganza", "en": "Oath of Vengeance", "tag": "Castiga a los malhechores a toda costa.", "lv": {"3": [["Conjuros de juramento", "Siempre preparados: nv 3 Marca del cazador, Perdición · nv 5 Inmovilizar persona, Paso brumoso · nv 9 Acelerar, Protección contra energía · nv 13 Destierro, Puerta dimensional · nv 17 Escudriñar, Inmovilizar monstruo."], ["Voto de enemistad", "Al atacar, gasta un uso de Canalizar divinidad contra una criatura visible a 9 m (30 ft) o menos: ventaja en tus tiradas de ataque contra ella durante 1 minuto o hasta que vuelvas a usar el rasgo. Si cae a 0 PG antes, puedes transferir el voto a otra criatura a 9 m o menos (sin acción)."]], "7": [["Vengador implacable", "Cuando aciertas un ataque de oportunidad, puedes reducir la velocidad del objetivo a 0 hasta el final del turno actual y moverte hasta la mitad de tu velocidad como parte de la misma reacción, sin provocar ataques de oportunidad."]], "15": [["Espíritu vengativo", "Justo después de que la criatura bajo tu Voto de enemistad acierte o falle una tirada de ataque, puedes usar tu reacción para hacer un ataque cuerpo a cuerpo contra ella si está en alcance."]], "20": [["Ángel vengador", "Acción adicional, 10 minutos, 1/descanso largo (o gasta un espacio de nv 5): enemigos que inicien su turno en tu Aura de protección hacen salvación de Sabiduría o quedan Asustados 1 minuto o hasta recibir daño (ataques contra ellos con ventaja); te crecen alas espectrales con velocidad volando de 18 m (60 ft) y puedes levitar."]]}}, {"id": "conquista", "n": "Juramento de la Conquista", "en": "Oath of Conquest", "tag": "Somete por el miedo y la voluntad. Xanathar's Guide, adaptado a 2024 y validado por el GM.", "lv": {"3": [["Conjuros de juramento", "Siempre preparados: nv 3 Armadura de Agathys, Orden imperiosa · nv 5 Inmovilizar persona, Reflejo espiritual · nv 9, 13 y 17: ⏳ pendiente de traer el libro."], ["Presencia conquistadora", "Canalizar divinidad, acción de magia: cada criatura que elijas y veas a 9 m (30 ft) hace salvación de Sabiduría CD 14 o queda Asustada 1 minuto; repite al final de sus turnos."], ["Golpe guiado", "Canalizar divinidad: +10 a una tirada de ataque tras ver el dado y antes de saber si acierta."]], "7": [["⏳ Por transcribir (Xanathar)", "⏳ Pendiente: falta transcribir Xanathar's Guide a Notion para verificarlo. No se rellena de memoria."]], "15": [["⏳ Por transcribir (Xanathar)", "⏳ Pendiente: falta transcribir Xanathar's Guide a Notion."]], "20": [["⏳ Por transcribir (Xanathar)", "⏳ Pendiente: falta transcribir Xanathar's Guide a Notion."]]}}]}, "levels": {"1": {"f": [["Imponer las manos", "Reserva de curación de 5 × tu nivel de paladín que se recarga con un descanso largo. Acción adicional: tocas a una criatura (puedes ser tú) y restauras PG de la reserva. Puedes gastar 5 PG de la reserva para quitar el estado Envenenado (sin curar)."], ["Lanzamiento de conjuros", "Lanzas conjuros de paladín con Carisma como aptitud mágica y un símbolo sagrado como canalizador. Empiezas con 2 conjuros preparados de nivel 1 (se recomiendan Castigo abrasador y Heroísmo); recuperas espacios con un descanso largo y puedes cambiar un conjuro preparado tras cada descanso largo."], ["Maestría con armas", "Usas las propiedades de maestría de 2 tipos de armas con las que tengas competencia; puedes cambiarlos tras un descanso largo."]], "sl": [2], "prep": 2, "loh": 5}, "2": {"f": [["Castigo de paladín", "Siempre tienes Castigo divino preparado y puedes lanzarlo una vez sin gastar espacio de conjuro por descanso largo."], ["Estilo de combate", "Obtienes una dote de Estilo de combate, o en su lugar Guerrero bendito: 2 trucos de clérigo (se recomiendan Guía y Llama sagrada) lanzados con Carisma; puedes cambiar uno al subir de nivel."]], "sl": [2], "prep": 3, "loh": 10}, "3": {"f": [["Canalizar divinidad", "2 usos; recuperas 1 con descanso corto y todos con descanso largo (3 usos a nivel 11). CD = CD de salvación de conjuros. Efecto inicial Sentidos divinos: acción adicional, durante 10 minutos conoces la ubicación y tipo de celestiales, infernales y muertos vivientes a 18 m (60 ft), y detectas lugares consagrados o profanados."], ["Subclase de paladín", ""]], "sl": [3], "prep": 4, "loh": 15, "branch": 1, "subl": 3, "cd": 2}, "4": {"f": [["Mejora de característica", "Dote Mejora de característica u otra dote para la que cumplas condiciones. Se repite en los niveles 8, 12 y 16."]], "sl": [3], "prep": 5, "loh": 20, "asi": 1, "cd": 2}, "5": {"f": [["Ataque adicional", "Cuando realizas la acción de atacar, haces 2 ataques en lugar de 1."], ["Corcel fiel", "Siempre tienes Hallar corcel preparado y puedes lanzarlo una vez sin gastar espacio de conjuro por descanso largo."]], "sl": [4, 2], "prep": 6, "loh": 25, "cd": 2}, "6": {"f": [["Aura de protección", "Emanación de 3 m (10 ft): tú y tus aliados dentro sumáis tu mod. de Carisma (mín. +1) a las tiradas de salvación. Inactiva si estás Incapacitado; una criatura solo se beneficia de un Aura de protección a la vez."]], "sl": [4, 2], "prep": 6, "loh": 30, "cd": 2}, "7": {"f": [["Rasgo de subclase", ""]], "sl": [4, 3], "prep": 7, "loh": 35, "subl": 7, "cd": 2}, "8": {"f": [["Mejora de característica", "Dote Mejora de característica u otra dote para la que cumplas condiciones."]], "sl": [4, 3], "prep": 7, "loh": 40, "asi": 1, "cd": 2}, "9": {"f": [["Abjurar de los enemigos", "Acción de magia, gasta un uso de Canalizar divinidad: un número de criaturas visibles a 18 m (60 ft) igual a tu mod. CAR (mín. 1) hacen salvación de Sabiduría o quedan Asustadas 1 minuto o hasta recibir daño; mientras, en su turno solo pueden moverse, hacer una acción o una acción adicional (una de las tres)."]], "sl": [4, 3, 2], "prep": 9, "loh": 45, "cd": 2}, "10": {"f": [["Aura de coraje", "Tú y tus aliados dentro de tu Aura de protección tenéis inmunidad al estado Asustado."]], "sl": [4, 3, 2], "prep": 9, "loh": 50, "cd": 2}, "11": {"f": [["Golpes radiantes", "Cuando aciertas con un arma cuerpo a cuerpo o un ataque sin armas, el objetivo recibe 1d8 de daño radiante adicional."]], "sl": [4, 3, 3], "prep": 10, "loh": 55, "cd": 3}, "12": {"f": [["Mejora de característica", "Dote Mejora de característica u otra dote para la que cumplas condiciones."]], "sl": [4, 3, 3], "prep": 10, "loh": 60, "asi": 1, "cd": 3}, "13": {"f": [["Sin rasgo nuevo de clase", "Solo cambian los espacios de conjuro y los conjuros preparados."]], "sl": [4, 3, 3, 1], "prep": 11, "loh": 65, "cd": 3}, "14": {"f": [["Toque reparador", "Al usar Imponer las manos puedes gastar 5 PG de la reserva por cada estado que elimines entre Asustado, Aturdido, Cegado, Ensordecido, Hechizado o Paralizado (esos puntos no curan)."]], "sl": [4, 3, 3, 1], "prep": 11, "loh": 70, "cd": 3}, "15": {"f": [["Rasgo de subclase", ""]], "sl": [4, 3, 3, 2], "prep": 12, "loh": 75, "subl": 15, "cd": 3}, "16": {"f": [["Mejora de característica", "Dote Mejora de característica u otra dote para la que cumplas condiciones."]], "sl": [4, 3, 3, 2], "prep": 12, "loh": 80, "asi": 1, "cd": 3}, "17": {"f": [["Sin rasgo nuevo de clase", "Solo cambian los espacios de conjuro y los conjuros preparados."]], "sl": [4, 3, 3, 3, 1], "prep": 14, "loh": 85, "cd": 3}, "18": {"f": [["Expansión de aura", "Tu Aura de protección pasa a ser una emanación de 9 m (30 ft)."]], "sl": [4, 3, 3, 3, 1], "prep": 14, "loh": 90, "cd": 3}, "19": {"f": [["Don épico", "Obtienes una dote de Don épico u otra dote para la que cumplas condiciones. Se recomienda Don de la visión verdadera."]], "sl": [4, 3, 3, 3, 2], "prep": 15, "loh": 95, "cd": 3}, "20": {"f": [["Rasgo de subclase", ""]], "sl": [4, 3, 3, 3, 2], "prep": 15, "loh": 100, "subl": 20, "cd": 3}}}]};

auriana:{css:"\n/* Paleta de Auriana: alba — marfil, oro, rosa y violeta pálido */\n:root{--bg:#FBF6F0;--surface:#FFFDFA;--line:#EDE2D6;--line-2:#DCCBB8;--violet:#8A5FA8;--violet-d:#6D4788;--violet-soft:#F1E8F6;--gold:#C9962E;--gold-d:#9A7020;--gold-soft:#F8EDD3;--ruby:#C25A6E;--ruby-soft:#F9E3E8;--hero-1:#3A2A4A;--hero-2:#8A5FA8;--hero-ink:#FFF7EC;--hero-mute:#E3D1EA}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#17131B;--surface:#211B27;--line:#33293B;--line-2:#45384F;--violet:#C9A6E6;--violet-d:#DDC2F2;--violet-soft:#30233C;--gold:#E2B860;--gold-d:#EFCB84;--gold-soft:#332814;--ruby:#E8889B;--ruby-soft:#3A1F26;--hero-1:#1C1424;--hero-2:#4E3566}}\n:root[data-theme=\"dark\"]{--bg:#17131B;--surface:#211B27;--line:#33293B;--line-2:#45384F;--violet:#C9A6E6;--violet-d:#DDC2F2;--violet-soft:#30233C;--gold:#E2B860;--gold-d:#EFCB84;--gold-soft:#332814;--ruby:#E8889B;--ruby-soft:#3A1F26;--hero-1:#1C1424;--hero-2:#4E3566}\n",body:"<nav class=\"idx\" aria-label=\"Páginas de la hoja\">\n  <div class=\"in\">\n    <a href=\"#combate\"><b>1<\/b> Combate<\/a>\n    <a href=\"#equipo\"><b>2<\/b> Equipo<span class=\"wide\"> y conjuros<\/span><\/a>\n    <a href=\"#rasgos\"><b>3<\/b> Rasgos<span class=\"wide\"> e historia<\/span><\/a>\n    <a href=\"#arbol\"><b>4<\/b> Árbol<\/a>\n    <span class=\"sync\" id=\"sync\" role=\"status\">Conectando…<\/span>\n  <\/div>\n<\/nav>\n\n<header class=\"hero\">\n  <div class=\"in\">\n    <div class=\"herotop\"><div><div class=\"eyebrow\" id=\"cEyebrow\"><\/div>\n    <h1 id=\"cName\"><\/h1><\/div><img class=\"heroav\" id=\"heroAv\" alt=\"\" hidden><\/div>\n    <div class=\"idrow\" id=\"cId\"><\/div>\n    <div class=\"restbar\">\n      <button type=\"button\" id=\"bShort\">Descanso corto<\/button>\n      <button type=\"button\" id=\"bLong\">Descanso largo<\/button>\n      <button type=\"button\" id=\"bInsp\" aria-pressed=\"false\">Inspiración heroica<\/button>\n    <\/div>\n  <\/div>\n<\/header>\n\n<main><div class=\"in\"   {o:"Aasimar",c:"Personaje",l:3,lt:"Nivel 3",use:"1 / desc. largo",n:"Revelación celestial",en:"Celestial Revelation",src:"PHB 2024",d:["Acción adicional: te transformas durante 1 minuto, o hasta que le pongas fin sin acción, eligiendo una forma cada vez. Una vez por descanso largo. Mientras dure, una vez en cada uno de tus turnos haces +2 de daño (tu competencia) a un objetivo al que dañes con un ataque o conjuro: necrótico con Mortaja, radiante con Alas o Fulgor.","Alas celestiales: velocidad volando igual a tu velocidad.","Fulgor interior: luz brillante 3 m (10 ft) y tenue 3 m más; al final de cada uno de tus turnos, cada criatura a 3 m sufre 2 de daño radiante.","Mortaja necrótica: las criaturas que no sean aliadas a 3 m deben superar una salvación de Carisma CD 8 (8 + Car −2 + competencia 2) o quedan Asustadas hasta el final de tu siguiente turno. 🟡 Con Carisma 7 la CD es muy baja."]},
