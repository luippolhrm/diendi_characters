-bottom:1px solid var(--line);\n}\n.rule-table td{padding:6px 8px; border-bottom:1px solid var(--mist)}\n.rule-table tr:last-child td{border-bottom:none}\n\n.example-card{\n  background:var(--accent-soft);\n  border:1px solid var(--line);\n  border-left:4px solid var(--accent);\n  border-radius:var(--r);\n  padding:18px 20px;\n}\n.example-card .fname{color:var(--accent-d); font-size:16px; font-weight:600}\n.example-card .tag-ex{\n  font-family:'Space Grotesk',monospace; font-size:10px; font-weight:600;\n  letter-spacing:.06em; text-transform:uppercase;\n  color:var(--accent-d); background:#fff;\n  border:1px solid var(--accent); padding:3px 9px; border-radius:20px; white-space:nowrap;\n}\n.example-card .setup{font-size:13px; color:var(--ink-2); margin:8px 0 12px; font-style:italic}\n.example-card ol{margin:0; padding-left:20px}\n.example-card ol li{font-size:14px; line-height:1.6; margin-bottom:9px}\n.example-card ol li:last-child{margin-bottom:0}\n.example-card b{font-weight:600}\n\nfooter{\n  max-width:820px; margin:0 auto; padding:30px 24px 70px;\n  color:var(--ink-3); font-size:13px; border-top:1px solid var(--line);\n}\n\n@media (prefers-reduced-motion:reduce){\n  html{scroll-behavior:auto}\n}\n\n@media (max-width:480px){\n  header.intro{padding:40px 18px 22px}\n  main{padding:0 18px 60px}\n  nav{padding:12px 16px; gap:12px}\n}\n";
const HUB_HTML="<nav><a class=\"brand\" href=\"#top\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 200 200\" role=\"img\" aria-label=\"Monograma sol LR de Luis Ramos\"><circle cx=\"100\" cy=\"100\" r=\"86\" fill=\"#FFC531\"/><text x=\"100\" y=\"128\" text-anchor=\"middle\" font-family=\"Bricolage Grotesque, Helvetica, Arial, sans-serif\" font-weight=\"800\" font-size=\"76\" fill=\"#1B2A4A\">LR<\/text><circle cx=\"162\" cy=\"38\" r=\"15\" fill=\"#FF7A29\"/><\/svg>Mesa de Lucho<\/a><div class=\"links\" id=\"navLinks\"><a href=\"#personajes\">Personajes<\/a><a href=\"#fundamentos\">Fundamentos<\/a><a href=\"#estados\">Estados<\/a><a href=\"#acciones\">Acciones<\/a><a href=\"#descansos\">Descansos<\/a><a href=\"#combate\">Combate<\/a><a href=\"#dano-y-curacion\">Daño y curación<\/a><a href=\"#exploracion\">Exploración<\/a><a href=\"#conjuros\">Conjuros<\/a><a href=\"#equipo\">Equipo<\/a><a href=\"#ejemplos\">Ejemplos<\/a><\/div><\/nav>\n<header class=\"hero\" id=\"top\"><div class=\"sun\"><\/div><div class=\"spark\"><\/div><div class=\"in\">\n  <div class=\"eyebrow\">D&amp;D 2024 · consulta de mesa<\/div>\n  <h1><span class=\"tilt\">Mesa de Lucho<\/span><\/h1>\n  <p>Las hojas de los personajes y las reglas rápidas en un solo lugar. Las reglas son definiciones del Manual del Jugador 2024 (Devir) transcritas en Notion; nada se completa de memoria.<\/p>\n<\/div><\/header>\n<main>\n<section id=\"personajes\"><h2>Personajes<\/h2>\n  <p class=\"section-note\">Toca una carta para abrir la hoja aquí mismo; cada hoja tiene «← Mesa» para volver. Las interactivas guardan estado, equipo y oro; las de GitHub se abren aparte hasta migrarlas.<\/p>\n  <div class=\"chars\"><a class=\"pc \" href=\"#/usoryn\"><span class=\"av\" style=\"background:#CFE9DC\">U<\/span><b>Usoryn Bravoviento<\/b><span>Mediano · Pícaro 1 / Explorador 5 · Cazador · nivel 6<\/span><span class=\"where\">Hoja interactiva · en juego<\/span><\/a><a class=\"pc \" href=\"#/kiyaj\"><span class=\"av\" style=\"background:#E4DAF5\">K<\/span><b>Ki'yaj<\/b><span>Githyanki · Paladín 4 · Juramento de la Conquista<\/span><span class=\"where\">Hoja interactiva<\/span><\/a><a class=\"pc \" href=\"#/darvin\"><span class=\"av\" style=\"background:#F3D9C3\">D<\/span><b>Darvin Norris<\/b><span>Humano · Monje 12 · Guerrero de la mano abierta<\/span><span class=\"where\">Hoja interactiva<\/span><\/a><a class=\"pc \" href=\"#/auriana\"><span class=\"av\" style=\"background:#FBE7B8\">A<\/span><b>Auriana Grandhe<\/b><span>Aasimar · Clériga 3 · Dominio de la vida<\/span><span class=\"where\">Hoja interactiva<\/span><\/a><a class=\"pc \" href=\"#/yevelda\"><span class=\"av\" style=\"background:#F2C9C9\">Y<\/span><b>Yevelda<\/b><span>Orca · Bárbara 1 · Soldado<\/span><span class=\"where\">Hoja interactiva<\/span><\/a><\/div>\n  <div class=\"refs\" style=\"margin-top:14px\">\n    <a href=\"https://app.notion.com/p/3a862efd3d4a81acb795cf72fd060e6c\" target=\"_blank\" rel=\"noopener\"><b>📖 Manual del Jugador 2024<\/b><span>Transcripción completa en Notion (Devir). Fuente de todas las reglas de esta página.<\/span><\/a>\n    <a href=\"https://app.notion.com/p/40c62efd3d4a81f3b288e0576e78e543\" target=\"_blank\" rel=\"noopener\"><b>📖 Eberron: Forge of the Artificer<\/b><span>Capítulo 1, la clase Artífice, en Notion.<\/span><\/a>\n  <\/div>\n<\/section>\n<section id=\"reglas\" style=\"padding-top:36px\"><h2>Reglas rápidas<\/h2>\n  <p class=\"section-note\">Fundamentos, estados, acciones, descansos, combate, daño y curación, exploración, conjuros, equipo y ejemplos. Fuente: PHB 2024, capítulos 1, 6 y 7 y Apéndice C.<\/p>\n  <div class=\"search\"><input type=\"search\" id=\"q\" placeholder=\"Buscar una regla: apresado, cobertura, ritual…\" aria-label=\"Buscar regla\"><output id=\"qn\"><\/output><\/div>\n<\/section>\n\n\n<section id=\"fundamentos\">\n  <h2>Fundamentos<\/h2>\n  <p class=\"section-note\">La base sobre la que se apoya todo lo demás: modificadores, pruebas con d20 y competencia.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"modificadores-por-caracteristica\">\n      <div class=\"fhead\"><span class=\"fname\">Modificadores por característica<\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Puntuación<\/th><th>Modificador<\/th><th>Puntuación<\/th><th>Modificador<\/th><\/tr>\n        <tr><td>1<\/td><td>−5<\/td><td>18–19<\/td><td>+4<\/td><\/tr>\n        <tr><td>2–3<\/td><td>−4<\/td><td>20–21<\/td><td>+5<\/td><\/tr>\n        <tr><td>4–5<\/td><td>−3<\/td><td>22–23<\/td><td>+6<\/td><\/tr>\n        <tr><td>6–7<\/td><td>−2<\/td><td>24–25<\/td><td>+7<\/td><\/tr>\n        <tr><td>8–9<\/td><td>−1<\/td><td>26–27<\/td><td>+8<\/td><\/tr>\n        <tr><td>10–11<\/td><td>+0<\/td><td>28–29<\/td><td>+9<\/td><\/tr>\n        <tr><td>12–13<\/td><td>+1<\/td><td>30<\/td><td>+10<\/td><\/tr>\n        <tr><td>14–15<\/td><td>+2<\/td><td><\/td><td><\/td><\/tr>\n        <tr><td>16–17<\/td><td>+3<\/td><td><\/td><td><\/td><\/tr>\n      <\/table>\n    <\/div>\n\n    <div class=\"fcard\" id=\"pruebas-con-d20\">\n      <div class=\"fhead\"><span class=\"fname\">Pruebas con d20<\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <p>Tira 1d20, suma el modificador por característica y el bonificador por competencia si aplica, y compara contra la CD (o la CA, en tiradas de ataque). Igualar o superar = éxito.<\/p>\n      <table class=\"rule-table\">\n        <tr><th>Dificultad<\/th><th>CD<\/th><\/tr>\n        <tr><td>Muy fácil<\/td><td>5<\/td><\/tr>\n        <tr><td>Fácil<\/td><td>10<\/td><\/tr>\n        <tr><td>Dificultad media<\/td><td>15<\/td><\/tr>\n        <tr><td>Difícil<\/td><td>20<\/td><\/tr>\n        <tr><td>Muy difícil<\/td><td>25<\/td><\/tr>\n        <tr><td>Casi imposible<\/td><td>30<\/td><\/tr>\n      <\/table>\n      <p><b>Ventaja y desventaja.<\/b> Tira 2d20 y usa el más alto (ventaja) o el más bajo (desventaja). No se acumulan — varias ventajas siguen siendo solo 2d20. Si tienes ambas a la vez, se anulan y tiras 1d20.<\/p>\n      <p><b>Sacar 20 o 1 (en ataque).<\/b> Un 20 natural acierta sin importar modificadores ni CA — es un crítico. Un 1 natural falla sin importar modificadores ni CA.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"inspiracion-heroica\">\n      <div class=\"fhead\"><span class=\"fname\">Inspiración heroica<\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <p>Puedes gastarla para volver a tirar cualquier dado inmediatamente después de lanzarlo — debes quedarte con el nuevo resultado. Nunca puedes tener más de una a la vez; si recibes otra teniéndola ya, puedes cedérsela a un aliado que no la tenga.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"competencia\">\n      <div class=\"fhead\"><span class=\"fname\">Competencia<\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Nivel / VD<\/th><th>Bonificador<\/th><\/tr>\n        <tr><td>Hasta 4<\/td><td>+2<\/td><\/tr>\n        <tr><td>5–8<\/td><td>+3<\/td><\/tr>\n        <tr><td>9–12<\/td><td>+4<\/td><\/tr>\n        <tr><td>13–16<\/td><td>+5<\/td><\/tr>\n        <tr><td>17–20<\/td><td>+6<\/td><\/tr>\n        <tr><td>21–24<\/td><td>+7<\/td><\/tr>\n        <tr><td>25–28<\/td><td>+8<\/td><\/tr>\n        <tr><td>29–30<\/td><td>+9<\/td><\/tr>\n      <\/table>\n      <p>Se aplica a pruebas con d20 en habilidades, salvaciones o equipo donde tengas competencia, y a ataques y CD de conjuros. No se acumula: nunca se suma más de una vez a la misma tirada.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"pericia\">\n      <div class=\"fhead\"><span class=\"fname\">Pericia <span class=\"en\">Expertise<\/span><\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <p>Tu bonificador por competencia se <b>duplica<\/b> en cualquier prueba de característica que hagas con una habilidad en la que tengas pericia, salvo que otro rasgo ya lo duplique.<\/p>\n      <p>Solo se gana en una habilidad en la que ya tengas competencia, y no puedes tenerla más de una vez en la misma habilidad.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"habilidades\">\n      <div class=\"fhead\"><span class=\"fname\">Habilidades<\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Habilidad<\/th><th>Característica<\/th><\/tr>\n        <tr><td>Acrobacias<\/td><td>Destreza<\/td><\/tr>\n        <tr><td>Atletismo<\/td><td>Fuerza<\/td><\/tr>\n        <tr><td>Conocimiento arcano<\/td><td>Inteligencia<\/td><\/tr>\n        <tr><td>Engaño<\/td><td>Carisma<\/td><\/tr>\n        <tr><td>Historia<\/td><td>Inteligencia<\/td><\/tr>\n        <tr><td>Interpretación<\/td><td>Carisma<\/td><\/tr>\n        <tr><td>Intimidación<\/td><td>Carisma<\/td><\/tr>\n        <tr><td>Investigación<\/td><td>Inteligencia<\/td><\/tr>\n        <tr><td>Juego de manos<\/td><td>Destreza<\/td><\/tr>\n        <tr><td>Medicina<\/td><td>Sabiduría<\/td><\/tr>\n        <tr><td>Naturaleza<\/td><td>Inteligencia<\/td><\/tr>\n        <tr><td>Percepción<\/td><td>Sabiduría<\/td><\/tr>\n        <tr><td>Perspicacia<\/td><td>Sabiduría<\/td><\/tr>\n        <tr><td>Persuasión<\/td><td>Carisma<\/td><\/tr>\n        <tr><td>Religión<\/td><td>Inteligencia<\/td><\/tr>\n        <tr><td>Sigilo<\/td><td>Destreza<\/td><\/tr>\n        <tr><td>Supervivencia<\/td><td>Sabiduría<\/td><\/tr>\n        <tr><td>Trato con animales<\/td><td>Sabiduría<\/td><\/tr>\n      <\/table>\n      <p>El DM puede permitir aplicar competencia a una característica distinta de la habitual si la situación lo justifica (ej. Fuerza (Intimidación) en vez de Carisma (Intimidación)).<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"percepcion-pasiva\">\n      <div class=\"fhead\"><span class=\"fname\">Percepción pasiva <span class=\"en\">Passive Perception<\/span><\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <p><b>10 + tu bonificador a las pruebas de Sabiduría (Percepción).<\/b> Si tienes ventaja en esas pruebas, suma 5; si tienes desventaja, resta 5.<\/p>\n      <p>El DM usa esta puntuación para determinar si te percatas de algo sin hacer una prueba adrede. Ejemplo: nivel 1, Sabiduría 15, competencia en Percepción → 10 + 2 + 2 = 14.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"redondear\">\n      <div class=\"fhead\"><span class=\"fname\">Redondear hacia abajo <span class=\"en\">Round Down<\/span><\/span><span class=\"tag\">fundamentos<\/span><\/div>\n      <p>Siempre que dividas o multipliques un número en la partida, redondea <b>hacia abajo<\/b> si no es entero, incluso cuando la parte decimal sea 5 o más. Algunas reglas plantean excepciones e indican explícitamente redondear hacia arriba.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"estados\">\n  <h2>Estados <span class=\"count\">15<\/span><\/h2>\n  <p class=\"section-note\">Un estado es una situación temporal. No se acumulan, salvo el cansancio. Un estado termina cuando lo indica su propia definición o cuando otra regla lo contrarresta.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"agarrado\">\n      <div class=\"fhead\"><span class=\"fname\">Agarrado <span class=\"en\">Grappled<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Velocidad 0.<\/b> Tu velocidad es 0 y no puede aumentar.<\/p>\n      <p><b>Ataques afectados.<\/b> Tienes desventaja en las tiradas de ataque contra cualquier objetivo que no sea quien te agarra.<\/p>\n      <p><b>Desplazable.<\/b> Quien te agarra puede arrastrarte o transportarte al moverse, pero cada metro de movimiento le cuesta 1 m adicional, salvo que seas Diminuto o tu tamaño sea dos o más categorías inferior al suyo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"apresado\">\n      <div class=\"fhead\"><span class=\"fname\">Apresado <span class=\"en\">Restrained<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Velocidad 0.<\/b> Tu velocidad es 0 y no puede aumentar.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas de ataque contra ti tienen ventaja y tus tiradas de ataque tienen desventaja.<\/p>\n      <p><b>Tiradas de salvación afectadas.<\/b> Tienes desventaja en las tiradas de salvación de Destreza.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"asustado\">\n      <div class=\"fhead\"><span class=\"fname\">Asustado <span class=\"en\">Frightened<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Pruebas de característica y ataques afectados.<\/b> Tienes desventaja en las pruebas de característica y las tiradas de ataque mientras la fuente de tu miedo esté en tu línea de visión.<\/p>\n      <p><b>No puedes acercarte.<\/b> No puedes acercarte voluntariamente a la fuente de tu miedo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"aturdido\">\n      <div class=\"fhead\"><span class=\"fname\">Aturdido <span class=\"en\">Stunned<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Incapacitado.<\/b> Tienes el estado de incapacitado.<\/p>\n      <p><b>Tiradas de salvación afectadas.<\/b> Fallas automáticamente las tiradas de salvación de Fuerza y Destreza.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas de ataque contra ti tienen ventaja.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"cansancio\">\n      <div class=\"fhead\"><span class=\"fname\">Cansancio <span class=\"en\">Exhaustion<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Niveles de cansancio.<\/b> Este estado es acumulativo. Cada vez que lo recibas, suma 1 nivel de cansancio. Morirás si tu nivel de cansancio es 6.<\/p>\n      <p><b>Pruebas con d20 afectadas.<\/b> El resultado se reduce en 2 × tu nivel de cansancio.<\/p>\n      <p><b>Velocidad reducida.<\/b> Tu velocidad se reduce en 1,5 m × tu nivel de cansancio.<\/p>\n      <p><b>Eliminar niveles.<\/b> Tras finalizar un descanso largo, resta 1 nivel de cansancio.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"cegado\">\n      <div class=\"fhead\"><span class=\"fname\">Cegado <span class=\"en\">Blinded<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>No puedes ver.<\/b> Fallas automáticamente todas las pruebas de característica que requieran la vista.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas de ataque contra ti tienen ventaja y tus tiradas de ataque tienen desventaja.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"derribado\">\n      <div class=\"fhead\"><span class=\"fname\">Derribado <span class=\"en\">Prone<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Movimiento restringido.<\/b> Tus únicas opciones de movimiento son arrastrarte o gastar movimiento igual a la mitad de tu velocidad (redondeando hacia abajo) para levantarte y poner fin a este estado. Si tu velocidad es 0, no puedes levantarte.<\/p>\n      <p><b>Ataques afectados.<\/b> Tienes desventaja en las tiradas de ataque. Las tiradas contra ti tienen ventaja si el atacante está a 1,5 m o menos; si no, tienen desventaja.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ensordecido\">\n      <div class=\"fhead\"><span class=\"fname\">Ensordecido <span class=\"en\">Deafened<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>No puedes oír.<\/b> Fallas automáticamente cualquier prueba de característica que requiera el oído.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"envenenado\">\n      <div class=\"fhead\"><span class=\"fname\">Envenenado <span class=\"en\">Poisoned<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Pruebas de característica y ataques afectados.<\/b> Tienes desventaja en las tiradas de ataque y las pruebas de característica.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"hechizado\">\n      <div class=\"fhead\"><span class=\"fname\">Hechizado <span class=\"en\">Charmed<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>No puedes dañar a quien te haya hechizado.<\/b> No puedes atacar ni elegir como objetivo de efectos dañinos o mágicos a quien te haya hechizado.<\/p>\n      <p><b>Ventaja social.<\/b> Quien te haya hechizado tiene ventaja en las pruebas de característica para interactuar socialmente contigo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"incapacitado\">\n      <div class=\"fhead\"><span class=\"fname\">Incapacitado <span class=\"en\">Incapacitated<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Inactivo.<\/b> No puedes llevar a cabo ninguna acción, acción adicional o reacción.<\/p>\n      <p><b>Pérdida de concentración.<\/b> Pierdes la concentración.<\/p>\n      <p><b>Mudo.<\/b> No puedes hablar.<\/p>\n      <p><b>Sorprendido.<\/b> Si tienes este estado cuando tiras iniciativa, tendrás desventaja en la tirada.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"inconsciente\">\n      <div class=\"fhead\"><span class=\"fname\">Inconsciente <span class=\"en\">Unconscious<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Inerte.<\/b> Tienes los estados de derribado e incapacitado y sueltas lo que estés sujetando. Al concluir, permaneces derribado.<\/p>\n      <p><b>Velocidad 0.<\/b> No puede aumentar.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas contra ti tienen ventaja.<\/p>\n      <p><b>Tiradas de salvación afectadas.<\/b> Fallas automáticamente las de Fuerza y Destreza.<\/p>\n      <p><b>Críticos automáticos.<\/b> Cualquier ataque que te acierte es crítico si el atacante está a 1,5 m o menos.<\/p>\n      <p><b>Ignorante.<\/b> No eres consciente de tu entorno.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"invisible\">\n      <div class=\"fhead\"><span class=\"fname\">Invisible <span class=\"en\">Invisible<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Sorpresa.<\/b> Si tienes este estado al tirar iniciativa, tendrás ventaja en la tirada.<\/p>\n      <p><b>Oculto.<\/b> No te afecta ningún efecto que requiera ver a su objetivo, salvo que el creador pueda verte de alguna forma. El equipo que llevas también se oculta.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas contra ti tienen desventaja y tus tiradas tienen ventaja, salvo contra quien pueda verte de algún modo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"paralizado\">\n      <div class=\"fhead\"><span class=\"fname\">Paralizado <span class=\"en\">Paralyzed<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Incapacitado.<\/b> Tienes el estado de incapacitado.<\/p>\n      <p><b>Velocidad 0.<\/b> No puede aumentar.<\/p>\n      <p><b>Tiradas de salvación afectadas.<\/b> Fallas automáticamente las de Fuerza y Destreza.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas contra ti tienen ventaja.<\/p>\n      <p><b>Críticos automáticos.<\/b> Cualquier ataque que te acierte es crítico si el atacante está a 1,5 m o menos.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"petrificado\">\n      <div class=\"fhead\"><span class=\"fname\">Petrificado <span class=\"en\">Petrified<\/span><\/span><span class=\"tag\">estado<\/span><\/div>\n      <p><b>Transformación.<\/b> Te conviertes, junto a tus objetos no mágicos, en una sustancia sólida e inanimada (normalmente piedra). Tu peso se multiplica por diez y dejas de envejecer.<\/p>\n      <p><b>Incapacitado.<\/b> Tienes el estado de incapacitado. <b>Velocidad 0,<\/b> no puede aumentar.<\/p>\n      <p><b>Ataques afectados.<\/b> Las tiradas contra ti tienen ventaja. <b>Tiradas de salvación afectadas.<\/b> Fallas automáticamente las de Fuerza y Destreza.<\/p>\n      <p><b>Resistencia al daño.<\/b> Tienes resistencia a todo el daño. <b>Inmunidad al veneno.<\/b> Tienes inmunidad al estado de envenenado.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"acciones\">\n  <h2>Acciones <span class=\"count\">12<\/span><\/h2>\n  <p class=\"section-note\">En tu turno puedes moverte y llevar a cabo una acción. Solo puedes hacer una acción cada vez. Dos conceptos relacionados que verás citados en las fichas: acción adicional y reacción — no son acciones normales, son turnos especiales que solo existen si un rasgo o conjuro te los otorga explícitamente.<\/p>\n\n  <div class=\"grid\" style=\"margin-bottom:14px\">\n    <div class=\"fcard\" id=\"accion-adicional\">\n      <div class=\"fhead\"><span class=\"fname\">Acción adicional <span class=\"en\">Bonus Action<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Una acción especial que puedes hacer en el mismo turno en que llevas a cabo una acción. No puedes realizar más de una por turno, y solo tienes acciones adicionales a tu disposición si una regla lo indica de forma explícita.<\/p>\n    <\/div>\n    <div class=\"fcard\" id=\"reaccion\">\n      <div class=\"fhead\"><span class=\"fname\">Reacción <span class=\"en\">Reaction<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Una acción especial en respuesta a un suceso definido en su descripción. Puede llevarse a cabo en el turno de otra criatura o en el propio. Al usar una reacción, no podrás volver a hacerlo hasta el principio de tu siguiente turno. El ataque de oportunidad es la reacción más habitual.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"atacar\">\n      <div class=\"fhead\"><span class=\"fname\">Atacar <span class=\"en\">Attack<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Haces una tirada de ataque con un arma o un ataque sin armas.<\/p>\n      <p><b>Equiparse con armas.<\/b> Como parte de esta acción puedes equiparte o desequiparte de un arma, antes o después del ataque, aunque no la uses en él.<\/p>\n      <p><b>Moverse entre ataques.<\/b> Si tienes un rasgo (como Ataque adicional) que te permite atacar más de una vez, puedes repartir tu movimiento entre esos ataques.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ayudar\">\n      <div class=\"fhead\"><span class=\"fname\">Ayudar <span class=\"en\">Help<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p><b>En una prueba de característica.<\/b> Un aliado cercano tendrá ventaja en la siguiente prueba que haga con la habilidad o herramienta elegida, hasta el principio de tu siguiente turno.<\/p>\n      <p><b>En una tirada de ataque.<\/b> Distraes a un enemigo a 1,5 m o menos de ti; la siguiente tirada de ataque de un aliado contra ese enemigo tiene ventaja, hasta el principio de tu siguiente turno.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"buscar\">\n      <div class=\"fhead\"><span class=\"fname\">Buscar <span class=\"en\">Search<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Haces una prueba de Sabiduría para distinguir algo que no resulta evidente: Medicina (dolencia o causa de muerte), Percepción (criatura u objeto oculto), Perspicacia (estado mental de una criatura) o Supervivencia (huellas o alimentos).<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"correr\">\n      <div class=\"fhead\"><span class=\"fname\">Correr <span class=\"en\">Dash<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Consigues movimiento adicional para el turno, igual a tu velocidad tras aplicar los modificadores pertinentes. Puedes emplear una velocidad especial (nadando, volando) en lugar de la normal si la tienes.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"destrabarse\">\n      <div class=\"fhead\"><span class=\"fname\">Destrabarse <span class=\"en\">Disengage<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Tu movimiento no provocará ataques de oportunidad durante el resto del turno actual.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"esconderse\">\n      <div class=\"fhead\"><span class=\"fname\">Esconderse <span class=\"en\">Hide<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Prueba de Destreza (Sigilo) CD 15 mientras estás en zona muy oscura o tras cobertura tres cuartos/completa, fuera de la línea de visión enemiga. Si la superas, tienes el estado de invisible mientras permanezcas oculto. Dejas de estarlo si haces ruido, un enemigo te detecta, atacas o lanzas un conjuro con componente verbal.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"esquivar\">\n      <div class=\"fhead\"><span class=\"fname\">Esquivar <span class=\"en\">Dodge<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Hasta el principio de tu siguiente turno: las tiradas de ataque contra ti tienen desventaja si puedes ver al atacante, y tienes ventaja en tiradas de salvación de Destreza. Pierdes estos beneficios si tienes el estado de incapacitado o tu velocidad es 0.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"estudiar\">\n      <div class=\"fhead\"><span class=\"fname\">Estudiar <span class=\"en\">Study<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Prueba de Inteligencia para recordar un dato: Conocimiento arcano, Historia, Investigación, Naturaleza o Religión, según lo que trates de recordar.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"influir\">\n      <div class=\"fhead\"><span class=\"fname\">Influir <span class=\"en\">Influence<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Instas a un monstruo a hacer algo. Si es <b>voluntario<\/b> (concuerda con sus deseos) o <b>no voluntario<\/b> (le resulta aversivo), no hay prueba. Si está <b>indeciso<\/b>, haces una prueba de característica (Engaño, Interpretación, Intimidación, Persuasión o Trato con animales) contra CD 15 o la Inteligencia del monstruo, la que sea mayor.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"magia\">\n      <div class=\"fhead\"><span class=\"fname\">Magia <span class=\"en\">Magic<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Lanzas un conjuro con tiempo de lanzamiento de una acción, o usas un rasgo u objeto mágico que requiera esta acción. Si el conjuro tiene tiempo de lanzamiento de 1 minuto o más, repites esta acción cada turno de ese lanzamiento manteniendo concentración; si la pierdes, el conjuro falla pero no gastas el espacio.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"preparar-una-accion\">\n      <div class=\"fhead\"><span class=\"fname\">Preparar una acción <span class=\"en\">Ready<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Esperas a que ocurra algo concreto para actuar con tu reacción antes del principio de tu siguiente turno. Defines la circunstancia activadora y la acción (o hasta tu velocidad de movimiento) que harás en respuesta. Al preparar un conjuro, lo lanzas gastando sus recursos pero liberas su energía con la reacción; requiere concentración hasta el principio de tu siguiente turno.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"utilizar\">\n      <div class=\"fhead\"><span class=\"fname\">Utilizar <span class=\"en\">Use an Object<\/span><\/span><span class=\"tag\">acción<\/span><\/div>\n      <p>Usas un objeto no mágico que requiera una acción para interactuar con él (más allá de la interacción gratuita que ya tienes por turno).<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"descansos\">\n  <h2>Descansos <span class=\"count\">2<\/span><\/h2>\n  <p class=\"section-note\">Para empezar cualquiera de los dos descansos necesitas al menos 1 punto de golpe.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"descanso-corto\">\n      <div class=\"fhead\"><span class=\"fname\">Descanso corto <span class=\"en\">Short Rest<\/span><\/span><span class=\"tag\">descanso<\/span><\/div>\n      <p>Periodo de inactividad de 1 hora sin nada más extenuante que leer, charlar, comer o montar guardia.<\/p>\n      <p><b>Gastar dados de golpe.<\/b> Puedes gastar uno o más dados de golpe para recuperar puntos de golpe: tira el dado, suma tu modificador por Constitución, recuperas ese total (mínimo 1). Decides si gastas otro tras cada tirada.<\/p>\n      <p><b>Rasgo especial.<\/b> Algunos rasgos se recargan con un descanso corto.<\/p>\n      <p><b>Interrumpir.<\/b> Se interrumpe si tiras iniciativa, lanzas un conjuro que no sea truco, o sufres daño. Un descanso corto interrumpido no otorga ningún beneficio.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"descanso-largo\">\n      <div class=\"fhead\"><span class=\"fname\">Descanso largo <span class=\"en\">Long Rest<\/span><\/span><span class=\"tag\">descanso<\/span><\/div>\n      <p>Periodo de inactividad de al menos 8 horas: duermes un mínimo de 6 y haces como máximo 2 de actividades ligeras. Mientras duermes tienes el estado de inconsciente. Tras terminarlo, debes esperar al menos 16 horas para empezar otro.<\/p>\n      <p><b>Puntos de golpe al máximo.<\/b> Recuperas todos los puntos de golpe perdidos y <b>todos los dados de golpe gastados<\/b> — no la mitad. Si tus puntos de golpe máximos se habían reducido, vuelven a la normalidad.<\/p>\n      <p><b>Puntuaciones restablecidas.<\/b> Cualquier puntuación de característica reducida vuelve a la normalidad.<\/p>\n      <p><b>Cansancio reducido.<\/b> Si tienes el estado de cansancio, su nivel baja en 1.<\/p>\n      <p><b>Rasgo especial.<\/b> Algunos rasgos se recargan con un descanso largo.<\/p>\n      <p><b>Interrumpir.<\/b> Se interrumpe si tiras iniciativa, lanzas un conjuro que no sea truco, sufres daño, o caminas/haces ejercicio físico durante 1 hora. Si descansaste al menos 1 hora antes de la interrupción, obtienes los beneficios de un descanso corto. Puedes reanudarlo de inmediato; cada interrupción suma 1 hora adicional para completarlo.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"combate\">\n  <h2>Combate<\/h2>\n  <p class=\"section-note\">Estructura del turno, movimiento, ataques y situaciones especiales (montado, bajo el agua).<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"estructura-combate\">\n      <div class=\"fhead\"><span class=\"fname\">Estructura de un combate<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Un asalto dura unos 6 segundos en el mundo del juego. Durante ese tiempo, cada participante juega un turno.<\/p>\n      <ol>\n        <li><b>Establecer posiciones.<\/b> El DM determina dónde se sitúan todos los personajes y monstruos.<\/li>\n        <li><b>Tirar iniciativa.<\/b> Todos los implicados tiran iniciativa, que determina el orden de los turnos.<\/li>\n        <li><b>Turnarse.<\/b> Cada participante juega su turno siguiendo el orden de iniciativa. El asalto termina cuando todos han jugado; se repite hasta que concluya el combate.<\/li>\n      <\/ol>\n      <p><b>Terminar el combate.<\/b> Concluye cuando un bando resulta vencido (muerto, inconsciente, rendido o huido) o cuando ambos bandos acuerdan terminarlo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"iniciativa\">\n      <div class=\"fhead\"><span class=\"fname\">Iniciativa<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Prueba de Destreza que determina el orden de los turnos. El DM tira por los monstruos; un grupo de criaturas idénticas comparte una única tirada.<\/p>\n      <p><b>Sorpresa.<\/b> Si el inicio del combate te pilla desprevenido, tienes desventaja en tu tirada de iniciativa.<\/p>\n      <p><b>Orden.<\/b> De mayor a menor iniciativa; no cambia entre asaltos.<\/p>\n      <p><b>Empates.<\/b> El DM decide el orden entre monstruos, los jugadores entre personajes; si el empate es entre un monstruo y un personaje, decide el DM.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"tu-turno\">\n      <div class=\"fhead\"><span class=\"fname\">Tu turno<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Puedes moverte una distancia igual o menor a tu velocidad y llevar a cabo una acción, en el orden que prefieras.<\/p>\n      <p><b>Comunicarte.<\/b> Frases cortas o gestos no cuestan movimiento ni acción. Una explicación amplia o intentar persuadir a un enemigo sí requiere una acción.<\/p>\n      <p><b>Interactuar con objetos.<\/b> Una interacción gratuita por turno, como parte de tu movimiento o acción. Una segunda interacción requiere la acción de utilizar.<\/p>\n      <p><b>No hacer nada.<\/b> Puedes renunciar a moverte y actuar. Si no sabes qué hacer, valora esquivar o preparar una acción.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"movimiento-y-posicion\">\n      <div class=\"fhead\"><span class=\"fname\">Movimiento y posición<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p><b>Terreno difícil.<\/b> Cada metro de movimiento en terreno difícil cuesta 1 m adicional.<\/p>\n      <p><b>Dividir el movimiento.<\/b> Puedes repartirlo antes y después de cualquier acción, acción adicional o reacción del mismo turno.<\/p>\n      <p><b>Tirarte al suelo.<\/b> Puedes adoptar el estado de derribado sin usar acción ni gastar velocidad, salvo que tu velocidad restante sea 0.<\/p>\n      <p><b>Moverte alrededor de otras criaturas.<\/b> Puedes atravesar el espacio de un aliado, una criatura incapacitada, una Diminuta, o una con tamaño dos categorías por encima o por debajo del tuyo. El espacio de otra criatura es terreno difícil para ti, salvo que sea Diminuta o aliada. No puedes terminar tu movimiento voluntariamente en un espacio ocupado; si terminas ahí de todos modos, quedas derribado salvo que seas Diminuto o más grande que la otra criatura.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"velocidad\">\n      <div class=\"fhead\"><span class=\"fname\">Velocidad <span class=\"en\">Speed<\/span><\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>La distancia en metros que puedes recorrer al moverte en tu turno.<\/p>\n      <p><b>Velocidades especiales<\/b> (nadando, volando, trepando, excavando). Si tienes más de una, eliges cuál usar al moverte y puedes alternar entre ellas: resta la distancia ya recorrida a la nueva velocidad; lo que quede es lo que aún puedes moverte.<\/p>\n      <p><b>Cambios.<\/b> Si un efecto aumenta o reduce tu velocidad, todas tus velocidades especiales aumentan o se reducen en la misma cantidad durante el mismo periodo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"terreno-dificil\">\n      <div class=\"fhead\"><span class=\"fname\">Terreno difícil <span class=\"en\">Difficult Terrain<\/span><\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Cada metro de movimiento en terreno difícil cuesta 1 m adicional. No es acumulativo: un espacio es terreno difícil o no lo es.<\/p>\n      <p>Un espacio es terreno difícil si contiene: una criatura que no sea Diminuta ni aliada tuya · un mueble diseñado para criaturas de tu tamaño o superior · escombros, hielo, maleza o nieve espesa · líquido que llegue entre las espinillas y la cintura · una abertura estrecha para una criatura una categoría menor · una pendiente de 20 grados o más.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"tamano-criatura\">\n      <div class=\"fhead\"><span class=\"fname\">Tamaño y espacio de una criatura<\/span><span class=\"tag\">combate<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Tamaño<\/th><th>Espacio (m)<\/th><th>Espacio (casillas)<\/th><\/tr>\n        <tr><td>Diminuto<\/td><td>0,75 × 0,75<\/td><td>4 por casilla<\/td><\/tr>\n        <tr><td>Pequeño<\/td><td>1,5 × 1,5<\/td><td>1 casilla<\/td><\/tr>\n        <tr><td>Mediano<\/td><td>1,5 × 1,5<\/td><td>1 casilla<\/td><\/tr>\n        <tr><td>Grande<\/td><td>3 × 3<\/td><td>4 casillas<\/td><\/tr>\n        <tr><td>Enorme<\/td><td>4,5 × 4,5<\/td><td>9 casillas<\/td><\/tr>\n        <tr><td>Gargantuesco<\/td><td>6 × 6<\/td><td>16 casillas<\/td><\/tr>\n      <\/table>\n    <\/div>\n\n    <div class=\"fcard\" id=\"resolver-ataque\">\n      <div class=\"fhead\"><span class=\"fname\">Hacer un ataque<\/span><span class=\"tag\">combate<\/span><\/div>\n      <ol>\n        <li><b>Escoge un objetivo<\/b> dentro del alcance del ataque: una criatura, un objeto o un lugar.<\/li>\n        <li><b>Determina los modificadores.<\/b> El DM valora cobertura, ventaja/desventaja, y cualquier bonificador o penalizador de conjuros o capacidades especiales.<\/li>\n        <li><b>Resuelve el ataque.<\/b> Tirada de ataque: acierta si iguala o supera la CA del objetivo. Si acierta, tiras el daño, salvo que ese ataque siga otras normas.<\/li>\n      <\/ol>\n      <p><b>Objetivo oculto.<\/b> Si no puedes ver al objetivo, tienes desventaja en la tirada; si no está donde apuntas, fallas automáticamente. Si atacas a alguien que no puede verte, tienes ventaja. Estar escondido y atacar revela tu ubicación, aciertes o no.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"cobertura\">\n      <div class=\"fhead\"><span class=\"fname\">Cobertura<\/span><span class=\"tag\">combate<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Nivel<\/th><th>Beneficio<\/th><th>Lo proporciona<\/th><\/tr>\n        <tr><td>Media<\/td><td>+2 a CA y salv. Destreza<\/td><td>Cubre al menos la mitad del objetivo<\/td><\/tr>\n        <tr><td>Tres cuartos<\/td><td>+5 a CA y salv. Destreza<\/td><td>Cubre al menos tres cuartos<\/td><\/tr>\n        <tr><td>Completa<\/td><td>No puede ser objetivo directo<\/td><td>Cubre todo el objetivo<\/td><\/tr>\n      <\/table>\n      <p>Si hay varios obstáculos, solo se aplica el nivel más alto — no se suman.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ataques-a-distancia\">\n      <div class=\"fhead\"><span class=\"fname\">Ataques a distancia<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p><b>Alcance.<\/b> Más allá del alcance normal, la tirada tiene desventaja; más allá del alcance largo, no puedes atacar. Si el ataque tiene un único alcance, no puedes atacar más allá de él.<\/p>\n      <p><b>Junto a un enemigo.<\/b> Si haces un ataque a distancia estando a 1,5 m o menos de un enemigo que pueda verte y no esté incapacitado, tienes desventaja en la tirada.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ataques-cuerpo-a-cuerpo\">\n      <div class=\"fhead\"><span class=\"fname\">Ataques cuerpo a cuerpo<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Alcanzas a un objetivo a tu alcance, normalmente 1,5 m, salvo que la criatura tenga un alcance mayor indicado en su descripción.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ataque-sin-armas\">\n      <div class=\"fhead\"><span class=\"fname\">Ataque sin armas <span class=\"en\">Unarmed Strike<\/span><\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Un puñetazo, patada, cabezazo u otro golpe enérgico contra un objetivo a 1,5 m o menos. Elige uno de estos efectos:<\/p>\n      <p><b>Daño.<\/b> Tirada de ataque con tu modificador por Fuerza + bonificador por competencia. Si aciertas, el objetivo sufre 1 + tu modificador por Fuerza de daño contundente.<\/p>\n      <p><b>Agarre.<\/b> El objetivo supera una salvación de Fuerza o Destreza (a su elección, CD 8 + tu mod. Fuerza + bonificador por competencia) o queda agarrado. Necesitas una mano libre y el objetivo puede ser como mucho una categoría de tamaño mayor que tú.<\/p>\n      <p><b>Empujón.<\/b> Misma salvación y CD; si falla, lo empujas 1,5 m o lo derribas. Mismo límite de tamaño.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"agarrar\">\n      <div class=\"fhead\"><span class=\"fname\">Agarrar <span class=\"en\">Grappling<\/span><\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Agarrar a una criatura le impone el estado de <a href=\"#agarrado\">agarrado<\/a>. Solo puedes agarrar a una criatura por mano (o por tentáculo, fauces u otra parte del cuerpo, según el perfil).<\/p>\n      <p><b>Escapar.<\/b> La criatura agarrada usa su acción para una prueba de Fuerza (Atletismo) o Destreza (Acrobacias) contra la CD de escape; si la supera, termina el estado.<\/p>\n      <p><b>Fin del agarre.<\/b> También termina si quien agarra queda incapacitado o si la distancia entre ambos supera el alcance del agarre. Quien agarra puede soltar en cualquier momento, sin acción.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"ataques-de-oportunidad\">\n      <div class=\"fhead\"><span class=\"fname\">Ataques de oportunidad<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Puedes hacerlo cuando una criatura que puedas ver sale de tu alcance usando su acción, acción adicional, reacción o cualquiera de sus velocidades. Usas tu reacción para un ataque cuerpo a cuerpo con arma o sin armas, justo antes de que salga de tu alcance.<\/p>\n      <p><b>Evitarlo.<\/b> La acción de destrabarse lo evita. Tampoco se provoca si te teletransportas o si algo te mueve sin gastar tu movimiento, acción, acción adicional ni reacción.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"combate-montado\">\n      <div class=\"fhead\"><span class=\"fname\">Combate montado<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p>Puedes usar como montura cualquier criatura voluntaria al menos una categoría de tamaño superior a ti, con la anatomía adecuada.<\/p>\n      <p><b>Montar y desmontar.<\/b> Durante tu movimiento, montas o desmontas de una criatura a 1,5 m o menos de ti, gastando la mitad de tu velocidad (redondeada hacia abajo).<\/p>\n      <p><b>Controlar una montura.<\/b> Solo si está entrenada para aceptar jinete. Su iniciativa pasa a ser la tuya y se mueve en tu turno según tus órdenes, con solo tres acciones disponibles: correr, destrabarse o esquivar. Una montura independiente conserva su propio orden de iniciativa y actúa por su cuenta.<\/p>\n      <p><b>Caerse.<\/b> Si un efecto mueve a tu montura en contra de su voluntad, o si te derriban a ti o a ella mientras estás montado, salvación de Destreza CD 10 — si fallas, caes con el estado de derribado en un espacio libre a 1,5 m de la montura.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"combate-bajo-el-agua\">\n      <div class=\"fhead\"><span class=\"fname\">Combate bajo el agua<\/span><span class=\"tag\">combate<\/span><\/div>\n      <p><b>Armas inadecuadas.<\/b> Un ataque cuerpo a cuerpo bajo el agua tiene desventaja si careces de velocidad nadando, salvo que el arma cause daño perforante. Un ataque a distancia bajo el agua falla automáticamente más allá del alcance normal, y tiene desventaja dentro de él.<\/p>\n      <p><b>Resistencia al fuego.<\/b> Todo lo que esté bajo el agua tiene resistencia al daño de fuego.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"dano-y-curacion\">\n  <h2>Daño y curación<\/h2>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"puntos-de-golpe\">\n      <div class=\"fhead\"><span class=\"fname\">Puntos de golpe<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Miden el aguante físico y la voluntad de vivir. Tus PG actuales pueden oscilar entre tu máximo y 0. El daño se resta y no afecta tus capacidades mientras no llegues a 0.<\/p>\n      <p><b>Maltrecho.<\/b> Tienes la mitad de tus PG o menos. No tiene efecto propio, pero puede desencadenar otros efectos.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"tiradas-de-dano\">\n      <div class=\"fhead\"><span class=\"fname\">Tiradas de daño<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Tiras los dados de daño, sumas los modificadores y aplicas el resultado. Un penalizador puede reducir el daño a 0, nunca a negativo.<\/p>\n      <p>Al atacar con un arma, sumas el mismo modificador por característica que usaste en la tirada de ataque. Los conjuros indican qué dados tirar y si suman modificador. Salvo que una regla diga lo contrario, no sumas tu modificador a un daño fijo que no use tirada.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"criticos\">\n      <div class=\"fhead\"><span class=\"fname\">Críticos<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Tiras los dados de daño del ataque dos veces, sumas ambos resultados y añades los modificadores una sola vez. Los dados de daño adicionales (como el Ataque furtivo del pícaro) también se tiran dos veces.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"salvaciones-y-dano\">\n      <div class=\"fhead\"><span class=\"fname\">Tiradas de salvación y daño<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p><b>Daño contra varios objetivos.<\/b> Si un efecto obliga a dos o más objetivos a salvar al mismo tiempo, el daño se tira una sola vez para todos.<\/p>\n      <p><b>Mitad del daño.<\/b> Al superar la tirada, muchos efectos causan la mitad del daño (redondeado hacia abajo) que habrías sufrido al fallarla.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"tipos-de-dano\">\n      <div class=\"fhead\"><span class=\"fname\">Tipos de daño<\/span><span class=\"tag\">daño<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Tipo<\/th><th>Ejemplos<\/th><\/tr>\n        <tr><td>Ácido<\/td><td>Enzimas digestivas, líquidos corrosivos<\/td><\/tr>\n        <tr><td>Contundente<\/td><td>Aplastamientos, caídas, objetos romos<\/td><\/tr>\n        <tr><td>Cortante<\/td><td>Garras, objetos cortantes<\/td><\/tr>\n        <tr><td>Frío<\/td><td>Agua gélida, ráfagas heladas<\/td><\/tr>\n        <tr><td>Fuego<\/td><td>Calor insoportable, llamas<\/td><\/tr>\n        <tr><td>Fuerza<\/td><td>Energía mágica pura<\/td><\/tr>\n        <tr><td>Necrótico<\/td><td>Energía que absorbe la vida<\/td><\/tr>\n        <tr><td>Perforante<\/td><td>Colmillos, objetos punzantes<\/td><\/tr>\n        <tr><td>Psíquico<\/td><td>Energía que desgarra la mente<\/td><\/tr>\n        <tr><td>Radiante<\/td><td>Energía sagrada, radiación abrasadora<\/td><\/tr>\n        <tr><td>Relámpago<\/td><td>Electricidad<\/td><\/tr>\n        <tr><td>Trueno<\/td><td>Sonido conmocionador<\/td><\/tr>\n        <tr><td>Veneno<\/td><td>Gas tóxico, veneno<\/td><\/tr>\n      <\/table>\n    <\/div>\n\n    <div class=\"fcard\" id=\"resistencia-vulnerabilidad-inmunidad\">\n      <div class=\"fhead\"><span class=\"fname\">Resistencia, vulnerabilidad e inmunidad<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p><b>Resistencia.<\/b> El daño de ese tipo se reduce a la mitad (redondeando hacia abajo).<\/p>\n      <p><b>Vulnerabilidad.<\/b> El daño de ese tipo se duplica.<\/p>\n      <p><b>Inmunidad.<\/b> No recibes daño de ese tipo, o el estado no te afecta si la inmunidad es a un estado.<\/p>\n      <p><b>No se acumulan.<\/b> Varias resistencias o vulnerabilidades al mismo tipo cuentan como una sola.<\/p>\n      <p><b>Orden de aplicación.<\/b> Primero los ajustes (bonificadores, penalizadores, multiplicadores), después las resistencias, y por último las vulnerabilidades. Ejemplo: 28 de daño de fuego, con un aura que reduce todo el daño en 5 y una criatura con resistencia a todo el daño y vulnerabilidad al fuego → 28−5=23, a la mitad por resistencia (redondeado) = 11, al doble por vulnerabilidad = 22.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"curacion\">\n      <div class=\"fhead\"><span class=\"fname\">Curación<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Se recuperan PG con magia (como <i>curar heridas<\/i> o una poción) o con un descanso corto o largo. Los PG recuperados se suman a los actuales sin superar el máximo — el excedente se pierde.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"llegar-a-0-puntos-de-golpe\">\n      <div class=\"fhead\"><span class=\"fname\">Llegar a 0 puntos de golpe<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p><b>Muerte de monstruos.<\/b> Un monstruo muere en cuanto sus PG llegan a 0 (salvo que el DM decida tratarlo como personaje).<\/p>\n      <p><b>PG máximos de 0.<\/b> Una criatura muere si sus PG máximos llegan a 0.<\/p>\n      <p><b>Daño considerable.<\/b> Si el daño reduce tus PG a 0 y sobra daño por asignar, mueres si ese sobrante es igual o mayor que tus PG máximos.<\/p>\n      <p><b>Caer inconsciente.<\/b> Si tus PG llegan a 0 sin morir al instante, tienes el estado de inconsciente hasta recuperar algún PG, y debes hacer tiradas de salvación contra muerte.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"salvacion-contra-muerte\">\n      <div class=\"fhead\"><span class=\"fname\">Tirada de salvación contra muerte<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Al empezar tu turno con 0 PG, tiras 1d20 sin ningún modificador. 10 o más es éxito; menos de 10 es fallo.<\/p>\n      <p><b>Tres de un tipo.<\/b> Al tercer éxito te estabilizas; al tercer fallo mueres. No hace falta que sean consecutivos.<\/p>\n      <p><b>Sacar 1 o 20.<\/b> Un 1 cuenta como dos fallos; un 20 te devuelve 1 PG.<\/p>\n      <p><b>Daño con 0 PG.<\/b> Recibir cualquier daño con 0 PG cuenta como un fallo; si es un crítico, cuenta como dos. Si el daño iguala o supera tus PG máximos, mueres.<\/p>\n      <p><b>Estabilizar.<\/b> Acción de ayudar con prueba de Sabiduría (Medicina) CD 10. Una criatura estable no tira más salvaciones contra muerte pero sigue inconsciente; si sufre daño, deja de estar estable. Sin curación, recupera 1 PG tras 1d4 horas.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"estable\">\n      <div class=\"fhead\"><span class=\"fname\">Estable <span class=\"en\">Stable<\/span><\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Una criatura está estable si tiene 0 puntos de golpe pero no debe hacer tiradas de salvación contra muerte. Sigue con el estado de inconsciente. Si sufre daño, deja de estar estable y vuelve a tirar salvaciones contra muerte. Sin curación, recupera 1 PG tras 1d4 horas.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"noquear-a-una-criatura\">\n      <div class=\"fhead\"><span class=\"fname\">Noquear a una criatura<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p>Si un ataque cuerpo a cuerpo reduciría a una criatura a 0 PG, puedes optar por dejarla en 1 PG. Queda inconsciente y comienza un descanso corto. Se mantiene inconsciente hasta recuperar algún PG o hasta que alguien supere una prueba de Sabiduría (Medicina) CD 10 para administrarle primeros auxilios.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"puntos-de-golpe-temporales\">\n      <div class=\"fhead\"><span class=\"fname\">Puntos de golpe temporales<\/span><span class=\"tag\">daño<\/span><\/div>\n      <p><b>Se pierden primero.<\/b> Si sufres daño teniéndolos, se restan de ahí antes que de tus PG normales.<\/p>\n      <p><b>Duración.<\/b> Hasta consumirse o hasta terminar un descanso largo.<\/p>\n      <p><b>No se acumulan.<\/b> Si ya tienes y recibes más, eliges cuáles conservar — no se suman.<\/p>\n      <p><b>No son PG ni curación.<\/b> No se pueden recuperar mediante curación, y recibirlos no cuenta como curación. No te devuelven la consciencia si tienes 0 PG.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"exploracion\">\n  <h2>Exploración<\/h2>\n  <p class=\"section-note\">Orden de marcha: conviene fijarlo al desplazarse — determina a quién afectan las trampas, quién detecta enemigos ocultos y quién queda más cerca si estalla un combate.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"vision-e-iluminacion\">\n      <div class=\"fhead\"><span class=\"fname\">Visión e iluminación<\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p><b>Ligeramente oscuro<\/b> (luz tenue, neblina dispersa, follaje moderado). Desventaja en Sabiduría (Percepción) que dependa de la vista.<\/p>\n      <p><b>Muy oscuro<\/b> (oscuridad, niebla espesa, follaje denso). Tienes el estado de cegado al tratar de ver algo ahí.<\/p>\n      <p><b>Luz brillante.<\/b> Permite ver con normalidad. <b>Luz tenue.<\/b> Zona ligeramente oscura, frontera entre luz y oscuridad. <b>Oscuridad.<\/b> Zona muy oscura.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"sentir-vibraciones\">\n      <div class=\"fhead\"><span class=\"fname\">Sentir vibraciones <span class=\"en\">Tremorsense<\/span><\/span><span class=\"tag\">sentido<\/span><\/div>\n      <p>Localiza criaturas y objetos en movimiento dentro de un alcance, siempre que ambos estén en contacto con la misma superficie o líquido. No detecta nada en el aire y no cuenta como visión.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"vision-ciega\">\n      <div class=\"fhead\"><span class=\"fname\">Visión ciega <span class=\"en\">Blindsight<\/span><\/span><span class=\"tag\">sentido<\/span><\/div>\n      <p>Ves dentro de un alcance sin recurrir a la vista, incluso tras cobertura completa no; incluye ver a través del estado de cegado o la oscuridad, y detectar criaturas invisibles.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"vision-en-la-oscuridad\">\n      <div class=\"fhead\"><span class=\"fname\">Visión en la oscuridad <span class=\"en\">Darkvision<\/span><\/span><span class=\"tag\">sentido<\/span><\/div>\n      <p>Dentro del alcance, ves con luz tenue como si fuera brillante, y en la oscuridad como si fuera luz tenue (solo tonos de gris).<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"vision-verdadera\">\n      <div class=\"fhead\"><span class=\"fname\">Visión verdadera <span class=\"en\">Truesight<\/span><\/span><span class=\"tag\">sentido<\/span><\/div>\n      <p>Dentro del alcance ves en la oscuridad normal y mágica, a criaturas invisibles, atraviesas ilusiones visuales (superando automáticamente sus salvaciones), distingues la forma verdadera de algo transformado, y ves en el Plano Etéreo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"objetos\">\n      <div class=\"fhead\"><span class=\"fname\">Interactuar con objetos<\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p><b>Qué es un objeto.<\/b> Un elemento específico e inanimado (ventana, puerta, espada, libro, mesa, silla, piedra) — no un edificio o vehículo compuesto de muchos objetos.<\/p>\n      <p><b>Tiempo limitado.<\/b> En situaciones apremiantes (como en combate), tienes una interacción gratuita por turno como parte de tu movimiento o acción. Cualquier otra requiere la acción de utilizar.<\/p>\n      <p><b>Encontrar objetos escondidos.<\/b> Si examinas las proximidades de algo oculto, el DM suele pedir Sabiduría (Percepción). Si registras un sitio que no está próximo al objeto, la prueba no revela su paradero, aciertes o no.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"capacidad-de-carga\">\n      <div class=\"fhead\"><span class=\"fname\">Capacidad de carga<\/span><span class=\"tag\">exploración<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Tamaño<\/th><th>Máximo<\/th><th>Arrastrar / levantar / empujar<\/th><\/tr>\n        <tr><td>Diminuto<\/td><td>Fue × 3,75 kg<\/td><td>Fue × 7,5 kg<\/td><\/tr>\n        <tr><td>Pequeño / Mediano<\/td><td>Fue × 7,5 kg<\/td><td>Fue × 15 kg<\/td><\/tr>\n        <tr><td>Grande<\/td><td>Fue × 15 kg<\/td><td>Fue × 30 kg<\/td><\/tr>\n        <tr><td>Enorme<\/td><td>Fue × 30 kg<\/td><td>Fue × 60 kg<\/td><\/tr>\n        <tr><td>Gargantuesco<\/td><td>Fue × 60 kg<\/td><td>Fue × 120 kg<\/td><\/tr>\n      <\/table>\n      <p>Si arrastras, levantas o empujas más del máximo, tu velocidad no supera 1,5 m.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"romper-objetos\">\n      <div class=\"fhead\"><span class=\"fname\">Romper objetos<\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p>Como acción, rompes automáticamente un objeto no mágico frágil (vidrio, papel). Para algo más resistente, usa estas tablas.<\/p>\n      <table class=\"rule-table\">\n        <tr><th>CA<\/th><th>Sustancia<\/th><\/tr>\n        <tr><td>11<\/td><td>Tela, papel, cuerda<\/td><\/tr>\n        <tr><td>13<\/td><td>Cristal, vidrio, hielo<\/td><\/tr>\n        <tr><td>15<\/td><td>Madera<\/td><\/tr>\n        <tr><td>17<\/td><td>Piedra<\/td><\/tr>\n        <tr><td>19<\/td><td>Hierro, acero<\/td><\/tr>\n        <tr><td>21<\/td><td>Mithral<\/td><\/tr>\n        <tr><td>23<\/td><td>Adamantina<\/td><\/tr>\n      <\/table>\n      <table class=\"rule-table\">\n        <tr><th>Tamaño<\/th><th>Frágil<\/th><th>Resistente<\/th><\/tr>\n        <tr><td>Diminuto (botella, cerradura)<\/td><td>2 (1d4)<\/td><td>5 (2d4)<\/td><\/tr>\n        <tr><td>Pequeño (cofre, laúd)<\/td><td>3 (1d6)<\/td><td>10 (3d6)<\/td><\/tr>\n        <tr><td>Mediano (barril, candelabro)<\/td><td>4 (1d8)<\/td><td>18 (4d8)<\/td><\/tr>\n        <tr><td>Grande (carreta, mesa)<\/td><td>5 (1d10)<\/td><td>27 (5d10)<\/td><\/tr>\n      <\/table>\n      <p><b>Umbral de daño.<\/b> Objetos grandes suelen tener inmunidad a todo el daño salvo que un único ataque o efecto iguale o supere su umbral — entonces sufren todo ese daño. Lo que no llega al umbral es superficial y no reduce sus PG.<\/p>\n      <p><b>Tipos de daño y objetos.<\/b> Los objetos tienen inmunidad al daño psíquico y de veneno. El contundente sirve para destrozar, no para cortar. El papel y la tela pueden ser vulnerables al fuego.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"asfixia\">\n      <div class=\"fhead\"><span class=\"fname\">Asfixia <span class=\"en\">Suffocation<\/span><\/span><span class=\"tag\">peligro<\/span><\/div>\n      <p>Aguantas la respiración 1 + tu modificador por Constitución en minutos (mínimo 30 segundos) antes de empezar a asfixiarte. Sin aire o ahogándote, sumas 1 nivel de cansancio al final de cada turno. Al recuperar el aliento, pierdes todos los niveles de cansancio sumados por asfixia.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"caidas\">\n      <div class=\"fhead\"><span class=\"fname\">Caídas <span class=\"en\">Falling<\/span><\/span><span class=\"tag\">peligro<\/span><\/div>\n      <p>1d6 de daño contundente por cada 3 m caídos, hasta 20d6 máximo. Caes de bruces y derribado, salvo que evites el daño. Si caes al agua, puedes usar tu reacción y una prueba de Fuerza (Atletismo) o Destreza (Acrobacias) CD 15 para entrar de cabeza o de pie; si la superas, el daño se reduce a la mitad.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"deshidratacion\">\n      <div class=\"fhead\"><span class=\"fname\">Deshidratación <span class=\"en\">Dehydration<\/span><\/span><span class=\"tag\">peligro<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Tamaño<\/th><th>Agua/día<\/th><th>Tamaño<\/th><th>Agua/día<\/th><\/tr>\n        <tr><td>Diminuto<\/td><td>1 l<\/td><td>Grande<\/td><td>16 l<\/td><\/tr>\n        <tr><td>Pequeño<\/td><td>4 l<\/td><td>Enorme<\/td><td>64 l<\/td><\/tr>\n        <tr><td>Mediano<\/td><td>4 l<\/td><td>Gargantuesco<\/td><td>256 l<\/td><\/tr>\n      <\/table>\n      <p>Si bebes menos de la mitad del agua necesaria, sumas 1 nivel de cansancio al final del día. No se elimina hasta beber la cantidad completa.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"desnutricion\">\n      <div class=\"fhead\"><span class=\"fname\">Desnutrición <span class=\"en\">Malnutrition<\/span><\/span><span class=\"tag\">peligro<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Tamaño<\/th><th>Comida/día<\/th><th>Tamaño<\/th><th>Comida/día<\/th><\/tr>\n        <tr><td>Diminuto<\/td><td>125 g<\/td><td>Grande<\/td><td>2 kg<\/td><\/tr>\n        <tr><td>Pequeño<\/td><td>0,5 kg<\/td><td>Enorme<\/td><td>8 kg<\/td><\/tr>\n        <tr><td>Mediano<\/td><td>0,5 kg<\/td><td>Gargantuesco<\/td><td>32 kg<\/td><\/tr>\n      <\/table>\n      <p>Comer menos de la mitad: salvación de Constitución CD 10 o 1 nivel de cansancio al final del día. Sin comer nada 5 días: 1 nivel automático al quinto día, y otro más cada día siguiente sin comer. No se elimina hasta comer la cantidad completa.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"fuego\">\n      <div class=\"fhead\"><span class=\"fname\">Fuego <span class=\"en\">Fire<\/span><\/span><span class=\"tag\">peligro<\/span><\/div>\n      <p>Una criatura u objeto que arda sufre 1d4 de daño de fuego al principio de cada uno de sus turnos. Como acción, puedes apagarlo adoptando el estado de derribado y rodando por el suelo. También se extingue si se moja, se sumerge o se ahoga.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"trepar\">\n      <div class=\"fhead\"><span class=\"fname\">Trepar <span class=\"en\">Climbing<\/span><\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p>Cada metro de movimiento cuesta 1 m adicional (2 m adicionales en terreno difícil). Una velocidad trepando ignora este coste. A discreción del DM, trepar una superficie resbaladiza o con pocos agarres puede requerir Fuerza (Atletismo) CD 15.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"nadar\">\n      <div class=\"fhead\"><span class=\"fname\">Nadar <span class=\"en\">Swimming<\/span><\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p>Cada metro de movimiento cuesta 1 m adicional (2 m adicionales en terreno difícil). Una velocidad nadando ignora este coste. A discreción del DM, avanzar por aguas revueltas puede requerir Fuerza (Atletismo) CD 15.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"arrastrarse\">\n      <div class=\"fhead\"><span class=\"fname\">Arrastrarse <span class=\"en\">Crawling<\/span><\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p>Cada metro de movimiento cuesta 1 m adicional (2 m adicionales en terreno difícil).<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"saltar\">\n      <div class=\"fhead\"><span class=\"fname\">Saltar <span class=\"en\">Jumping<\/span><\/span><span class=\"tag\">exploración<\/span><\/div>\n      <p><b>Salto de longitud.<\/b> Hasta 30 cm × tu puntuación de Fuerza si recorres al menos 3 m antes de saltar; la mitad sin carrerilla. Cada metro saltado gasta 1 m de movimiento. Si aterrizas en terreno difícil: Destreza (Acrobacias) CD 10 o quedas derribado. Superar un obstáculo de hasta un cuarto de la distancia puede pedir Fuerza (Atletismo) CD 10.<\/p>\n      <p><b>Salto de altura.<\/b> Asciendes 90 cm + 30 cm × tu modificador por Fuerza (mínimo 0) con al menos 3 m de carrerilla; la mitad sin ella. Puedes estirar los brazos la mitad de tu altura por encima de ti.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"viajar\">\n      <div class=\"fhead\"><span class=\"fname\">Ritmo de viaje<\/span><span class=\"tag\">exploración<\/span><\/div>\n      <table class=\"rule-table\">\n        <tr><th>Ritmo<\/th><th>Por minuto<\/th><th>Por hora<\/th><th>Por día<\/th><\/tr>\n        <tr><td>Rápido<\/td><td>120 m<\/td><td>6 km<\/td><td>45 km<\/td><\/tr>\n        <tr><td>Normal<\/td><td>90 m<\/td><td>4,5 km<\/td><td>36 km<\/td><\/tr>\n        <tr><td>Lento<\/td><td>60 m<\/td><td>3 km<\/td><td>27 km<\/td><\/tr>\n      <\/table>\n      <p><b>Rápido.<\/b> Desventaja en Sabiduría (Percepción o Supervivencia) y Destreza (Sigilo). <b>Normal.<\/b> Desventaja en Destreza (Sigilo). <b>Lento.<\/b> Ventaja en Sabiduría (Percepción o Supervivencia).<\/p>\n      <p>A caballo u otra montura, el grupo puede duplicar la distancia durante 1 hora; después la montura necesita un descanso corto o largo antes de repetirlo.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"conjuros\">\n  <h2>Reglas de conjuros<\/h2>\n  <p class=\"section-note\">Cómo funcionan los conjuros: obtenerlos, lanzarlos, escuelas, alcance, componentes, duración y efectos. Las descripciones de los 391 conjuros individuales no van aquí — esas viven en cada ficha de personaje.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"obtener-conjuros\">\n      <div class=\"fhead\"><span class=\"fname\">Obtener conjuros<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>Para lanzar un conjuro debes prepararlo en tu mente o acceder a él mediante un objeto mágico, como un pergamino de conjuro. Tus rasgos indican qué conjuros tienes, cuáles tienes siempre preparados y si puedes cambiar tu lista.<\/p>\n      <table class=\"rule-table\">\n        <tr><th>Clase<\/th><th>¿Cuándo cambia?<\/th><th>Cantidad<\/th><\/tr>\n        <tr><td>Bardo<\/td><td>Al subir de nivel<\/td><td>Uno<\/td><\/tr>\n        <tr><td>Brujo<\/td><td>Al subir de nivel<\/td><td>Uno<\/td><\/tr>\n        <tr><td>Clérigo<\/td><td>Al finalizar un descanso largo<\/td><td>Cualquiera<\/td><\/tr>\n        <tr><td>Druida<\/td><td>Al finalizar un descanso largo<\/td><td>Cualquiera<\/td><\/tr>\n        <tr><td>Explorador<\/td><td>Al finalizar un descanso largo<\/td><td>Uno<\/td><\/tr>\n        <tr><td>Hechicero<\/td><td>Al subir de nivel<\/td><td>Uno<\/td><\/tr>\n        <tr><td>Mago<\/td><td>Al finalizar un descanso largo<\/td><td>Cualquiera<\/td><\/tr>\n        <tr><td>Paladín<\/td><td>Al finalizar un descanso largo<\/td><td>Uno<\/td><\/tr>\n      <\/table>\n      <p><b>Conjuros siempre preparados.<\/b> Si un rasgo te los otorga, no cuentan para el total de tu lista modificable.<\/p>\n      <p><b>Lanzar con armadura.<\/b> Necesitas entrenamiento con la armadura que llevas puesta; de lo contrario, es un lastre excesivo para lanzar conjuros.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"espacios-de-conjuro\">\n      <div class=\"fhead\"><span class=\"fname\">Nivel y espacios de conjuro<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>Todo conjuro tiene un nivel de 0 a 9. Los de nivel 0 son trucos, casi rutinarios de lanzar.<\/p>\n      <p>Un espacio de conjuro representa tu potencial mágico. Al lanzar un conjuro de nivel 1 o superior, gastas un espacio de ese nivel o de uno mayor — un conjuro de nivel 1 cabe en cualquier espacio, pero uno de nivel 2 necesita espacio de nivel 2 como mínimo. Los espacios gastados se recuperan tras un descanso largo.<\/p>\n      <p><b>Espacio de nivel superior.<\/b> Si usas un espacio de mayor nivel que el conjuro, este pasa a ser del nivel del espacio para ese lanzamiento. Algunos conjuros se vuelven más potentes así, como indica su descripción.<\/p>\n      <p><b>Un espacio por turno.<\/b> Solo puedes gastar un espacio de conjuro por turno, aunque tengas acción y acción adicional disponibles.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"lanzar-sin-espacios\">\n      <div class=\"fhead\"><span class=\"fname\">Lanzar sin gastar espacios<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p><b>Trucos.<\/b> Se lanzan sin espacio de conjuro.<\/p>\n      <p><b>Rituales.<\/b> Un conjuro marcado \"ritual\" puede lanzarse así: 10 minutos más de tiempo, sin gastar espacio. Debes tenerlo preparado.<\/p>\n      <p><b>Capacidades especiales.<\/b> Algunos rasgos permiten lanzar conjuros concretos sin espacio, normalmente con otro límite (como \"una vez al día\").<\/p>\n      <p><b>Objetos mágicos.<\/b> Pergaminos de conjuro y objetos similares permiten lanzar sin espacio; su descripción indica cuántas veces.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"escuela-magica\">\n      <div class=\"fhead\"><span class=\"fname\">Escuela mágica<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>Cada conjuro pertenece a una escuela. No tienen regla propia, pero otras reglas las referencian.<\/p>\n      <table class=\"rule-table\">\n        <tr><th>Escuela<\/th><th>Efectos típicos<\/th><\/tr>\n        <tr><td>Abjuración<\/td><td>Impide o deshace efectos dañinos<\/td><\/tr>\n        <tr><td>Adivinación<\/td><td>Revela información<\/td><\/tr>\n        <tr><td>Conjuración<\/td><td>Transporta criaturas u objetos<\/td><\/tr>\n        <tr><td>Encantamiento<\/td><td>Influye en las mentes<\/td><\/tr>\n        <tr><td>Evocación<\/td><td>Canaliza energía, a menudo destructiva<\/td><\/tr>\n        <tr><td>Ilusionismo<\/td><td>Engaña a la mente o los sentidos<\/td><\/tr>\n        <tr><td>Nigromancia<\/td><td>Manipula la vida y la muerte<\/td><\/tr>\n        <tr><td>Transmutación<\/td><td>Transforma criaturas u objetos<\/td><\/tr>\n      <\/table>\n    <\/div>\n\n    <div class=\"fcard\" id=\"tiempo-de-lanzamiento\">\n      <div class=\"fhead\"><span class=\"fname\">Tiempo de lanzamiento<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>La mayoría de conjuros necesitan la acción de magia; otros piden acción adicional, reacción, o 1 minuto o más.<\/p>\n      <p><b>Reacción y acción adicional.<\/b> Si el tiempo de lanzamiento es una reacción, se lanza en respuesta al suceso que defina el conjuro. Algunos de acción adicional también responden a un suceso concreto.<\/p>\n      <p><b>Tiempos más largos.<\/b> Con 1 minuto o más, repites la acción de magia en cada turno y mantienes concentración mientras lanzas; si la pierdes, el conjuro falla sin gastar espacio y debes empezar de nuevo.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"alcance-conjuro\">\n      <div class=\"fhead\"><span class=\"fname\">Alcance<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p><b>Distancia.<\/b> Expresado en metros. <b>Toque.<\/b> El efecto se origina en algo que tocas dentro de tu alcance. <b>Lanzador.<\/b> El conjuro se lanza sobre ti o emana de ti.<\/p>\n      <p>Un efecto desplazable no queda restringido por el alcance, salvo que la descripción diga lo contrario.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"componentes\">\n      <div class=\"fhead\"><span class=\"fname\">Componentes<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p><b>Verbal (V).<\/b> Un canto pronunciado en voz normal; no funciona amordazado o en silencio mágico.<\/p>\n      <p><b>Somático (S).<\/b> Gestos enérgicos; necesitas al menos una mano libre.<\/p>\n      <p><b>Material (M).<\/b> Un objeto concreto; el conjuro no lo consume salvo que se indique. Puedes sustituir materiales sin coste por un saquito de componentes o un canalizador mágico, si tu rasgo lo permite.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"duracion-conjuro\">\n      <div class=\"fhead\"><span class=\"fname\">Duración<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p><b>Concentración.<\/b> Sigue las reglas de <a href=\"#concentracion\">concentración<\/a>. <b>Instantáneo.<\/b> Efecto momentáneo, luego desaparece. <b>Periodo de tiempo.<\/b> Dura lo indicado (asaltos, minutos, horas); puedes terminarlo tú mismo sin acción si no estás incapacitado.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"concentracion\">\n      <div class=\"fhead\"><span class=\"fname\">Concentración <span class=\"en\">Concentration<\/span><\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>Algunos conjuros y efectos requieren concentración para permanecer activos. Si el creador la pierde, el efecto concluye. Puedes dejar de concentrarte en cualquier momento, sin acción. La concentración se rompe por:<\/p>\n      <p><b>Otro efecto de concentración.<\/b> La pierdes en cuanto empiezas a lanzar otro conjuro o activas otro efecto que también requiera concentración.<\/p>\n      <p><b>Daño.<\/b> Si sufres daño: salvación de Constitución con CD 10 o la mitad del daño sufrido (la que sea mayor), hasta un máximo de 30.<\/p>\n      <p><b>Incapacitado o muerto.<\/b> La concentración termina si tienes el estado de incapacitado o mueres.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"efectos-conjuro\">\n      <div class=\"fhead\"><span class=\"fname\">Efectos<\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p><b>Objetivos.<\/b> Necesitas una ruta despejada (sin cobertura completa). Puedes elegirte a ti mismo salvo que el conjuro exija objetivo hostil o lo prohíba. Un objetivo no válido no sufre nada, pero el espacio de conjuro se gasta igual.<\/p>\n      <p><b>CD de salvación de conjuros = 8 + modificador por aptitud mágica + bonificador por competencia.<\/b><\/p>\n      <p><b>Modificador de ataque de conjuros = modificador por aptitud mágica + bonificador por competencia.<\/b><\/p>\n      <p><b>Combinar efectos.<\/b> Conjuros distintos se suman si sus duraciones se solapan. El mismo conjuro lanzado varias veces no se acumula — se aplica el efecto más potente, o el más reciente si son iguales.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"areas-de-efecto\">\n      <div class=\"fhead\"><span class=\"fname\">Áreas de efecto <span class=\"en\">Areas of Effect<\/span><\/span><span class=\"tag\">conjuros<\/span><\/div>\n      <p>Toda área tiene un <b>punto de origen<\/b> desde el que surge la energía. Un lugar queda fuera del área si todas las líneas rectas desde el origen hasta él están bloqueadas por cobertura completa.<\/p>\n      <p><b>Cono.<\/b> Se extiende desde el origen; su ancho en cualquier punto es igual a la distancia a ese origen. Origen no incluido, salvo que el creador decida lo contrario.<\/p>\n      <p><b>Cilindro.<\/b> Origen en el centro de su base circular superior o inferior; se define por radio y altura. Origen incluido.<\/p>\n      <p><b>Esfera.<\/b> Se extiende del origen en todas direcciones hasta su radio. Origen incluido.<\/p>\n      <p><b>Emanación.<\/b> Se extiende desde una criatura u objeto en todas direcciones y se mueve con su origen (salvo efectos instantáneos o estáticos). Origen no incluido, salvo decisión del creador.<\/p>\n      <p><b>Línea.<\/b> Trayectoria recta con longitud y anchura definidas. Origen no incluido, salvo decisión del creador.<\/p>\n      <p><b>Cubo.<\/b> El manual lo lista como sexta forma, pero su definición aún no está transcrita en la fuente — pendiente de agregar.<\/p>\n    <\/div>\n\n  <\/div>\n<\/section>\n\n<section id=\"equipo\">\n  <h2>Equipo<\/h2>\n  <p class=\"section-note\">Reglas del sistema de equipo: propiedades y maestrías de armas, armaduras y objetos mágicos. Las estadísticas de cada arma u objeto concreto viven en la ficha del personaje que lo lleva.<\/p>\n  <div class=\"grid\">\n\n    <div class=\"fcard\" id=\"propiedades-de-armas\">\n      <div class=\"fhead\"><span class=\"fname\">Propiedades de armas <span class=\"en\">Weapon Properties<\/span><\/span><span class=\"tag\">equipo<\/span><\/div>\n      <p><b>A dos manos (Two-Handed).<\/b> Requiere las dos manos.<\/p>\n      <p><b>Alcance (Range).<\/b> Dos números entre paréntesis: normal y largo, en metros. Más allá del normal, desventaja; más allá del largo, no puedes atacar.<\/p>\n      <p><b>Arrojadiza (Thrown).<\/b> Puedes lanzarla como ataque a distancia y desenvainarla como parte del ataque. Si es cuerpo a cuerpo, ataque y daño usan el mismo modificador que sus ataques cuerpo a cuerpo.<\/p>\n      <p><b>Gran alcance (Reach).<\/b> Tu alcance aumenta 1,5 m al atacar y para ataques de oportunidad con ella.<\/p>\n      <p><b>Ligera (Light).<\/b> Tras atacar con un arma ligera en la acción de atacar, puedes hacer un ataque extra como acción adicional con otra arma ligera; no sumas tu modificador al daño de ese extra salvo que sea negativo.<\/p>\n      <p><b>Munición (Ammunition).<\/b> Necesitas munición; extraerla es parte del ataque (mano libre para cargar armas de una mano). Tras un combate, 1 minuto recupera la mitad de la munición usada.<\/p>\n      <p><b>Pesada (Heavy).<\/b> Desventaja en las tiradas de ataque si tu Fuerza es menor que 13 (cuerpo a cuerpo) o tu Destreza menor que 13 (a distancia).<\/p>\n      <p><b>Recarga (Loading).<\/b> Solo una unidad de munición por acción, acción adicional o reacción, aunque pudieras hacer más ataques.<\/p>\n      <p><b>Sutil (Finesse).<\/b> Eliges Fuerza o Destreza para las tiradas de ataque y daño; el mismo modificador para ambas.<\/p>\n      <p><b>Versátil (Versatile).<\/b> A una o dos manos; entre paréntesis, el daño cuando se usa a dos manos.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"maestrias-de-armas\">\n      <div class=\"fhead\"><span class=\"fname\">Maestrías de armas <span class=\"en\">Weapon Mastery<\/span><\/span><span class=\"tag\">equipo<\/span><\/div>\n      <p>Cada arma tiene una propiedad de maestría, utilizable solo si un rasgo te lo permite (como Maestría con armas).<\/p>\n      <p><b>Debilitar (Sap).<\/b> Si aciertas, la criatura tiene desventaja en su próxima tirada de ataque antes del principio de tu siguiente turno.<\/p>\n      <p><b>Derribar (Topple).<\/b> Si aciertas, puedes obligarla a una salvación de Constitución (CD 8 + modificador usado en el ataque + bonificador por competencia); si falla, queda derribada.<\/p>\n      <p><b>Empujar (Push).<\/b> Si aciertas, puedes empujarla hasta 3 m en línea recta si es Grande o más pequeña.<\/p>\n      <p><b>Hender (Cleave).<\/b> Si aciertas cuerpo a cuerpo, puedes atacar a una segunda criatura a 1,5 m o menos de la primera y a tu alcance; el daño no suma tu modificador salvo que sea negativo. Una vez por turno.<\/p>\n      <p><b>Mellar (Nick).<\/b> El ataque extra de la propiedad ligera puede hacerse como parte de la acción de atacar en vez de como acción adicional. Una vez por turno.<\/p>\n      <p><b>Molestar (Vex).<\/b> Si aciertas y causas daño, tienes ventaja en tu siguiente tirada de ataque contra esa criatura antes del final de tu siguiente turno.<\/p>\n      <p><b>Ralentizar (Slow).<\/b> Si aciertas y causas daño, puedes reducir su velocidad en 3 m hasta el principio de tu siguiente turno; varios ataques no reducen más de 3 m en total.<\/p>\n      <p><b>Rozar (Graze).<\/b> Si fallas, puedes causar daño igual al modificador por característica usado en la tirada; del mismo tipo que el arma.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"armaduras\">\n      <div class=\"fhead\"><span class=\"fname\">Clase de armadura y entrenamiento <span class=\"en\">Armor Class &amp; Training<\/span><\/span><span class=\"tag\">equipo<\/span><\/div>\n      <p><b>CA base sin armadura = 10 + modificador por Destreza.<\/b> Si otra regla te da otro cálculo de CA base, eliges cuál usar — no se combinan.<\/p>\n      <p><b>Con armadura<\/b>, la CA base la fija la armadura: las ligeras suman tu Destreza completa, las medias suman Destreza hasta un máximo de +2, y las pesadas son un valor fijo. <b>Escudo:<\/b> +2 a la CA, solo con entrenamiento.<\/p>\n      <p><b>Sin entrenamiento<\/b> con la armadura puesta: desventaja en toda prueba con d20 que implique Fuerza o Destreza, y no puedes lanzar conjuros.<\/p>\n      <p><b>Solo un tipo.<\/b> No puedes llevar más de una armadura ni embrazar más de un escudo a la vez.<\/p>\n    <\/div>\n\n    <div class=\"fcard\" id=\"identificar-objeto-magico\">\n      <div class=\"fhead\"><span class=\"fname\">Identificar un objeto mágico <span class=\"en\">Identifying<\/span><\/span><span class=\"tag\">equipo<\/span><\/div>\n      <p>Con solo manipularlo percibes que tiene algo extraordinario, pero descubrir sus propiedades no es automático. El conjuro <i>identificar<\/i> es la vía más rápida. Alternativa: concéntrate en el objeto durante un descanso corto en contacto físico con él; al final, conoces sus propiedades y cómo usarlas (pero no si está maldito). Experimentar con el objeto también puede revelarlas.<\/p>\n    <\/div>\n\n    <div class=\"fcard\"
